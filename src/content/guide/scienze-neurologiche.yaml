id: g-vp9k44fa
title: Scienze neurologiche
anno_di_corso: V Anno
cfu_totali: 6
descrizione_generale: "L’esame è composto da due moduli, per un totale di 6 CFU: Neurologia (5 CFU) e Neurochirurgia (1 CFU). Il voto finale è calcolato come media ponderata dei due moduli. I due esami possono essere sostenuti in appelli separati, purché non trascorra più di un anno effettivo tra il conseguimento dei due moduli. Nell’a.a. 2025/2026, per Neurologia è stato concesso un preappello a gennaio esclusivamente agli studenti con il 100% di presenza."
moduli:
  - nome_modulo: Neurologia
    id: m-8q5v2laa
    cfu: 5
    exam_type: Orale
    study_time: 1 mese e mezzo
    preappello: Sì
    durata_orale_min: 20
    exam_details: L’esame è costituito da un unico orale, della durata indicativa di circa 20 minuti. Gli studenti vengono chiamati in ordine alfabetico, ma prima dell’inizio dell’orale la segretaria divide l’elenco tra i cinque professori. Generalmente vengono poste 3 domande, che procedono dal generale al particolare. Frequenza obbligatoria e controllata.
    program: |-
      **Le basi della neurologia**

      **Controllo motorio:**

      - Organizzazione del sistema motorio
      - Semeiotica della motricità
      - paralisi periferica e paralisi centrale

      **Sensibilità:**

      - Anatomo-fisiologia della sensibilità
      - I disturbi della sensibilità

      **Le grandi sindromi:**

      - Sindrome piramidale
      - Sindromi extrapiramidali
      - Sindrome cerebellare
      - Sindromi corticali

      **Le funzioni superiori:**

      - La vigilanza e i suoi disturbi (confusione mentale)
      - Linguaggio ed afasie
      - Aprassie
      - Agnosie
      - Disturbi della memoria

      **I comi:**

      - Fisiopatologia del coma
      - Esame generale e neurologico del malato comatoso
      - Scale di valutazione ed esami strumentali
      - Cause di coma
      - Prognosi
      - Morte cerebrale

      **Semeiologia dei nervi cranici:**

      - Nervo ottico e vie visive
      - Disturbi della oculomozione
      - Nervo trigemino
      - Nervo facciale
      - Altri nervi cranici (cenni)

      **Diagnostica strumentale:**

      - TC, RMN e angiografia: indicazioni e quadri neuroradiologici nelle principali patologie neurologiche
      - EEG, EMG, potenziali evocati, ECO-doppler
      - rachicentesi ed esame del liquor

      **Neurologia funzionale**

      **Crisi epilettiche ed epilessie:**

      - Definizioni
      - Incidenza e prevalenza
      - Classificazione clinico-EEG delle crisi epilettiche
      - Classificazione delle epilessie: i più importanti quadri sindromici
      - Eziologia e fisiopatogenesi delle crisi epilettiche
      - Iter diagnostico
      - Diagnosi differenziale
      - Prognosi
      - Terapia
      - problemi psico-sociali e medico-legali

      **Il sonno:**

      - Il sonno fisiologico
      - Metodiche di studio
      - La classificazione internazionale dei disturbi del sonno
      - Le insonnie
      - Le ipersonnie diurne

      **Cefalee e algie della faccia:**

      - Generalità: approccio al paziente con cefalea
      - Classificazione e diagnosi differenziale delle cefalee
      - Le sindromi cefalalgiche e il loro trattamento: emicrania con e senza aura
      - cefalea di tipo tensivo
      - Cefalea a grappolo
      - Nevralgia trigeminale
      - Forme particolari di cefalea: cefalea post-traumatica
      - Cefalea da sforzo e cefalee "pericolose"
      - Diagnostica strumentale e terapia: Indagini strumentali
      - Terapia farmacologica

      **Malattie neurodegenerative**

      **Demenze:**

      - La sindrome demenziale
      - Classificazione delle demenze
      - Demenze primarie o degenerative primarie: alterazioni istopatologiche, alterazioni biochimiche, eziopatogenesi, quadro clinico e diagnostica avanzata (marcatori biologici)
      - Demenze multinfartuali: eziopatogenesi, quadro clinico
      - Pseudodemenze: a genesi psichica o biologica
      - Demenze sottocorticali
      - Demenze trasmissibili (Jacob-Creutzfeldt)
      - Terapia delle demenze

      **Malattie extrapiramidali:**

      - Parkinson idiopatico: alterazioni dei neurotrasmettitori; eziopatogenesi; segni clinici (motori, neurovegetativi, psichici); decorso; trattamenti; sindrome del trattamento a lungo termine con L-dopa
      - Parkinsonismi atipici (es: paralisi sopranucleare progressiva)
      - Parkinsonismi secondari (es: jatrogeni, idrocefalo normoteso)
      - Corea di Huntington; altre coree (cenni)
      - Malattia di Wilson (cenni)
      - Semeiotica dei movimenti involontari patologici

      **Sclerosi laterale amiotrofica:**

      - Neuropatologia e eziopatogenesi
      - Quadro clinico sintomatologico
      - Decorso, diagnosi e trattamento

      **Malattie neurologiche disimmuni**

      **Sclerosi multipla:**

      - Classificazione delle malattie demielinizzanti infiammatorie del SNC
      - Epidemiologia
      - Eziologia e patogenesi: suscettibilità genetica, immunologia, virus
      - Anatomia patologica
      - Fisiopatologia dei sintomi e dei segni
      - Sintomi e segni clinici
      - Forme evolutive, storia naturale e prognosi
      - Esame del liquor
      - Diagnostica neuroradiologica e diagnosi differenziale mediante RMN
      - Neurofisiologia clinica
      - Criteri per la diagnosi clinica
      - Protocollo diagnostico clinico-strumentale
      - Diagnosi differenziale
      - Terapia della fase acuta
      - Terapie sintomatiche
      - Terapie disease-modifying
      - Neuromielite ottica, leucoencefalopatia progressiva multifocale, Sindrome di Guillain Barré, Neuropatia demielinizzante infiammatoria cronica (CIDP).

      **Malattie del sistema nervoso periferico e del muscolo**

      **Patologia dei nervi periferici:**

      - Processi anatomo-patologici: degenerazione walleriana, demielinizzazione segmentaria, degenerazione assonale
      - Sintomatologia delle neuropatie periferiche e approccio al paziente
      - Classificazione sindromica delle neuropatie periferiche
      - Le sindromi compressive
      - Le neuropatie tossiche e metaboliche (es: alcoolica e diabetica)
      - Le neuropatie disimmuni

      **Miopatie:**

      - Classificazione
      - Cenni di anatomia patologica
      - Semeiotica clinica e strumentale
      - Distrofie muscolari
      - Miopatie infiammatorie
      - Distrofia miotonica
      - Altre miopatie (cenni)

      **Miastenia gravis:**

      - clinica, decorso
      - alterazioni del timo e altre patologie associate
      - eziopatogenesi
      - diagnosi
      - trattamento
      - Sindrome miasteniforme di Lambert-Eaton (cenni)

      **Emergenze neurologiche**

      **Malattie cerebrovascolari:**

      - Generalità: epidemiologia
      - Fattori di rischio dello stroke
      - Patogenesi: infarto cerebrale aterotrombotico
      - Embolia cerebrale
      - Infarto lacunare
      - Emorragia intraparenchimale
      - Emorragia subaracnoidea.

      **Caratteristiche cliniche:** sintomatologia e decorso delle malattie cerebrovascolari in rapporto alla sede di lesione

      - Diagnosi differenziale
      - Terapia farmacologica e riabilitativa

      **Coma**

      **Infezioni del sistema nervoso centrale:** encefaliti, meningiti

      **Crisi miasteniche**

      **Poliradicoloneuriti acute**

      **Altre patologie neurologiche**

      **Neuro AIDS:**

      - Sindromi neurologiche nel periodo della sieroconversione
      - Sindromi neurologiche croniche
      - AIDS dementia complex

      **Complicanze neurologiche dell'alcoolismo:**

      - Delirium tremens
      - Encefalopatia di Wernicke
      - Sindrome di Korsakoff

      **Encefalopatie non infettive**

