    material_tips: |-
      **Sul programma**

      Il programma del syllabus viene richiesto nella sua interezza, con poca distinzione tra argomenti spiegati a lezione e argomenti non trattati. Fanno eccezione soprattutto: Neuroriabilitazione, che viene chiesta molto raramente e che la stessa Tassorelli dichiara di non chiedere. Non bisogna invece sottovalutare le atassie.

      La base di studio sono le sbobine 2022/2023, da integrare con il Bergamini. È consigliato controllare le sbobine dell’anno corrente per eventuali nuove linee guida o trattamenti più recenti. Dal Bergamini sono indicati: Capitolo 1 – fisiopatologia della mobilità (consigliato, non obbligatorio); Capitolo 2 – fisiopatologia della sensibilità (consigliato, non obbligatorio); Capitolo 4 – solo afasia, aprassia e agnosia; Capitolo 5 – sindromi del tronco encefalico; Capitolo 6 – sindromi dei nervi cranici; Capitolo 14 – solo parte sulla nevralgia trigeminale; Capitolo 16; Capitolo 19 – solo sclerosi multipla; Capitolo 29. Consigli: ripassare neuroanatomia e neurofisiologia prima di affrontare la clinica; utilizzare le domande degli anni precedenti, soprattutto per capire le preferenze dei singoli docenti. Per Neurologia le tempistiche dipendono anche da quanto siano fresche le conoscenze di neuroanatomia e neurofisiologia.
    body: |-
      **Domande e argomenti ricorrenti**

      - Avenali: Programma generale; domande ampie
      - Cosentino: Miopatie, EMG, ENG
      - Costa: Demenze, sclerosi multipla; domande molto precise
      - Tassorelli: Ictus e altre malattie cerebrovascolari, emorragie; semeiotica neurologica; locked-in syndrome; sindrome di Bernard-Horner
      - Terzaghi: Domande correlate tra loro sullo stesso argomento
    professors:
      - nome: Cristina Tassorelli
        email: cristina.tassorelli@unipv.it
        stile: "Titolare del corso. Pone 3 domande: la prima a scelta; la seconda su una malattia cerebrovascolare (ictus, emorragie), con studio obbligatorio dal libro; l’ultima orientata alla lode. Argomenti citati: locked-in syndrome, sindrome di Bernard-Horner. Apprezza riferimenti alla semeiotica neurologica e sicurezza nell’esposizione. Tende a interrogare gli ultimi dell’elenco."
      - nome: Alfredo Costa
        email: alfredo.costa@unipv.it
        stile: Molto puntiglioso. Non propone una domanda a scelta. Spazia su tutto il programma e richiede precisione. Lavora nell’ambito delle demenze, che devono quindi essere conosciute molto bene. La sclerosi multipla va studiata in maniera approfondita dal libro. È fondamentale consultare le domande degli anni precedenti.
      - nome: Michele Terzaghi
        stile: Molto disponibile e capace di mettere lo studente a proprio agio. Parte da una domanda a scelta. La seconda domanda è generalmente basata sull’argomento della prima. Spesso le due domande riguardano lo stesso argomento o argomenti correlati.
        email: michele.terzaghi@unipv.it
      - nome: Giuseppe Cosentino
        stile: È tranquillo e lascia ragionare. Gli argomenti più frequenti sono quelli da lui spiegati, in particolare miopatie, EMG ed ENG. Può porre anche domande secche. Spazia in misura più limitata sul resto del programma, per cui è particolarmente utile guardare le domande degli anni precedenti.
        email: giuseppe.cosentino@unipv.it
      - nome: Micol Avenali
        stile: È descritta come molto tranquilla e capace di mettere a proprio agio. Spesso inizia con una domanda a scelta, soprattutto con i primi studenti dell’elenco. Successivamente tende a non proporre più la scelta. Fa domande generiche e lascia parlare. Può spaziare su tutto il programma.
        email: micol.avenali@unipv.it
    fascia_studio: 5–8 sett
  - nome_modulo: Neurochirurgia
    id: m-4jygklkp
    cfu: 1
    exam_type: Orale
    study_time: 1 settimana
    exam_details: L’esame è orale e interroga esclusivamente il professor Magrassi. Viene posta una sola domanda. I voti sono generalmente alti, anche se possono risultare poco prevedibili. È consigliato sostenere Neurochirurgia insieme o dopo Neurologia, perché diversi argomenti si sovrappongono e Magrassi può talvolta spostarsi sulla parte neurologica, sempre in relazione alla domanda di Neurochirurgia.
    program: |-
      **Fisiopatologia e clinica della sindrome d'ipertensione endocranica:**

      metodi per la misurazione diretta ed indiretta della pressione endocranica, trattamenti farmacologici e neurochirurgici.

      **Traumi cranio-cerebrali:**

      - Generalità
      - Fratture craniche
      - Ematoma extradurale
      - Ematoma sottodurale acuto e subacuto
      - Ematoma sottodurale cronico
      - Contusioni e lacerazioni post-traumatiche
      - Liquorree post-traumatiche
      - Pneumoencefalo post-traumatico
      - Lesioni vascolari post-traumatiche
      - Indicazioni neurochirurgiche

      **Tumori primitivi e secondari dell'encefalo:**

      - Gliomi
      - Meningiomi
      - Neurinoma dell'acustico
      - Adenomi ipofisari
      - Tumori della regione sellare
      - Tumori cerebrali metastasici
      - Tumori cerebrali dell'infanzia
      - Tumori sopratentoriali
      - Indicazioni neurochirurgiche

      **Idrocefali:**

      - Circolazione liquorale
      - Idrocefalo classificazione
      - Eziologia
      - Clinica
      - Diagnosi strumentale
      - Trattamento
      - Idrocefalo comunicante normoteso
      - Quadro clinico
      - Diagnosi strumentale
      - Trattamento

      **Traumi vertebro-midollari:**

      - Fratture vertebrali
      - Concetto di stabilità/instabilità
      - Lesioni radicolo-midollari
      - Indicazioni di trattamento
      - Sequele

      **Lesioni congenite e degenerative del rachide:**

      - Eziopatogenesi
      - Anatomia e fisiologia
      - Fisiopatologia
      - Quadri clinici
      - Ernie discali
      - Stenosi lombare
      - Mielopatia spondilogena
      - Disrafismi
      - Siringomielia
      - Diagnosi
      - Prognosi
      - Terapia neurochirurgica

      **Tumori spinali e midollari.**

      - Clinica
      - Diagnosi strumentale
      - Lesioni metastatiche della colonna
      - Tumori intradurali extramidollari
      - Tumori intramidollari
      - Trattamento

      **Patologia cerebrovascolare di interesse neurochirurgico:**

      - Anatomia e fisiologia del circolo cerebrale
      - Ematomi intracerebrali spontanei
      - Emorragia subaracnoidea, aneurismi cerebrali, malformazioni artero-venose
      - Indicazioni al trattamento neurochirurgico delle patologia cerebrovascolare.

      **La nevralgia trigeminale, le sindromi da deafferentazione e il dolore neuropatico:**

      fisiopatologia, diagnosi e trattamenti neurochirurgici.

      **Patologie d'interesse neurochirurgico del sistema nervoso periferico.**

      Lesioni traumatiche dei nervi periferici e trattamento neurochirurgico, principali patologie compressive dei nervi periferici, la sindrome del tunnel carpale.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11236/2017/9999?coorte=2022&schemaid=17810).*
