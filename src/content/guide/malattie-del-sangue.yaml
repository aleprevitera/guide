      La classificazione delle malattie linfoproliferative: principi generali e significato clinico-patologico.

      Il linfoma di Hodgkin: classificazione, caratteristiche patologiche, patologia moleolare.

      I linfomi a cellule B periferiche: prinicpi generali, caratteristiche patologiche e basi molecolari delle entità più comuni (leucemia linfatica cronica, linfoma mantellare, linfoma follicolare, linfoma della zona marginale, linfomi B diffusi a grandi cellule)

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2024/10045/insegnamenti/2026/10671/2024/9999?coorte=2024&schemaid=17804).*
    material_tips: |-
      **Sul programma**

      Sul syllabus è presente tutto il programma. Prestare particolare attenzione alle diagnosi differenziali delle patologie e ai geni.

      Le sbobine più recenti sono sufficienti per preparare l’esame. È necessario svolgere le prove degli anni precedenti, anche per capire il meccanismo di risoluzione degli emocromi. Esiste una dispensa di vecchi quesiti molto utili per imparare il meccanismo; circolano inoltre vari file di domande più recenti, tra cui anche le prove del corso Harvey, che spesso si ripetono all’esame.
