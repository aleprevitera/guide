id: g-krp5gsa0
title: Malattie del Sangue
anno_di_corso: III Anno
moduli:
  - nome_modulo: Malattie del Sangue
    id: m-v0jgxqro
    exam_type: Scritto
    study_time: 15 giorni circa
    exam_details: L’esame consiste in uno scritto composto da 60 crocette. Le crocette spesso consistono in emocromi da interpretare soprattutto sulle varie anemie, leucemie e linfomi. Ci sono poi esercizi riguardanti la coagulazione del sangue e quesiti riguardo i geni responsabili delle patologie. Per ogni risposta sbagliata è prevista una penalità di -0,25.
    program: Sul syllabus è presente tutto il programma. Prestare particolare attenzione alle diagnosi differenziali delle patologie e ai geni.
    material_tips: Le sbobine più recenti sono sufficienti per preparare l’esame. È necessario svolgere le prove degli anni precedenti, anche per capire il meccanismo di risoluzione degli emocromi. Esiste una dispensa di vecchi quesiti molto utili per imparare il meccanismo; circolano inoltre vari file di domande più recenti, tra cui anche le prove del corso Harvey, che spesso si ripetono all’esame.
    fascia_studio: 1–2 sett
aggiornato_da: Lisa Ceci
ultimo_aggiornamento: 2026-10-03
