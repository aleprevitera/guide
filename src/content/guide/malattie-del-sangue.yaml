      La classificazione delle malattie linfoproliferative: principi generali e significato clinico-patologico.

      Il linfoma di Hodgkin: classificazione, caratteristiche patologiche, patologia moleolare.

      I linfomi a cellule B periferiche: prinicpi generali, caratteristiche patologiche e basi molecolari delle entità più comuni (leucemia linfatica cronica, linfoma mantellare, linfoma follicolare, linfoma della zona marginale, linfomi B diffusi a grandi cellule)

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2024/10045/insegnamenti/2026/10671/2024/9999?coorte=2024&schemaid=17804).*
    material_tips: |-
      **Sul programma**

      Il syllabus contiene il programma completo dell'esame. Nella preparazione è particolarmente importante prestare attenzione a:

      - diagnosi differenziali delle diverse patologie;
      - geni responsabili delle patologie.

      Le sbobine più recenti sono sufficienti per preparare l'esame. È fondamentale svolgere le prove degli anni precedenti, sia per esercitarsi sia per comprendere il meccanismo di risoluzione degli emocromi. In particolare, è disponibile una dispensa di vecchi quesiti molto utile per imparare il metodo di interpretazione degli emocromi. Circolano inoltre diversi file con domande più recenti, tra cui le prove del corso Harvey, che vengono spesso riproposte all'esame.
      Consigli pratici:

      - Studiare il programma completo indicato nel syllabus.
      - Non limitarsi allo studio teorico: è fondamentale esercitarsi con gli emocromi.
      - Utilizzare la dispensa dei vecchi quesiti per imparare il metodo di interpretazione degli emocromi.
      - Svolgere le prove degli anni precedenti.
      - Controllare anche i file di domande più recenti e le prove Harvey, perché alcune domande possono ripetersi.
      - Considerare la penalizzazione di −0,25 per le risposte errate quando ci si esercita con i quiz.
    body: |-
      **Domande e argomenti ricorrenti**

      - Emocromi: Interpretazione degli emocromi, soprattutto nelle diverse anemie
      - Ematologia oncologica: Leucemie e linfomi
      - Coagulazione: Esercizi e quesiti sulla coagulazione del sangue
      - Genetica: Geni responsabili delle patologie
      - Diagnosi differenziale: Distinzione tra le diverse patologie ematologiche
      - Domande ricorrenti: Prove degli anni precedenti e prove Harvey
