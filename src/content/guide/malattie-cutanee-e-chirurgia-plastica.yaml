      **ATTIVITA’ DIDATTICA INTERATTIVA DI CHIRURGIA PLASTICA**

      Vengono organizzate sessioni pratiche (hands on) a piccoli gruppi su modelli sperimentali in cui si istruiscono gli studenti ad effettuare le manovre elementari della piccola chirurgia.

      **ATTIVITA’ DIDATTICA ELETTIVA CHIRURGIA PLASTICA**

      Gli studenti vengono accolti a turni per effettuare un internato in Reparto per un periodo di 4 settimane.

      Gli studenti che intendono svolgere un internato di laurea vengono accettati dopo un’accurata e bilanciata valutazione del merito e delle attitudini.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2023/10045/insegnamenti/2026/11168/2017/9999?coorte=2023&schemaid=17807).*
    material_tips: |-
      **Sul programma**

      Programma interamente coperto dalle sbobine principali. Integrare con la sindrome del tunnel carpale, studiabile dal libro di testo/programmazione d'esame.

      Fonte principale: sbobine a due colonne 2019-2020, sufficienti per la preparazione. Aggiungere dal Faga la sindrome del tunnel carpale (presente anche nelle sbobine più recenti, ma integrabile dal libro).
