      Gli studenti vengono accolti a turni per effettuare un internato in Reparto per un periodo di 4 settimane.

      Gli studenti che intendono svolgere un internato di laurea vengono accettati dopo un’accurata e bilanciata valutazione del merito e delle attitudini.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2023/10045/insegnamenti/2026/11168/2017/9999?coorte=2023&schemaid=17807).*
    material_tips: |-
      **Sul programma**

      Il programma è sostanzialmente coperto dalle sbobine principali. È necessario integrare lo studio con la **sindrome del tunnel carpale**, presente anche nelle sbobine più recenti ma ulteriormente consultabile sul libro di testo.

      La fonte principale sono le **sbobine a due colonne 2019-2020**, che coprono sostanzialmente l'intero programma. Va aggiunta dal **Faga** la **sindrome del tunnel carpale**. L'argomento è presente anche nelle sbobine più recenti, ma può essere ulteriormente integrato dal libro. Non sembra quindi necessario integrare massicciamente il materiale con altre fonti.
    body: |-
      **Domande e argomenti ricorrenti**
      Le domande sono generalmente abbastanza dirette e vertono sugli argomenti trattati nelle sbobine. La **sindrome del tunnel carpale** è un argomento da integrare specificamente nella preparazione.
