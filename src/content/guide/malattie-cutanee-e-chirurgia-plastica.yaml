id: g-ug99qebv
title: Malattie cutanee e Chirurgia plastica
esse3_codice: "501802"
anno_di_corso: IV Anno
cfu_totali: 4
descrizione_generale: |-
  L'esame è composto da due moduli: **Dermatologia** e **Chirurgia plastica**. Entrambe le parti prevedono un esame orale.

  **Per completare l'esame è necessario sostenere Dermatologia e Chirurgia plastica entro una distanza massima di un appello.** Ad esempio: Dermatologia → appello di giugno; Chirurgia plastica → appello di luglio → ✅.

  Il voto finale è la **media aritmetica** dei due moduli.
moduli:
  - nome_modulo: Dermatologia
    id: m-a12glpvn
    exam_type: Orale
    study_time: 1 mese
    preappello: No
    exam_details: |-
      L'esame è **orale**. Gli studenti vengono generalmente chiamati in ordine, indicativamente secondo l'ordine alfabetico. La modalità dell'interrogazione varia molto in base al docente. L'esame può consistere in:

      - 2-3 domande dirette;
      - presentazione di un vetrino;
      - presentazione di un'immagine di una lesione;
      - una sorta di caso clinico, sul quale viene chiesto allo studente di ragionare.

      È quindi importante essere in grado di parlare dell'argomento in maniera ampia e ordinata, fornendo le informazioni pertinenti e dimostrando una visione complessiva della patologia.

      **Preappelli:** Non sono previsti preappelli regolari. L'organizzazione degli esami può essere piuttosto variabile: i diversi docenti possono arrivare in momenti differenti della giornata e gli orari effettivi dell'interrogazione possono quindi subire variazioni e ritardi.
    program: |-
      Per i programmi dei moduli di Malattie Cutanee e Chirurgia Pastica si rimanda ai rispettivi Syllabi.

      Il corso comprende i seguenti contenuti:

      - approccio al paziente con malattia cutanea, con elementi essenziali di struttura e funzione della cute, lesioni elementari, morfologia e distribuzione delle lesioni ed esame obiettivo dermatologico
      - principali malattie infiammatorie cutanee, incluse dermatite atopica e da contatto, eczema, psoriasi, acne e rosacea
      - comuni infezioni e infestazioni cutanee di origine batterica, fungina, virale e parassitaria
      - manifestazioni cutanee delle principali malattie sistemiche e immunomediate, incluse connettiviti, vasculiti e malattie bollose autoimmuni
      - reazioni cutanee da farmaci ed emergenze dermatologiche
      - tumori cutanei cheratinocitari, lesioni precancerose e principi di prevenzione, diagnosi e indicazione alla biopsia
      - lesioni melanocitarie, nevi, melanoma, principi di dermoscopia e comuni tumori cutanei benigni
      - principali infezioni sessualmente trasmesse e patologie genitali selezionate.

      Il corso comprende inoltre casi clinici integrati finalizzati allo sviluppo del ragionamento diagnostico e della correlazione clinico-patologica.

      - **Generalità sulla cute:** caratteri macroscopici e microscopici, fisiologia e funzioni.
      - **Lesioni elementari della cute** primitive e secondarie.
      - **Correlazioni clinico-patologiche lesioni elementari e secondarie**
      - **Pattern istopatologici reattivi della cute e correlazioni clinico-patologiche**
      - **Dermatosi parassitarie:** Scabbia, Pediculosi, Larva migrans, Leishmaniosi, tungiasi, miasi
      - **Micosi cutanee:** Micosi superficiali/dermatofizie (tinea capitis, tinea corporis), Candidosi, Pityriasis versicolor
      - **Dermatiti da batterii:** piodermiti (impetigo/erysipela/ Necrotizing fasciitis), folliculitis, foruncolo e foruncolosi
      - **Tubercolosi cutanea**, micobatteriosi atipiche
      - **Lebbra**
      - **Virosi cutanee:** Herpesvirus, Coxsackievirus, Papillomavirus, Poxvirus, orf, nodulo dei mungitori,
      - **Acne e varianti**, idrosadenite suppurativa
      - **Rosacea**
      - **Eczemi e dermatiti eczematiformi:** Dermatite da contatto irritativa (DIC) e allergica (DAC)
      - **Dermatite atopica**, ezema seborroico, disidrosi, eczema nummulare,
      - **Orticaria acuta e cronica**
      - **Patologie cutanee da farmaci:** esantemi, orticaria, eritema fisso da farmaco, eritema polimorfo, sindrome di Steven-Johnson, necrolisi epidermica tossica (sindrome di Lyell), sindrome DRESS
      - **Panniculiti**, con particolare riguardo a: eritema nodoso, panniculite lupica, eritema indurato di Bazin, panniculite da freddo, periarterite nodosa,
      - **lipodermatosclerosi**

      - Psoriasi
      - Pitiriasi rosea di Gibert
      - Eritrodermie (psoriasi, pitiriasi rubra pilare, iatrogena, sindrome di Sezary, eczematosa)
      - Connettiviti: Lupus eritematoso discoide cronico, LES, Lupus subacuto cutaneo, lupus panniculitico, lupus tumidus, Dermatomiosite, Sclerodermia sistemica progressiva, sindrome CREST e sclerodermia localizzata (morfea)
      - Dermatosi bollose autoimmuni: Pemfigo e varianti, Pemfigoide bolloso, pemfigoide cicatriziale/mucosinechiante, herpes gestationis, Dermatite erpetiforme, Dermatosi bollosa a Ig A lineari, epidermolisi bollosa congenita ed acquisita (EBA)
      - Aftosi e malattia di Behect
      - Lichen planus, GVHD
      - Vitiligine, melasma, pitiriasi alba
      - Fotoprotezione e fotodermatosi, porfiria cutanea tarda
      - Eritema ed ustione solare
      - Alopecie
      - "Precancerosi"/carcinomi in situ cutanei e della mucosa orale e genitale (cheratosi attinica, Morbo di Bowen, Morbo di Paget mammario ed extramammario, Eritroplasia di Queyrat, leucoplachia, eritroplachia)
      - Tumori epiteliali benigni e maligni: cheratosi seborroica, lentigo solare, dermatofibroma, carcinoma basocellulare, carcinoma spinocellulare, cheratoacantoma
      - Linfomi cutanei T (micosi fungoide Sindrome di Sezary, papulosi linfomatoide, linfoma T CD30+)
      - Linfomi cutanei B (follicolare, marginale, a grandi cellule)
      - Istiocitosi a cellule di Langerhans
      - Sarcoidosi
      - Porpore e vasculiti
      - Angiosarcoma, Morbo di Kaposi, angiomi e granuloma piogenico
      - Tumori mesenchimali (leiomioma, leiomiosarcoma, dermatofibroma, dermatofibrosarcoma, lipoma)
      - Tumori vascolari benigni e maligni (morbo di Kaposi, angiosarcoma)
      - Cisti, cheratosi seborroica
      - Nevi: nevi melanocitari
      - Principi di dermoscopia e sue principali applicazioni
      - Melanoma
      - Disordini della pigmentazione: vitiligine, albinismo, pitiriasi alba, melasma.
      - Ulcere cutanee (vascolari e non vascolari)
      - Patologia dell'apparato ungueale (infezioni fungine, batteriche, alterazioni ungueali in corso di dermatosi, tumori ungueali, melanoma ungueale)
      - Principi di terapia dermatologica topica e sistemica, terapia fisica
      - **Venereologia:** Sifilide, infezione gonococcica, uretriti non gonococciche, ulcera molle, linfogranuloma venereo, manifestazioni cutanee dell’ A.I.D.S., malattie a possibile trasmissione sessuale
      - Balanospostiti, Fimosi, Parafimosi.

      **Attivita’ didattica interattiva di dermatologia**

      1. Vengono organizzate sessioni pratiche (hands on) a piccoli gruppi presso l'ambulatorio di dermatologia chirurgica e si istruiscono gli studenti all'esecuzione di manovre basiche della piccola chirurgia dermatologica (escissioni semplici con sutura diretta, curettage, shaving, anestesia locale).

      2. Viene offerta la possibilità di partecipare in piccoli gruppi (4-6 studenti) agli incontri teorico-pratici di correlazione clinica ed istopatologica e agli incontri multidisciplinari di oncologia dermatologica che si tengono un giorno alla settimana presso la Dermatologia.

      3. Durante gli incontri teorico-pratici di correlazione clinico-patologica vengono presentati e discussi casi clinici di pazienti affetti da malattie della pelle (dermatiti, tumori, linfomi) a cui è stata effettuato il prelievo bioptico cutaneo ai fini diagnostici, i con proiezione di immagini cliniche ed istopatologiche e discussione collegiale tra dermatologi e anatomo-patologici per la formulazione della diagnosi corretta.

      **Attivita’ didattica elettiva di dermatologia**

      Gli studenti vengono accolti a turni per effettuare un internato in Reparto per un periodo di 4 settimane.

      Gli studenti che intendono svolgere un internato di laurea vengono accettati dopo un’accurata valutazione del merito e delle attitudini.

      - Lez. 1 Guarigione delle Ferite
      - Lez 2 Patologia Cicatriziale. Tecniche di sutura
      - Lez 3 Innesti cutanei; sostituti cutanei ingegnerizzati
      - Lez 4 Innesti non cutanei; chirurgia rigenerativa
      - Lez 5 I trapianti in chirurgia Plastica: concetti generali
      - Lez 6 Approfondimento sui trapianti in chirurgia Plastica
      - Lez 7 Impianti
      - Lez 8 Ustioni e lesioni assimilabili alle ustioni
      - Lez 9 Traumi del Viso / Traumi degli arti
      - Lez 10 Ulcere croniche e ferite difficili
      - Lez 11 Ricostruzione della mammella
      - Lez 12 Tumori cutanei
      - Lez 13 Malformazioni congenite
      - Lez 14 Chirurgia della mano
      - Lez. 15 Chirurgia Estetica: Generalità e problematiche etiche. Rinoplastica, Otoplastica, Blefaroplastica, Face Lifting
      - Lez 16 Chirurgia Estetica: Mastoplastica additiva, Mastopessi, Mastoplastica riduttiva, Addominoplastica, Liposcultura, Procedure di Medicina Estetica

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2023/10045/insegnamenti/2026/11168/2017/9999?coorte=2023&schemaid=17807).*
    material_tips: |-
      **Sul programma**

      Il programma è molto vasto e non ci sono argomenti che vengano richiesti sistematicamente più di altri. La scelta delle domande può variare molto in base al docente che interroga. È comunque consigliabile prestare particolare attenzione agli argomenti presenti nelle sbobine. In particolare, vengono richiesti frequentemente gli argomenti relativi a unghie e capelli. È importante non trascurare neppure gli argomenti considerati meno rilevanti: ad esempio, il sarcoma di Kaposi può essere richiesto abbastanza frequentemente.

      La fonte principale utilizzata è costituita dalle **sbobine a due colonne 2019-2020**, da integrare con alcuni argomenti presenti nelle **sbobine 2023-2024**. In particolare, dalle sbobine 2023-2024 vanno aggiunti:

      - Infezioni sessualmente trasmissibili
      - Dermatosi professionali
      - Dermatite irritativa da contatto
      - Dermatite allergica da contatto
      - Patologie delle unghie
      - Alopecia
      - Seminario sulla terapia dermatologica

      Dal **Core Curriculum** sono stati inoltre utilizzati:

      - Lichen
      - Leishmaniosi
      - Sarcoma di Kaposi
      - Tumori mesenchimali

      Questi ultimi argomenti risultano generalmente meno frequenti, ma il sarcoma di Kaposi, in particolare, può essere richiesto abbastanza spesso.

      Consigli: studiare in maniera completa, senza basarsi esclusivamente su una lista di argomenti frequenti; prestare attenzione a unghie e capelli; studiare bene gli argomenti presenti nelle sbobine; non trascurare gli argomenti indicati come meno frequenti; prestare particolare attenzione al sarcoma di Kaposi; prepararsi a modalità di interrogazione diverse.
    body: |-
      **Domande e argomenti ricorrenti**
      Non esiste un elenco di domande che venga riproposto sistematicamente: la scelta dipende molto dal docente che interroga. Tra gli argomenti che possono essere richiesti frequentemente:

      - Unghie
      - Capelli
      - Alopecia
      - Infezioni sessualmente trasmissibili
      - Dermatiti da contatto
      - Terapia dermatologica
      - Sarcoma di Kaposi

      È quindi consigliabile non trascurare gli argomenti apparentemente meno importanti, perché possono comunque essere oggetto di domanda.
