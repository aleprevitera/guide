    exam_details: |-
      Anche l'esame di Chirurgia plastica è **orale**. Lo studente può essere interrogato da **Nicoletti**, dal docente del corso o da una specializzanda. Generalmente vengono poste un paio di domande sugli argomenti presenti nelle sbobine. Gli studenti vengono chiamati indicativamente in ordine di iscrizione.

      **Preappelli:** Non sono previsti preappelli.
