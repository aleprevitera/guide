        stile: Pone una domanda e può generalmente aumentare il voto fino a circa 3 punti. Generalmente tranquillo.
      - nome: Visonà
        stile: Pone una domanda e può generalmente aumentare il voto fino a circa 3 punti. Generalmente tranquillo.
      - nome: Specializzando incaricato della prima parte dell’esame
        stile: Interroga nella prima parte, che è la più corposa. Al termine consegna un foglio con proposta di voto. Generalmente tranquillo.
