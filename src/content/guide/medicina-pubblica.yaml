  - nome_modulo: Organizzazione sanitaria
    id: m-iptxage9
    cfu: 1
    exam_type: Orale
    frequenza: Obbligatoria
    exam_details: |-
      Esame orale unico per i due moduli (Organizzazione sanitaria e Igiene ambientale).
      Generalmente vengono poste:

      - una domanda di Organizzazione sanitaria;
      - una domanda di Igiene ambientale.

      Spesso la prima domanda può essere collegata alla futura specializzazione dello studente.

      **Frequenza obbligatoria e controllata.** È necessario raggiungere il 75% di presenza complessiva sui due moduli: le lezioni complessive sono 8; è quindi necessario aver frequentato almeno 6 lezioni su 8; le 6 presenze possono essere distribuite liberamente tra i due moduli. Se non viene raggiunta la percentuale richiesta, la Prof.ssa Odone consente comunque di sostenere l’esame, ma aggiungendo argomenti integrativi.
    program: L’esame comprende generalmente una domanda di Organizzazione sanitaria. È fondamentale attenersi al programma dell’anno in cui si è frequentato il corso, che la Prof.ssa Odone ha a disposizione e consulta durante l’esame.
    material_tips: |-
      **Dove studiare**

      - Sbobine.
      - Capitoli del libro indicati dalla Prof.ssa Odone.
      - Letture assegnate durante il corso.

      È consigliato almeno dare una lettura ai capitoli del libro indicati dalla docente. Le domande specifiche su questa parte sono rare, ma non è consigliabile trascurare le letture assegnate, che possono comunque essere oggetto di domanda.

      **Consigli per la preparazione**

      - Seguire il programma dell’anno in cui si è frequentato.
      - Studiare le sbobine.
      - Non trascurare le letture assegnate.
      - Dare almeno una lettura ai capitoli del libro indicati dalla docente.
      - Prepararsi eventualmente sulla propria futura specializzazione, vista la frequente presenza di domande iniziali su questo argomento.
    body: |-
