  - nome_modulo: Bioetica
    id: m-f18tcg5t
    exam_type: Scritto
    exam_details: |-
      Esame scritto a domanda aperta, simile a un breve tema.

      - La domanda riguarda uno dei macroargomenti affrontati a lezione.
      - Le domande tendono a ripetersi, quindi è molto utile preparare in anticipo una scaletta per ciascuna delle domande passate.
      - La correzione può richiedere molto tempo.

      Le presenze non vengono controllate.
    program: |-
      In una prima fase vengono presentati i criteri e i principi della bioetica, con riferimento allo sviluppo storico.

      Principi e valori vengono successivamente utilizzati attraverso l’analisi sia di casi “storici” sia di situazioni tipiche della medicina contemporanea.

      *Programma ufficiale dell’insegnamento (a.a. 2026/2027).*
    material_tips: |-
      **Dove studiare**

      - Domande passate.
      - Scalette personali.

      Il modo più efficace è preparare delle scalette per ciascuna delle domande passate, così da avere una struttura pronta per sviluppare la risposta durante lo scritto.

      **Consigli per la preparazione**

      - Recuperare tutte le domande degli appelli precedenti.
      - Preparare una scaletta per ogni domanda.
      - Essere in grado di sviluppare rapidamente una risposta discorsiva a partire dalla scaletta.
    body: |-
      **Domande e argomenti ricorrenti**

      - Le domande tendono a ripetersi.
      - È molto utile preparare in anticipo una scaletta per ciascuna delle domande passate.
