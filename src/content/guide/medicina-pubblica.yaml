  - nome_modulo: Medicina del Lavoro
    id: m-kfhcmrwh
    exam_type: Scritto
    exam_details: |-
      Esame scritto a crocette:

      - 20 domande;
      - 20/20 = 30 e lode;
      - subito sotto, 19/20 = 29;
      - gli altri voti vengono calcolati proporzionalmente in ventesimi.

      Solitamente le domande comprendono una combinazione di:

      - domande già presenti negli appelli precedenti;
      - circa 2-3 domande nuove.

      La frequenza è generalmente necessaria per poter accedere agli eventuali preappelli.
    program: |-
      **Concetti generali:** Cenni di storia della disciplina. Definizione e scopi della Medicina del Lavoro. Definizione di rischio professionale; fattori professionali di rischio e loro classificazione. Malattia professionale e infortunio sul lavoro. Criteri di anamnesi lavorativa e ambientale.

      **Igiene del lavoro:** Prevenzione primaria e secondaria. Monitoraggio ambientale e limiti igienici ambientali (TLV). Monitoraggio biologico e limiti biologici di esposizione (BEI). Sorveglianza sanitaria.

      **Tossicologia industriale e occupazionale:** Principi generali di tossicologia industriale e occupazionale. Tossicocinetica e tossicodinamica.

      **Patologia da agenti fisici:** Patologia da rumore. Patologia da vibrazioni. Patologia da radiazioni ionizzanti e non ionizzanti.

      **Patologia da agenti chimici:** Patologia da metalli, in particolare piombo, mercurio, cromo, cadmio. Patologia da solventi, in particolare n-esano, benzene e omologhi, composti alogenati, solfuro di carbonio. Patologia da pesticidi, in particolare organofosforici.

      **Rischio biologico:** Concetti generali e approfondimento delle zoonosi.

      **Cancerogenesi professionale:** Cancerogenesi e mutagenesi. Classificazione dei cancerogeni. Principali neoplasie di origine professionale. Aspetti normativi.

      **Ergonomia:** Concetti generali. Patologie dell’apparato locomotore correlate al lavoro: rischi da movimentazione manuale di carichi e da movimenti ripetitivi dell’arto superiore.

      **Allergologia professionale:** Classificazione delle allergopatie. Diagnostica allergologica (prick test, patch test, RAST, test di provocazione bronchiale specifica e aspecifica). Principali quadri clinici professionali (dermopatie, rinite, asma bronchiale, alveolite allergica estrinseca).

      **Rischi emergenti:** Organizzazione del lavoro e lavoro a turni. Stress lavoro-correlato, mobbing, burnout.

      **Aspetti medico-legali:** Legislazione in tema di igiene e sicurezza sul lavoro (in particolare D.Lgs. 81/08). Obblighi informativi del medico in tema di patologie professionali.

      **Attività pratica:** Presso il servizio di Fisiopatologia respiratoria, Fisiologia del lavoro ed Ergonomia e presso l’Unità Operativa Ospedaliera di Medicina del Lavoro (UOOML) della Fondazione Maugeri IRCCS.

      *Programma ufficiale dell’insegnamento (a.a. 2026/2027).*
    material_tips: |-
      **Dove studiare**

      - Domande degli anni precedenti.
      - Slide.

      Le domande passate sono particolarmente utili e, spesso, possono essere sufficienti per preparare gran parte dell’esame.

      **Consigli per la preparazione**

      - Fare bene le domande degli anni precedenti.
      - Integrare con le slide.
      - Le domande vecchie costituiscono spesso la parte principale dell’esame.
    body: |-
      **Domande e argomenti ricorrenti**

      - Le domande si ripetono frequentemente.
      - Spesso le domande degli anni precedenti costituiscono la maggior parte dell’esame.
      - In genere vengono aggiunte circa 2-3 domande nuove.
