descrizione_generale: "L’esame è composto da 5 moduli, che concorrono alla valutazione finale attraverso una media ponderata. La lode viene considerata una sola volta: è sufficiente ottenere una sola lode tra i cinque moduli. Per il calcolo della media: il 30 e lode viene considerato come 30; la lode aggiunge +2 punti alla media ponderata finale; il risultato viene arrotondato per eccesso; per ottenere la lode finale è sufficiente raggiungere 30,1. I moduli di Organizzazione sanitaria e Igiene ambientale valgono 1 CFU ciascuno e vengono sostenuti con un unico esame orale. Tempo di studio complessivo: non sono disponibili indicazioni precise sui giorni necessari per la preparazione."
moduli:
  - nome_modulo: Medicina Legale
    id: m-p7i98hbx
    exam_type: Orale
    exam_details: |-
      L’esame è diviso in due parti.

      **Prima parte**

      - Interrogazione con uno specializzando.
      - È la parte più corposa dell’esame.
      - Al termine viene consegnato un foglio con una proposta di voto.

      **Seconda parte**

      - Con il voto proposto si passa da uno dei due professori: Prof. Cecchetto o Prof. Visonà.
      - Il professore pone una domanda e può generalmente aumentare il voto fino a circa 3 punti.

      Entrambe le fasi dell’esame sono generalmente tranquille.

      La frequenza è generalmente necessaria per poter accedere agli eventuali preappelli.
    program: |-
      1. Introduzione alla Medicina legale: natura e definizione di morte, attività informativa del medico relativa al decesso.
      2. Fenomeni postmortali e tanatocronologia.
      3. Violenza sessuale.
      4. Elementi di diritto penale.
      5. Elementi di diritto civile.
      6. Elementi di procedura penale: perizia e consulenza tecnica.
      7. Elementi di procedura civile: consulenza tecnica d’ufficio.
      8. Responsabilità professionale medica in ambito penale e civile.
      9. Cartella clinica e certificati.
      10. Patologia forense:
          - asfissia;
          - lesività da arma da fuoco;
          - lesività da arma bianca;
          - lesività da corpi contundenti;
          - lesività da calore ed elettricità.
      11. Genetica forense:
          - sopralluogo giudiziario alla ricerca di tracce biologiche;
          - diagnosi di natura biologica;
          - il profilo genetico e i criteri di interpretazione;
          - antropologia molecolare e disaster victim identification (DVI);
          - le indagini di paternità e di parentela;
          - la genetica comportamentale.

      *Programma ufficiale dell’insegnamento (a.a. 2026/2027).*
    material_tips: |-
      **Sul programma**

      Il programma comprende i principali argomenti di Medicina Legale, con particolare attenzione agli aspetti normativi e agli articoli fondamentali. È richiesta una conoscenza precisa e talvolta mnemonica di:

      - omicidio e relative tipologie;
      - violenza sessuale;
      - aggravanti;
      - procedibilità;
      - principali articoli di interesse medico-legale.

      **Dove studiare**

      - Sbobine dell’anno corrente.
      - Domande degli esami precedenti.

      **Consigli per la preparazione**

      - Studiare le sbobine dell’anno corrente.
      - Guardare attentamente le domande passate.
      - Memorizzare con precisione gli articoli e gli aspetti normativi maggiormente richiesti.
      - Prestare particolare attenzione a omicidio, violenza sessuale, aggravanti e procedibilità.
    body: |-
      **Domande e argomenti ricorrenti**

      - Le domande passate sono molto utili per capire dove concentrare lo studio.
