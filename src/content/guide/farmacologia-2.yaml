  - nome_modulo: Tossicologia
    id: m-obz8gkpx
    cfu: 1
    exam_type: Orale
    study_time: 15 giorni
    exam_details: |-
      - L'esame è un'interrogazione a tre studenti con uno dei professori.
      - Generalmente vengono poste circa tre domande, procedendo progressivamente verso aspetti più specifici: la prima domanda è solitamente più generale, mentre le successive possono entrare maggiormente nel dettaglio, ad esempio sugli antidoti.
      - In alcuni casi la prima domanda può essere scelta dallo studente.
      - L'interrogazione procede in genere in ordine di iscrizione.
      - I professori non tendono a entrare particolarmente nel dettaglio dei singoli argomenti e si concentrano soprattutto sugli aspetti clinici.
      - I voti risultano generalmente abbastanza alti.
      - Sono stati concessi anche appelli straordinari.
    program: |-
      Il corso comprende tre moduli principali (i) farmacologia/ farmacologia applicata/ farmacologia clinica; (ii) chemioterapia; (iii) tossicologia.

      Tossicologia

      Tossicità a carico dei vari organi e apparati (fegato, rene, sistema nervoso, apparato respiratorio, sistema riproduttivo); alcolismo e patologie correlate; intossicazioni acute (gas tossici, funghi, prodotti agricoli, prodotti di uso domestico, farmaci psicoattivi, principi applicati nella diagnosi e trattamento); rischi tossicologici in gravidanza, avvelenamenti in situazioni speciali (infanzia ed età avanzato); farmaci di abuso, dipendenza. Effetti tossici di inquinanti ambientali.

      Temi trasversali al corso

      Relazione PK/PD (farmacocinetica/farmacodinamica) e ottimizzazione posologica (tempo- vs concentrazione-dipendenza)

      Interazioni farmacologiche clinicamente rilevanti (CYP450, warfarin)

      Farmaci di supporto e rescue drugs

      Tossicità d'organo (renale, epatica, cardiaca, ematologica) e relativo monitoraggio

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/10667/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      - È disponibile una dispensa realizzata direttamente dal CAV, che tratta praticamente tutti gli argomenti. Potrebbe mancare la parte relativa all'intossicazione da cianuro, anche se nell'anno di riferimento è stata spiegata a lezione.
      - È inoltre presente, a quanto riferito, una dispensa più sintetica e scorrevole che dovrebbe contenere tutto il necessario per l'esame, ma non è stato possibile reperirla nei vari Drive.
      - Conviene dare importanza soprattutto alla clinica e agli aspetti pratici delle intossicazioni, senza perdersi eccessivamente nei dettagli.
    fascia_studio: 1–2 sett
    professors:
      - nome: Carlo Alessandro Locatelli
