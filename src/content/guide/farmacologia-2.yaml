title: Farmacologia 2
esse3_codice: "501694"
anno_di_corso: IV Anno
cfu_totali: 5
semestre: II
descrizione_generale: "L'esame è composto da tre parti: Chemioterapia (1 CFU), Tossicologia (1 CFU), Farmacologia (3 CFU). Il voto finale è calcolato come media ponderata dei tre moduli in base ai rispettivi CFU. Non sottovalutare l'esame per il fatto che Tossicologia e Chemioterapia valgano complessivamente solo 2 CFU: soprattutto Tossicologia può richiedere una preparazione piuttosto lunga. Nel complesso, la preparazione richiede un tempo variabile in base alla familiarità con la materia; la Tossicologia, pur non essendo particolarmente difficile, può risultare lunga perché comprende diversi argomenti nuovi."
moduli:
  - nome_modulo: Chemioterapia
    id: m-yfczwv5j
    cfu: 1
    exam_type: Scritto + Orale
    study_time: 1 settimana
    exam_details: |-
      - Si svolge inizialmente uno scritto a crocette su Kiro, seguito da un orale.
      - Durante l'orale vengono generalmente corrette le domande sbagliate dello scritto, ma possono essere poste anche ulteriori domande sugli argomenti del programma.
      - L'orale si svolge solitamente lo stesso giorno dello scritto oppure, se gli studenti sono numerosi, il giorno successivo.
      - Il professore è generalmente disponibile a concedere appelli aggiuntivi, purché siano collocati all'interno del periodo previsto per le sessioni d'esame.
    program: |-
      Il corso comprende tre moduli principali (i) farmacologia/ farmacologia applicata/ farmacologia clinica; (ii) chemioterapia; (iii) tossicologia.

      Chemioterapia

      Antibiotici beta-lattamici; aminoglicosidi; chinoloni; macrolidi; lincosamidi; glicopeptidi; tetracicline; cloramfenicolo; sulfonamidici; rifamicine; farmaci antimicobatterici e terapia della tubercolosi; antimicotici; antivirali; farmaci per il trattamento delle infezioni da protozoi; antielmintici; antineoplastici.

      Parte I e II: Antibatterici

      - linee guida aggiornate per il trattamento di: meningite batterica, polmonite, faringite da streptococchi gruppo b, endocardite batterica
      - betalattamici (penicilline, cefalosporine, carbapenemi, monobattami)
      - sulfamidici
      - aminoglicosidi
      - macrolidi
      - ossazolidinoni

      Parte III: Antivirali

      - Linee guida per il trattamento di influenze virali
      - Linee guida per il trattamento dell'epatite C
      - Antivirali efficaci contro virus a DNA e RNA
      - Antivirali anti HBV
      - Antivirali anti HCV

      Parte IV: antitumorali

      - antitumorali citotossici (alchilanti, antimetaboliti, alcaloidi della Vinca, antibiotici citotossici)
      - anticorpi monoclonali
      - inibitori di kinasi

      Lezione 1 — Antibatterici, parte 1

      Beta-lattamici (penicilline, cefalosporine, carbapenemi, monobattami)

      Farmacocinetica: biodisponibilità orale, distribuzione, legame proteico, escrezione (renale/biliare)

      Assorbimento gastrointestinale in funzione del pH (ionizzazione, pKa)

      Tempo-dipendenza (T>MIC) e ottimizzazione posologica (PTA, Probability of Target Attainment)

      Imipenem/cilastatina; carbapenemi e resistenza alle beta-lattamasi

      Ipersensibilità e cross-reattività allergica tra classi

      Tossicità epatica/biliare (colestasi, sabbiolina biliare)

      Uso in popolazioni speciali: neonati (meningite, ceftriaxone), insufficienza renale

      Aztreonam nei pazienti allergici

      Sulfamidici e trimetoprim

      Meccanismo d'azione e selettività (DHFR, diidrofolato reduttasi; diidropteroato sintasi)

      Cotrimossazolo: farmacocinetica, metabolizzazione, indicazioni cliniche

      Interazioni (warfarin, CYP2C9), cristalluria

      Nitrofurantoina

      Spettro d'azione limitato alla vescica; inefficacia in pielonefrite

      Tossicità in deficit di G6PD (glucosio-6-fosfato deidrogenasi)

      Effetti avversi trasversali

      Colite pseudomembranosa da antibiotici

      Anemia emolitica da farmaci in pazienti G6PD-deficienti

      Lezione 2 — Antibatterici, parte 2

      Fluorochinoloni

      Meccanismo d'azione, classificazione generazionale e spettro

      Interazioni con FANS (farmaci antinfiammatori non steroidei; neurotossicità) e warfarin (aritmie, INR)

      Aminoglicosidi

      Farmacocinetica (Vd, volume di distribuzione; dosaggio su peso ideale), concentrazione-dipendenza (Peak/MIC)

      Nefrotossicità e ototossicità; monitoraggio

      Glicopeptidi (vancomicina) e linezolid

      Vancomicina: indicazioni per via di somministrazione, evoluzione del monitoraggio (trough vs AUC/MIC)

      Linezolid: meccanismo d'azione, uso nei VRE (Vancomycin-Resistant Enterococci), interazioni serotoninergiche (MAO, monoaminossidasi)

      Macrolidi

      Farmacocinetica dell'azitromicina; interazioni via CYP3A4

      Effetti avversi (epatotossicità, QT)

      Fosfomicina

      Meccanismo d'azione, ruolo nei patogeni multiresistenti (ESBL, Expanded Spectrum Beta-Lactamase)

      Terapia dell'infezione da Clostridioides difficile

      Vancomicina orale, fidaxomicina, bezlotoxumab, trapianto di microbiota fecale (FMT)

      Linee guida cliniche

      Infezioni delle vie urinarie (cistite, pielonefrite) per gravità e popolazione (gravidanza)

      Endocardite infettiva da stafilococchi (valvola nativa/protesica) ed enterococchi multiresistenti

      Faringite streptococcica e polmonite acquisita in comunità

      Lezione 3 — Antivirali

      Antivirali anti-herpes (HSV, VZV, CMV)

      Aciclovir/valaciclovir: attivazione, farmacocinetica, nefrotossicità

      Ganciclovir/valganciclovir (CMV, citomegalovirus)

      Cidofovir e foscarnet nei ceppi resistenti

      Brivudina e interazione con 5-fluorouracile

      Antivirali anti-influenzali

      Inibitori della neuraminidasi (oseltamivir, zanamivir): meccanismo, controindicazioni

      Terapia dell'epatite B

      Analoghi nucleosidici/nucleotidici: farmacocinetica, profarmaci, effetti avversi

      PegIFNα (interferone alfa pegilato): razionale della pegilazione, farmacocinetica, effetti avversi dose-limitanti

      Terapia dell'epatite C

      Ribavirina: duplice meccanismo d'azione, tossicità, controindicazioni

      Evoluzione terapeutica: dual therapy, poi tripla terapia, poi DAA di seconda generazione (Direct Acting Antivirals)

      Classificazione dei DAA per target molecolare

      Ritonavir come booster farmacocinetico

      Lezione 4 — Antitumorali

      Principi generali

      Molecular testing nella scelta terapeutica

      Razionale della politerapia (combination therapy) e farmaci di supporto

      Chemioterapici citotossici

      Antracicline (doxorubicina): meccanismo, cardiotossicità, eliminazione

      Vinca alcaloidi e tassani: meccanismo sui microtubuli, resistenza (P-gp, P-glicoproteina), interazioni CYP

      Antimetaboliti pirimidinici (5-fluorouracile, capecitabina): attivazione, deficit di DPD (diidropirimidina deidrogenasi), effetti avversi, uridina come rescue

      Agenti alchilanti (ciclofosfamide): attivazione, metaboliti (fosforamide, acroleina), cistite emorragica, MESNA

      Metotrexato e leucovorina (rescue)

      Terapia ormonale (carcinoma mammario)

      Inibitori dell'aromatasi vs tamoxifen: meccanismo e profilo di sicurezza a confronto

      Scelta terapeutica per stato menopausale; analoghi del GnRH (Gonadotropin-Releasing Hormone)

      Fulvestrant e resistenza al tamoxifen

      Targeted therapy

      Anti-HER2: anticorpi monoclonali (trastuzumab, pertuzumab) vs small molecule (lapatinib, neratinib); cardiotossicità

      Inibitori di EGFR (Epidermal Growth Factor Receptor) e resistenza KRAS-mediata

      Inibitori di CDK4/6 (Cyclin-Dependent Kinase 4/6; palbociclib) e ciclo cellulare (Rb/E2F)

      Farmaci antiangiogenici: bevacizumab vs inibitori multi-target (sunitinib, sorafenib)

      Temi trasversali al corso

      Relazione PK/PD (farmacocinetica/farmacodinamica) e ottimizzazione posologica (tempo- vs concentrazione-dipendenza)

      Interazioni farmacologiche clinicamente rilevanti (CYP450, warfarin)

      Farmaci di supporto e rescue drugs

      Tossicità d'organo (renale, epatica, cardiaca, ematologica) e relativo monitoraggio

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/10667/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      - Sbobine e slide sono sufficienti per la preparazione.
      - È disponibile un file organizzato in domande e risposte, particolarmente utile per preparare l'orale.
      - Esercitarsi sulle crocette degli anni precedenti.
