moduli:
  - nome_modulo: Anatomia patologica
    id: m-kukjri3a
    cfu: 8
    exam_type: Orale
    study_time: circa 2 mesi
    durata_orale_min: 10
    exam_details: |-
      L’esame è orale e può avere una durata molto variabile: da circa 10 minuti fino a un’ora, con una durata media intorno ai 30 minuti.

      Le domande possono spaziare su tutto il programma e generalmente non sono estremamente specifiche. I professori sono consapevoli dell’ampiezza della materia e tendono quindi a lasciare lo studente parlare, anche se con modalità molto diverse tra loro.

      È fondamentale consultare le domande degli anni precedenti, perché alcuni professori seguono sequenze o schemi ricorrenti.
    program: |-
      **Istituzioni di anatomia patologica:**

      Percorsi diagnostici in anatomia patologia. Principali metodologie diagnostiche e tecniche ancillari (immunoistochimica, biologia molecolare e citogenetica) nel laboratorio di anatomia patologica: principi tecnici di base e principali settori applicativi.

      **Patologia cardiovascolare:**

      - Ipertensione arteriosclerosi
      - Infarto del miocardio
      - Cardiopatie congenite
      - Pericarditi-Endocarditi.

      **Patologia dell'apparato digerente:**

      - Esofagiti: tumori esofago e cardias
      - Gastriti
      - Malassorbimento
      - Malattie infiammatorie intestino
      - Pancreatiti
      - Tumori del pancreas
      - Tumori dell'intestino
      - Epatiti
      - Cirrosi
      - Tumori del fegato e delle vie biliari.

      **Patologia del'apparato riproduttivo femminile:**

      - Patologia cervicale e vulvare
      - Patologia del corpo uterino e dell'ovaio
      - Disordini placentari e della gravidanza.

      **Patologia mammaria neoplastica e non neoplastica.**

      **Patologia nefro-urologica:**

      - Malformazioni del rene e delle vie urinarie
      - malattie cistiche renali
      - urolitiasi ed uropatia ostruttiva
      - Patologia tubulo-interstiziale vascolare e sistemica renale
      - Patologia tubulo-interstiziale, infezioni rene e vie urinarie
      - Patologia glomerulare
      - Patologia della prostata e del testicolo
      - Tumori del rene e delle vie urinarie.

      **Patologia linfoematologica**

      - Linfadeniti e disordini linfoproliferativi
      - Linfomi non Hodgkin, nodali e d extranodali
      - linfomi immunodeficienza correlati
      - disordini del sistema istiocito-dendritico-macrofagico
      - patologia mediastinica con particolare attenzione alla patologia del timo.

      **Patologia dell'apparato respiratorio:**

      - Tumori della regione testa-collo
      - Disordini acuti e infettivi del polmone
      - Patologia ostruttiva polmonare
      - Patologia restrittiva polmonare
      - Neoplasie polmonari
      - Patologia pleurica.

      **Patologia del sistema nervoso:**

      - Tumori benigni del sistema nervoso centrale periferico
      - Tumori maligni del sistema nervoso centrale e periferico
      - Patologia vascolare del SNC
      - Patologia infettiva e disordini degenerativi del sistema nervoso centrale e periferico.

      **Cute ed apparato locomotore.**

      - Patologia cutanea non neoplastica
      - Tumori cutanei
      - Tumori dei tessuti molli e del sistema osteoarticolare scheletrico
      - Tumori pediatrici

      **Patologia endocrina:**

      - patologia neoplastica e non neoplastica della tiroide
      - tumori neuro-endocrini
      - patologia neoplastica e non neoplastica del surrene

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/10616/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      - La base consigliata sono le sbobine 2022/2023, complete anche per argomenti non trattati direttamente a lezione in quell’anno, come la mastocitosi.
      - È fondamentale confrontarle con le sbobine dell’anno in corso, soprattutto per le nuove classificazioni e per eventuali argomenti aggiunti o modificati. Ad esempio, le patologie dell’ipofisi non erano presenti nelle sbobine 2022/2023, mentre sono state trattate nel 2025/2026.
      - È consigliato seguire le lezioni e, se possibile, dividersi il lavoro di sintesi tra 4-5 persone, dato l’enorme programma.
      - Sono inoltre molto utili le domande degli anni precedenti, sia per capire quali argomenti vengono maggiormente richiesti sia per orientare lo studio in base al professore.
      - Organizzare il materiale in anticipo e suddividere eventualmente la preparazione con altri studenti.
      - Il tempo necessario dipende comunque molto dalla preparazione acquisita durante gli anni di studio, soprattutto nelle diverse materie cliniche, che risultano importanti per affrontare l’esame.
    body: |-
      **Domande e argomenti ricorrenti**

      - **Miscellanea**: È la parte meno richiesta e comprende soprattutto neurologia, testa-collo, dermatologia, tumori pediatrici, patologia ossea e amiloidosi. Gli argomenti sono spesso meno approfonditi a lezione e, quando vengono chiesti, generalmente non viene richiesta la stessa precisione delle altre aree. Sono comunque irrinunciabili:
        - Neurologia: neoplasie astrocitarie, meningiomi, schwannomi, traumi del SNC, malattia cerebrovascolare e infezioni del SNC.
        - Amiloidosi: da conoscere nel complesso, con particolare attenzione all’amiloidosi AL.
        - Tessuti molli: tumori vascolari, soprattutto sarcoma di Kaposi.
        - Dermatologia: melanoma da conoscere molto bene; dare anche una lettura a basocellulare e spinocellulare.
        - Testa-collo: tumori delle ghiandole salivari.
        - Patologia ossea: leggere tutto il programma, ma concentrarsi sulle domande degli anni precedenti e conoscere sicuramente condrosarcoma, osteosarcoma e sarcoma di Ewing, con particolare attenzione alla diagnosi differenziale tra condrosarcoma e osteosarcoma.
        - Istiocitosi a cellule di Langerhans: da conoscere molto bene, soprattutto per Paulli.
        - Tumori pediatrici: neuroblastoma, nefroblastoma/tumore di Wilms e medulloblastoma.
      - **Altri argomenti prioritari**:
        - Oncoematologia: soprattutto se si viene interrogati da Paulli.
        - Gastroenterologia: molto richiesta, soprattutto la patologia neoplastica.
        - Cardiologia: molto richiesta e prevalentemente clinica.
        - Senologia: molto richiesta, soprattutto da Lucioni.
        - Endocrinologia: richiesta meno frequentemente rispetto ad altre parti, ma importante per Vanoli.
        - Pneumologia: argomento trasversale, senza un professore che la richieda nettamente più degli altri.
        - Nefrologia e urologia: generalmente meno conosciute dai professori e quindi meno richieste, con la significativa eccezione di Schena. L’urologia può essere richiesta anche da Paulli e Lunardi.
        - Ginecologia: generalmente poco richiesta e senza un livello di dettaglio elevato; è soprattutto Inzani a richiederla. Le patologie della placenta non vengono generalmente chieste.
    professors:
      - nome: Marco Paulli
        stile: "È lo scoglio principale dell’esame, ma affrontabile con preparazione mirata. Molto esigente sull'oncoematologia. Importante seguire le sue lezioni per capire cosa concentrare. Interrogazione con botta e risposta rapido, molte domande consecutive, sequenze ricorrenti, può partire da domanda a scelta. Argomenti caratteristici: tumori c-KIT mutati e micosi fungoide."
        email: marco.paulli@unipv.it
      - nome: Frediano Socrate Inzani
        stile: È simile agli altri professori più accomodanti per quanto riguarda l'impostazione generale dell'orale, ma è leggermente più puntiglioso. Non parte generalmente da una domanda a scelta. Il suo principale argomento è la patologia ginecologica, che va quindi conosciuta in maniera abbastanza approfondita, pur senza arrivare a un livello specialistico. Il materiale da lui spiegato è considerato sufficiente per la preparazione.
        email: fredianosocrate.inzani@unipv.it
      - nome: Marco Lucioni
        stile: "Le modalità sono simili a quelle di Vanoli: è generalmente tranquillo, mette lo studente a proprio agio e può iniziare chiedendo dove si è svolto il tirocinio. Il suo principale argomento di riferimento è la patologia mammaria, che va quindi studiata molto bene. Anche da lui oncoematologia, nefro-urologia e miscellanea vengono richieste soprattutto in relazione al reparto di internato."
        email: marco.lucioni@unipv.it
      - nome: Francesca Lunardi
        stile: È particolarmente accomodante e tende ad aiutare lo studente in difficoltà. Spazia su gran parte del programma, con minore attenzione a oncoematologia e nefrologia, e generalmente parte da una domanda a scelta. Il suo principale argomento è la patologia polmonare. Per quanto riguarda l’urologia, tende a concentrarsi soprattutto sui tumori della vescica e della prostata.
        email: francesca.lunardi@unipv.it
      - nome: Antonio Schena
        stile: Molto puntiglioso, interrompe frequentemente. Orali lunghi, spesso con sue spiegazioni. Interessato all’aspetto anatomopatologico, clinica secondaria. Non propone domanda a scelta, segue sequenze ricorrenti. Affronta spesso la miscellanea (tumori ghiandole salivari, melanoma). Riferimento per nefrologia. Attenzione all’ordine del referto anatomopatologico.
      - nome: Alessandro Vanoli
        stile: "Molto tranquillo, mette a proprio agio. Inizia chiedendo dove si è svolto il tirocinio, poi sceglie la prima domanda. Lascia parlare, domande generali, aiuta in difficoltà. Chiede spesso una patologia neoplastica e una non neoplastica. Argomenti caratteristici: gastroenterologia ed endocrinologia. Tralascia miscellanea, oncoematologia e nefro-urologia (richieste se interno). Possibile domanda su tumori EBV-positivi."
        email: alessandro.vanoli@unipv.it
