  - nome_modulo: Diagnostica per immagini
    id: m-t588av4v
    exam_type: Scritto
    study_time: 10 giorni – 1 mese
    preappello: No
    exam_details: |-
      L’esame è **scritto** e si svolge tramite **Kiro Testing**. La prova comprende:

      - 7 domande a scelta multipla di Radiologia
      - 4 domande a scelta multipla di Radioterapia
      - 4 domande a scelta multipla di Neuroradiologia
      - 3 domande aperte, una per ciascuna delle tre sezioni

      Le domande a scelta multipla sono **senza penalità**. Le domande vengono estratte da un ampio pool di quesiti, non accessibile agli studenti, e possono quindi essere differenti tra i vari candidati. La difficoltà della prova può pertanto variare sensibilmente da uno studente all’altro. La valutazione viene inoltre **normalizzata con una correzione gaussiana**, che tende ad allineare i risultati tenendo conto della difficoltà complessiva della prova.

      **Preappello**: per Diagnostica per immagini non è previsto.

      **Frequenza**: risulta più controllata rispetto ad altri insegnamenti. I docenti prestano attenzione alla presenza in aula e al numero di studenti presenti, anche se non è necessariamente richiesta una partecipazione al 100% delle lezioni.

      **Flipped classroom**: prevista per Diagnostica per immagini, alla quale possono partecipare gli studenti che hanno raggiunto almeno il 75% di frequenza. L’attività consiste generalmente in:

      - scelta di un argomento tra quelli proposti;
      - lettura degli articoli forniti dai docenti;
      - preparazione di una presentazione PowerPoint;
      - esposizione del lavoro.

      Sono previsti punti aggiuntivi sull’esame:

      - partecipazione → +1 punto;
      - gruppi finalisti → +3 punti;
      - gruppo vincitore → +5 punti.
    program: |-
      Per quanto riguarda il programma e i contenuti si fa riferimento a quanto scritto nei singoli moduli costituenti il corso integrato.

      Il corso ha una componente didattica significativa.

      I temi trattati spaziano da argomenti di radiologia generale (punti di forza e limiti delle diverse modalità di imaging, giustificazione e appropriatezza del loro utilizzo, vantaggi e controindicazioni dei mezzi di contrasto) ad argomenti specifici quali le indicazioni alla diagnostica per immagini e elementi base di semeiotica radiologica della patologia toracica e cardiovascolare, della patologia focale e diffusa epatica e pancreatica, della patologia dell'apparato gastro-enterico, della patologia dell’apparato muscolo-scheletrico, della patologa dell’apparato genito-urinario maschile e femminile e della patologia oncologica mammaria.

      La conoscenza sarà ulteriormente rafforzata dalla discussione di casi emblematici delle problematiche cliniche trattate. Saranno fornite informazioni di base in merito alle probematiche correlate alla radioprotezione del paziente e del personale sanitario, alla luce della normativa vigente.

      **Attrezzature radiologiche:**

      tipi e caratteristiche di funzionamento delle attrezzature radiologiche utilizzate nella diagnostica ed interventistica neuroradiologica con particolare attenzione all'impiego della TC e della RM sia nella fase acuta che nel follow-up.

      Tecniche di indagine da utilizzare nella diagnostica delle principali patologie dell'encefalo e del midollo come:

      - malattie cerebrovascolari in fase acuta e stabilizzata
      - malattie infettivo-infiammatorie
      - tumori cerebrali
      - tumori spinali
      - invecchiamento cerebrale e deterioramento cognitivo
      - patologie degenerative dell'encefalo
      - traumi cranio-spinali
      - epilessia
      - patologie dell'ipofisi
      - patologie degenerative della colonna

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2023/10045/insegnamenti/2026/12832/2017/9999?coorte=2023&schemaid=17807).*
    material_tips: |-
      **Sul programma**

      Il programma comprende diverse aree:

      - Radiologia
      - Pneumoradiologia
      - Radioterapia
      - Neuroradiologia
      - imaging dell’apparato riproduttore femminile
      - radiologia ginecologica
      - imaging del sistema vascolare

      È importante preparare anche gli argomenti che non vengono necessariamente approfonditi durante le lezioni, ma che possono comparire nelle domande d’esame.

      La preparazione è stata effettuata principalmente dalle **sbobine 2023-2024**, utilizzando:

      - Radiologia
      - Pneumoradiologia
      - Radioterapia
      - Neuroradiologia

      A queste vanno aggiunte alcune lezioni di altre annate:

      - **Sbobine 2023-2024** → imaging dell’apparato riproduttore femminile
      - **Sbobine 2024-2025** → radiologia ginecologica
      - **Sbobine 2019-2020** → imaging del sistema vascolare

      Quest’ultima lezione è particolarmente importante perché, nell’anno di riferimento, è stata oggetto di una domanda aperta, nonostante l’argomento non fosse stato spiegato direttamente a lezione. È inoltre consigliabile consultare le **sbobine dell’anno corrente** per verificare eventuali aggiornamenti.

      **Materiale aggiuntivo**:

      - esercitazioni caricate dai docenti;
      - presentazioni disponibili sul Drive;
      - immagini proiettate durante le lezioni.

      Le immagini mostrate durante le lezioni possono essere riproposte nelle domande a scelta multipla. Per l’imaging dei tumori ossei, l’argomento è stato affrontato anche nella flipped classroom, ma è comunque presente nelle sbobine 2023-2024, che rappresentano la fonte principale.

      **Consigli**:

      - studiare dalle sbobine indicate;
      - guardare le slide dei docenti;
      - svolgere le esercitazioni caricate sul Drive;
      - osservare attentamente le immagini proiettate durante le lezioni.

      Non è possibile prevedere con precisione la difficoltà delle domande a crocette, poiché vengono estratte da un pool molto ampio e possono cambiare tra gli studenti. È quindi utile arrivare all’esame con una preparazione il più possibile ampia.
    body: |-
      **Domande e argomenti ricorrenti**

      - Non è disponibile un elenco stabile di domande ricorrenti, anche perché le domande a scelta multipla vengono estratte da un pool molto ampio.
      - È particolarmente utile conoscere:
        - le immagini mostrate a lezione;
        - le immagini presenti nelle esercitazioni;
        - gli argomenti delle presentazioni caricate sul Drive;
        - imaging del sistema vascolare, che nell’anno di riferimento è stato oggetto di una domanda aperta;
        - imaging dei tumori ossei, affrontato anche nella flipped classroom e presente nelle sbobine.
