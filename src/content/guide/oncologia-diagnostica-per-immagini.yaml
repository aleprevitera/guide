moduli:
  - nome_modulo: Oncologia
    id: m-4ewf06rv
    exam_type: Orale
    study_time: 1 mese
    preappello: Sì
    frequenza: Obbligatoria
    durata_orale_min: 15
    exam_details: |-
      L’esame è **orale**. Sono presenti più docenti che possono interrogare. L’interrogazione dura indicativamente **15 minuti**.

      **Preappello**: è previsto; nell’anno di riferimento si è svolto a metà maggio.

      **Frequenza**: obbligatoria, ma i controlli non risultano particolarmente rigorosi.
    program: |-
      Per quanto riguarda il programma e i contenuti si fa riferimento a quanto scritto nei singoli moduli costituenti il corso integrato.

      Basi patogenetiche, epidemiologia e prevenzione primaria e secondaria dei tumori.

      Iter diagnostico nel soggetto con sospetta neoplasia (anamnesi, esame obiettivo, indagini strumentali e di laboratorio).

      **Approccio al paziente con diagnosi di neoplasia:**

      - Stadiazione della malattia ai fini prognostici e terapeutici.
      - Approccio multidisciplinare al paziente oncologico: tumor board, PDTA.
      - Concetti fondamentali di trattamento delle neoplasie: terapia sistemica (chemioterapia,, terapie target, immunoterapia) e approcci loco-regionali.
      - Principali effetti collaterali acuti e tardivi dei trattamenti oncologici e come affrontarli.
      - Percorso diagnostico, terapeutico e follow-up di patologie oncologiche specifiche, in particolare di quelle a maggiore incidenza.
      - Le terapie complementari, le cure palliative; concetti di "cure simultanee" e di supporto nutrizionale nel paziente oncologico.

      **Conoscere i principi generali della radioterapia oncologica:**

      1. Iter diagnostico, stadiazione, iter terapeutico,
      2. Tappe nella pianificazione radioterapica: indicazioni, procedure di simulazione, definizione dei volumi bersaglio tumorale e degli organi a rischio, dose totale e frazionamenti, approvazione e verifica del piano di trattamento,
      3. Ruolo della radioterapia nei seguenti scenari: carcinoma del polmone (microcitoma e non-microcitoma), carcinoma della mammella, carcinoma della prostata, carcinoma del testa-collo, gastroenterico,
      4. Effetti collaterali delle radioterapia per i principali scenari clinici,
      5. Follow-up del paziente sottoposto a radioterapia.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2023/10045/insegnamenti/2026/12832/2017/9999?coorte=2023&schemaid=17807).*
    material_tips: |-
      **Sul programma**

      Il programma è molto ampio e non ci sono argomenti che vengano sistematicamente richiesti più di altri. È quindi consigliabile preparare tutto il programma. Il programma può variare leggermente di anno in anno in base agli argomenti affrontati a lezione. Nell’anno di riferimento è stata aggiunta una parte relativa alle cure palliative.

      La fonte principale sono le **sbobine 2024-2025**, considerate molto complete. È consigliabile confrontarle con il materiale dell’anno corrente per verificare eventuali argomenti aggiunti o modificati.

      Consigli:

      - non concentrarsi esclusivamente su presunti argomenti più frequenti;
      - studiare tutto il programma;
      - utilizzare le sbobine più recenti e complete;
      - verificare eventuali argomenti aggiunti nell’anno corrente;
      - dedicare particolare attenzione alla ripetizione, dato che l’esame è orale.
    body: |-
      **Domande e argomenti ricorrenti**

      - Non risultano esserci argomenti specifici che vengano richiesti sistematicamente più degli altri.
      - Le domande tendono a essere coerenti con quanto spiegato durante le lezioni.
      - Gli argomenti non trattati durante le lezioni possono essere meno rilevanti ai fini dell’esame: nell’anno di riferimento, ad esempio, i tumori rari non sono stati richiesti.
