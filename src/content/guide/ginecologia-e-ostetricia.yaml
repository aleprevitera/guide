  - nome_modulo: "Genetica"
    cfu: 1
    exam_type: "Scritto"
    exam_details: |
      Scritto a risposta multipla. È **sbarramento**: va superato per poter
      accedere all'orale di Ginecologia.
    program: |
      Programma da confermare — vedi sezione "Da verificare".

