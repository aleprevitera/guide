descrizione_generale: |
  **Consiglio:** riprendere in mano l'anatomia ginecologica prima di iniziare
  la preparazione.

  Esame composto da due moduli: Ginecologia e Ostetricia (orale) e Genetica
  (scritto a risposta multipla). **Attenzione:** lo scritto di Genetica è
  **sbarramento** per l'accesso all'orale di Ginecologia.

moduli:
