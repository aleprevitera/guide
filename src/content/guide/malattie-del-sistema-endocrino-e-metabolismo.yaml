id: g-kxnnzaqi
title: Malattie del Sistema Endocrino e Metabolismo
anno_di_corso: III Anno
descrizione_generale: |-
  L’esame è composto da tre prove: **endocrinologia**, **malattie del metabolismo** e **chirurgia endocrina**. I tre esami sono separati e fanno media ponderata tra loro. È necessario svolgere endocrinologia e metabolismo nello stesso appello: iscrivendosi a uno solo dei due c’è il rischio che i professori non facciano svolgere l’esame. È possibile rifiutare e ripetere uno solo dei tre parziali.

  Tempo di studio complessivo: 15/20 giorni complessivi per i 3 esami, a seconda di quanto si padroneggia la fisiologia endocrina.
