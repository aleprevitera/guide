id: g-kxnnzaqi
title: Malattie del Sistema Endocrino e Metabolismo
esse3_codice: "501793"
anno_di_corso: III Anno
cfu_totali: 5
descrizione_generale: "L'esame è composto da tre moduli formalmente separati: Endocrinologia, Malattie del metabolismo e Chirurgia endocrina. I voti dei tre moduli concorrono alla media ponderata. Endocrinologia e Malattie del metabolismo devono essere sostenuti nello stesso appello; l'interrogazione è unica e lo stesso professore interroga su entrambi i moduli. Chirurgia endocrina è una prova separata scritta a risposta multipla. È possibile rifiutare e ripetere uno solo dei tre parziali. Tempo di studio complessivo: 15-20 giorni. La tempistica dipende dal livello di padronanza della fisiologia endocrina."
moduli:
  - nome_modulo: Endocrinologia
    id: m-r6dtmg80
    exam_type: Orale
    exam_details: Prova orale unica con Malattie del metabolismo; stesso professore interroga su entrambi i moduli. È necessario sostenere entrambi nello stesso appello.
    program: |-
