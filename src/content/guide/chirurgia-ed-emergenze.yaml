id: g-riy9dsfx
title: Chirurgia ed Emergenze
anno_di_corso: VI Anno
descrizione_generale: "L’esame è composto da tre moduli, valutati attraverso una media aritmetica: Terapia intensiva, Chirurgia d’urgenza e Clinica chirurgica."
moduli:
  - nome_modulo: Terapia intensiva
    id: m-2dg08krc
    exam_type: Orale
    exam_details: |-
      Esame orale, a gruppi di 3-4 studenti, con il Prof. Bottazzi e la Prof. Natoli.

      - Durata: circa 50 minuti per gruppo.
      - Solitamente: 2 domande a testa.
      - La giornata d’esame può risultare piuttosto lunga.

      Durante l’esame può essere richiesto, di:

      - interpretare un’emogasanalisi (spesso richiesta dal Prof. Bottazzi);
      - diagnosticare il quadro;
      - commentare i risultati;
      - interpretare curve e grafici.

      L’esame è spesso basato sul ragionamento fisiopatologico più che sulla semplice memorizzazione.
    program: |-
      - Fisiopatologia e trattamento dello shock, con particolare riguardo allo shock cardiogeno, settico e ostruttivo
      - Fisiopatologia e trattamento del paziente con danno neurologico acuto
      - Fisiopatologia dell’insufficienza respiratoria acuta e principi di ventilazione non invasiva e meccanica
      - Principi di utilizzo dei cateteri venosi centrali

      *Programma ufficiale dell’insegnamento (a.a. 2026/2027).*
    material_tips: |-
      **Sul programma**

      Argomenti trattati nelle sbobine dell’anno corrente, con particolare attenzione a:

      - BPCO scompensata
      - Asma grave

      Sono inoltre importanti i quadri di rianimazione e terapia intensiva dal punto di vista fisiopatologico.

      Fonti consigliate:

      - Sbobine dell’anno corrente
      - Dispense del Prof. Iotti per integrare BPCO scompensata e asma grave
      - Domande degli anni precedenti, comprese le eventuali domande secondarie associate

      Consigli:

      - Guardare molto bene le domande degli anni precedenti.
      - Prestare attenzione a curve e grafici.
      - Allenarsi nell’interpretazione dell’emogasanalisi.
      - Non limitarsi alla memorizzazione: è importante capire i meccanismi fisiopatologici alla base dei quadri di terapia intensiva.
    professors:
      - nome: Bottazzi
        stile: Durante l’esame può essere richiesto, soprattutto da lui, di interpretare un’emogasanalisi, diagnosticare il quadro, commentare i risultati e interpretare curve e grafici.
      - nome: Natoli
  - nome_modulo: Chirurgia d’urgenza
    id: m-or9pjiie
    exam_type: Scritto
    exam_details: |-
      Esame scritto a crocette, composto da 30 domande.
      Il punteggio segue una scala in cui:

      - 30/30 = 30 e lode
      - gli altri punteggi vengono assegnati a scalare.
    program: |-
      Il programma prevede i seguenti argomenti:

      - Appendicite acuta
      - Emergenze biliari
      - Diverticolite
      - Pancreatite acuta
      - Occlusione intestinale
      - Emorragie del tratto gastroenterico
      - Perforazione gastrointestinale
      - Traumi
      - Damage control surgery

      *Programma ufficiale dell’insegnamento (a.a. 2026/2027).*
    material_tips: |-
      Fonti consigliate:

      - Slide
      - Domande degli esami passati

      Consigli:

      - Fare con particolare attenzione le domande degli esami precedenti.
      - Le domande tendono a ripetersi molto frequentemente: in alcuni casi possono ripresentarsi anche interi esami.
  - nome_modulo: Clinica chirurgica
    id: m-ke2k2iky
    exam_type: Orale
    exam_details: |-
      Esame orale, a gruppi e in ordine alfabetico.

      - Durata: circa 30 minuti per gruppo.
      - L’esame può diventare piuttosto lungo a causa della tendenza dei docenti a divagare.
      - La prima domanda può essere orientata anche sulla base del reparto in cui si è interni o della futura specializzazione.

      I docenti sono molto tranquilli.
    program: |-
      - **Storia della Chirurgia**: cenni. Chirurgia laparoscopica e robotica.
      - **La sala operatoria**: struttura e organizzazione.
      - **La nutrizione artificiale parenterale ed enterale**. Posizionamento di catetere venoso centrale.
      - **Ernie e laparoceli**. Anatomia del canale inguinale e della parete addominale. Ernie inguinali e crurali. Ernie ombelicali. Laparoceli. Interventi di plastica erniaria.
      - **Tiroide e Surrene**. Embriologia ed anatomia. Tumori neuroendocrini e MEN. Iper- e ipo-paratiroidismo. Tiroidectomia. Paratiroidectomia. Surrenalectomia.
      - **Esofago e stomaco**. Anatomia. Diverticoli e tumori dell’esofago. Esofago di Barrett. Acalasia esofagea. S. di Mallory-Weiss. Ernie jatali. Ulcera peptica. Gastrite emorragica. Precancerosi. Tumori maligni dello stomaco. Classificazione TNM e stadiazione. Emorragie delle prime vie digestive. GIST. Resezioni esofagee. Intervento di Nissen. Resezioni gastriche. Gastrectomia totale. Gastroenteroanastomosi. Gastrostomie. Resezioni endoscopiche.
      - **Fegato e vie biliari**. Anatomia. Calcolosi della colecisti e delle vie biliari. Colangiti e fistole biliari. Tumori primitivi e secondari del fegato. Ipertensione portale. Cisti e ascessi epatici. Colecistectomia. Resezioni epatiche. Terapie ablative (RFTA, MW, etc.).
      - **Pancreas**. Anatomia. Pancreatiti acute e croniche. Cisti e pseudocisti. Tumori esocrini e tumori endocrini. Tumori della papilla di Vater. Necrosectomia pancreatica. Resezioni parziali e totali del pancreas.
      - **Ileo, colon e retto**. Anatomia. M. di Crohn. Rettocolite ulcerosa. Sindrome di Gardner. Diverticolosi e diverticolite. Diverticolo di Meckel. Tumori benigni e maligni dell’ileo, del colon e del retto. Appendicite e tumori dell’appendice. Infarto intestinale e sindrome da intestino corto. Enterite attinica. Ragade anale. Emorroidi. Prolasso del retto. Emorragie dell’ileo, colon e retto. Resezioni intestinali. Colostomia, ileostomia. Resezioni endoscopiche.
      - **Peritoneo**. Anatomia e fisiopatologia. Tumori del peritoneo. Emoperitoneo. Peritonectomia sec. Sugarbaker e chemioterapia ipertermica.
      - **Addome acuto**. Occlusione intestinale (ileo dinamico, ileo meccanico, ileo biliare, invaginazione intestinale). Perforazione intestinale. Peritoniti acute. S. compartimentale. Addome aperto. Vacuum therapy.
      - **Mammella e cavo ascellare**. Anatomia. Mastiti. Condizioni predisponenti e trasformazione neoplastica. Mutazioni genetiche. Tumori della mammella, classificazione TNM e loro stadiazione. M. di Paget. Mastectomia radicale. Quadrantectomia. Linfonodo sentinella. Svuotamento del cavo ascellare. Ricostruzione con protesi.
      - **Rene e vie genitali**. Tumori benigni e maligni del rene, dell’uretere, della vescica e del testicolo. Varicocele. Criptorchidismo. Cisti del funicolo. Idrocele. Torsione testicolare. Nefrectomia. Cistectomia. Orchiectomia. Interventi per varicocele.
      - **Trapianti d’organo**. Trapianto di rene, fegato, pancreas, intestino. Trapianti multiviscerali. Organi artificiali.

      *Programma ufficiale dell’insegnamento (a.a. 2026/2027).*
    material_tips: |-
      **Sul programma**

      Il programma è ampio e comprende numerosi argomenti di chirurgia generale.
      Particolare attenzione a:

      - Pancreas
      - Colecisti
      - Anatomia delle strutture più frequentemente citate
      - Gestione del paziente traumatizzato
      - Elementi pratici relativi alla chirurgia

      Non è necessario perdersi eccessivamente nei dettagli delle tecniche chirurgiche, che solitamente non costituiscono il focus dell’esame.

      Le sbobine sono molto ampie e possono risultare eccessive da studiare integralmente. È consigliabile:

      - fare una lettura delle sbobine;
      - selezionare le informazioni più rilevanti;
      - utilizzare le domande degli anni precedenti per capire su quali argomenti concentrarsi.

      Particolare attenzione alle sbobine sul pancreas, argomento estremamente richiesto dal Prof. Cobianchi.
      Non cercare di imparare integralmente tutte le sbobine.
      Usare le domande passate per selezionare le informazioni realmente importanti.
    professors:
      - nome: Cobianchi
        stile: Richiede in particolare l’argomento pancreas.
