descrizione_generale: "L'esame è composto da tre moduli: Gastroenterologia, Chirurgia gastroenterologica, Nutrizione umana. Le tre parti devono essere sostenute tutte nello stesso appello: scritto di Nutrizione umana, orale di Gastroenterologia, orale di Chirurgia gastroenterologica. Non è possibile conservare il risultato di una singola parte per un appello successivo. Non è previsto il salto d'appello. Tempo di studio complessivo: 1 mese (studio intenso) – 2 mesi (per distribuire il carico). Preappello: previsto generalmente a fine maggio; nell'ultimo anno a numero chiuso con massimo 120 studenti; gli studenti non rientrati hanno sostenuto l'esame nell'appello successivo."
