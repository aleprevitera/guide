  - nome_modulo: Nutrizione umana
    id: m-v738a2c5
    exam_type: Scritto
    preappello: Sì
    exam_details: "Scritto di Nutrizione umana. La prova dura 45 minuti ed è composta da: 10 domande a scelta multipla, con una sola risposta corretta: risposta corretta → +2 punti; risposta non data → 0 punti; risposta sbagliata → −0,5 punti; 2 domande aperte, valutate da 0 a 5 punti ciascuna. Le domande aperte possono essere ricorrenti e ripetersi negli anni precedenti. Lo scritto si svolge all'inizio della giornata."
    program: |-
      Dispendio e bilancio energetico, fabbisogno energetico

      Dietetica fisiologica nell’adulto (Linee guida/LARN)

      Gruppi di alimenti e piramide alimentare

      Diagnostica Nutrizionale nell’adulto

      Obesità e terapia dietetica

      Sindrome Metabolica (Diabete, Dislipidemie, Ipertensione) e terapia dietetica

      Dietoterapia nelle Malattie croniche infiammatorie intestinali

      Dispendio e bilancio energetico, fabbisogno energetico

