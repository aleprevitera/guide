    material_tips: |-
      **Sul programma**

      Il programma va studiato principalmente attraverso le slide delle lezioni. Le domande aperte possono essere ricorrenti e ripetersi negli anni precedenti.

      La preparazione deve essere fatta principalmente dalle slide. È utile: frequentare le lezioni; prendere eventuali appunti; consultare le domande degli anni precedenti. La fonte fondamentale rimangono comunque le slide, perché le informazioni necessarie per lo scritto sono contenute al loro interno. Poiché le slide possono cambiare di anno in anno, è consigliato utilizzare quelle più aggiornate dell'anno di corso corrente.
    body: |-
      **Domande e argomenti ricorrenti**

      Nutrizione umana

      Le domande aperte possono ripetersi negli anni precedenti. Per questo motivo è utile consultare i file contenenti le domande degli appelli passati. Non essendo stati forniti gli argomenti specifici delle domande aperte, non vengono riportati ulteriori contenuti in questa guida.

      Frequenza: Il controllo delle presenze sembra essere leggermente più rigoroso, anche se non in maniera sistematica. Nell'ultimo anno, ad esempio, è capitato una volta che venisse fatto circolare il foglio firme perché il codice non funzionava.
