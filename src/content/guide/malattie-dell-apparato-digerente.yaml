    material_tips: |-
      **Sul programma**

      Il programma è molto ampio e deve essere studiato nel suo complesso. Particolare attenzione va dedicata alle principali sindromi gastroenteriche, che costituiscono frequentemente oggetto della prima domanda. È consigliato integrare il programma con: - Dolore addominale → Rugarli, capitolo 1 di Gastroenterologia. - Vomito e diarrea → Unigastro. - Ittero → Rugarli, con particolare attenzione ai diversi tipi di ittero. - Epatiti → approfondire epatiti alcoliche, virali e da farmaci. - Giardia → Rugarli, perché può essere chiesta anche se non adeguatamente trattata a lezione. È particolarmente importante saper riconoscere i sintomi d'allarme. I docenti insistono molto su questo aspetto durante le lezioni. In presenza di un sintomo d'allarme bisogna sapere quale approfondimento diagnostico sia indicato, in particolare: gastroscopia; colonscopia. Non è quindi sufficiente conoscere la singola patologia: bisogna sapere anche come comportarsi davanti al paziente e quando è indicato un approfondimento endoscopico.

      La fonte principale consigliata sono le sbobine 2023-2024, considerate le più complete. È tuttavia necessario integrare alcuni argomenti utilizzando materiale di altre annate: - Sbobine 2023-2024 → base principale. - Breath test all'idrogeno → sbobine 2025-2026. - Anemia in gastroenterologia → sbobine 2024-2025. - Stipsi → sbobine 2022-2023. È quindi necessario fare un po' di collage tra le diverse annate. Dal Rugarli: - capitolo 1 di Gastroenterologia → da fare integralmente; - dolore addominale → particolarmente importante; - ittero → da approfondire bene; - epatiti → consigliato approfondimento; - Giardia → da studiare perché può essere richiesta. Per vomito e diarrea è consigliato utilizzare Unigastro.
    body: |-
      **Domande e argomenti ricorrenti**

      Gastroenterologia – domande di Biagi

      Prima domanda:

      - Disfagia
      - Dispepsia
      - Vomito
      - Diarrea
      - Stipsi
      - Melena
      - Rettorragia
      - Ittero
      - Ascite
      - Dolore addominale acuto
      - Dolore addominale cronico

      Seconda domanda:

      - Acalasia
      - Neoplasie dell'esofago
      - MRGE – condizioni predisponenti
      - MRGE – quadro clinico
      - MRGE – complicanze
      - Ulcera peptica – cause
      - Ulcera peptica – quadro clinico
      - Ulcera peptica – complicanze
      - Gastriti croniche – tipi
      - Danno da FANS
      - HP e malattie correlate
      - Tumori dello stomaco
      - Anemie in gastroenterologia
      - Malattia celiaca – eziopatogenesi
      - Malattia celiaca – clinica
      - Malattia celiaca – complicanze
      - Morbo di Whipple
      - Morbo di Crohn vs RCU
      - Morbo di Crohn – clinica
      - Morbo di Crohn – complicanze
      - RCU – clinica
      - RCU – complicanze
      - Tumori maligni del colon
      - Polipi del colon
      - Epatiti acute
      - Danno da alcol
      - Cirrosi epatica – cause
      - Cirrosi epatica – quadro clinico
      - Cirrosi epatica – complicanze
      - Colecistite acuta
      - Colica biliare
      - Pancreatite acuta – cause
      - Pancreatite acuta – clinica

      Frequenza: I docenti generalmente non utilizzano il codice per verificare la presenza. I controlli non sono particolarmente rigorosi. In alcuni casi viene comunicato che verrà utilizzato il codice, ma nella pratica non viene effettuato un controllo stringente.
