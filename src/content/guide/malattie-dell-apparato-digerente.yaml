  - nome_modulo: Chirurgia gastroenterologica
    id: m-ohza1kya
    exam_type: Orale
    preappello: Sì
    durata_orale_min: 15
    exam_details: "Orale di Chirurgia gastroenterologica. L'orale prevede generalmente 2 domande: una prima domanda relativa a un primo blocco di argomenti; una seconda domanda relativa a un secondo blocco di argomenti. Le domande sono generalmente piuttosto schematiche e secche. L'interrogazione dura mediamente 15-20 minuti, anche se la durata può variare in base al docente e all'andamento dell'interrogazione. Se lo studente si trova in difficoltà, il docente può porre ulteriori domande. Nell'ultimo anno erano presenti 3 docenti + 1 specializzanda."
    program: |-
      - Semeiologia ed esame obiettivo nelle malattie dell'apparato digerente.
      - Dolore addominale acuto e cronico (approccio fisiopatologico, semeiologico e clinico).
      - Addome acuto chirurgico (peritonitico, occlusivo, vascolare).
      - Appendicite acuta.
      - Pseudoaddome acuto (medico).
      - Le ernie parietali addominali. Lo strozzamento erniario.
      - Le ernie diaframmatiche congenite ed acquisite.
      - Il megaesofago. I diverticoli esofagei.
      - Tumori benigni e maligni dell'esofago.
      - Tumori benigni e maligni dello stomaco. Precancerosi gastriche.
      - Patologia infiammatoria e tumorale del tenue mesenteriale.
      - Malattie infiammatorie croniche dell'intestino (retto - colite ulcerosa, morbo di Crohn).
      - Precancerosi intestinali. Polipi intestinali. Poliposi.
      - Diverticolosi del colon.
      - Megacolon (congenito, acquisito, tossico).
      - Carcinoma del colon-retto.
      - Patologia infiammatoria acuta e cronica del pancreas.
      - Tumori benigni e maligni del pancreas.
      - APUDomi. Carcinoidi. Adenomatosi endocrine multiple di rilevanza chirurgica. Sindromi endocrine paraneoplastiche.
      - Splenopatie chirurgiche.
      - Tumori benigni e maligni del fegato (lesioni epatiche focali).
      - Il paziente cirrotico candidato ad intervento chirurgico.
      - L'ittero chirurgico. Inquadramento generale e aspetti eziopatogenetici.
      - Patologia infiammatoria delle via biliari.
      - Malformazioni e tumori delle vie biliari.
      - La calcolosi biliare.
      - L'ipertensione portale.
      - Malattie dell'ano d'interesse chirurgico (ragade, ascesso, fistola, varici emorroidarie, cancro).
      - Masse addominali (intraperitoneari, retroperitoneari).
      - Cellule staminali e chirurgia.
      - Trapianti d'organo.

      - Inquadramento e trattamento multidisciplinare dell'obesità patologica - Semeiologia ed esame obiettivo nelle malattie dell'apparato digerente. - Dolore addominale acuto e cronico (approccio fisiopatologico, semeiologico e clinico). - Addome acuto chirurgico (peritonitico, occlusivo, vascolare). - Appendicite acuta. - Le ernie parietali addominali. Lo strozzamento erniario. - Le ernie diaframmatiche congenite ed acquisite. - MRGE e Barrett - Il megaesofago. I diverticoli esofagei. - Acalasia.- Tumori benigni e maligni dell'esofago. - Tumori benigni e maligni dello stomaco. Precancerosi gastriche. - Patologia infiammatoria e tumorale del tenue mesenteriale. - Malattie infiammatorie croniche dell'intestino (retto - colite ulcerosa, morbo di Crohn). - Precancerosi intestinali. Polipi intestinali. Poliposi. - Diverticolosi del colon. - Megacolon (congenito, acquisito, tossico). - Carcinoma del colon-retto. - Patologia infiammatoria acuta e cronica del pancreas. - Tumori benigni e maligni del pancreas. - Ipertensione Portale.- Sindrome Compartimentale Addominale.- L'ittero chirurgico. Inquadramento generale e aspetti eziopatogenetici. - Patologia infiammatoria delle via biliari. - La calcolosi biliare. - Malattie dell'ano d'interesse chirurgico (ragade, ascesso, fistola, varici emorroidarie, cancro). - Cellule staminali e chirurgia. - Trapianti d'organo.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2023/10045/insegnamenti/2026/11166/2017/9999?coorte=2023&schemaid=17807).*
    material_tips: |-
      **Sul programma**

      Le domande sono abbastanza varie. Nell'ultimo anno è stata dedicata particolare attenzione alla chirurgia bariatrica, che può quindi rappresentare un argomento su cui i docenti si soffermano. È importante considerare anche gli argomenti non spiegati direttamente a lezione ma presenti nelle slide, perché possono comunque essere oggetto d'esame. Nell'ultimo anno, ad esempio, sono state richieste: ernie addominali; acalasia.

      Poiché nell'ultimo anno sono cambiati i docenti, è consigliato utilizzare principalmente le sbobine 2025-2026, più aggiornate e maggiormente in linea con gli argomenti effettivamente richiesti. Non è più necessario affidarsi al vecchio libro utilizzato negli anni precedenti: le sbobine dell'anno sono considerate sufficienti. È comunque importante controllare le slide, soprattutto per gli argomenti indicati dai docenti ma non spiegati direttamente a lezione, perché possono essere richiesti all'esame.
    body: |-
      **Domande e argomenti ricorrenti**

      Chirurgia gastroenterologica

      Le domande sono abbastanza varie. Possono essere richiesti anche argomenti non spiegati direttamente a lezione, ma presenti nelle slide. Tra gli argomenti richiesti nell'ultimo anno: ernie addominali; acalasia. Particolare attenzione anche alla chirurgia bariatrica, sulla quale sono state svolte numerose lezioni.

      Frequenza: I docenti generalmente non utilizzano il codice per verificare la presenza. I controlli non sono particolarmente rigorosi. In alcuni casi viene comunicato che verrà utilizzato il codice, ma nella pratica non viene effettuato un controllo stringente.
