  - nome_modulo: Chirurgia pediatrica
    id: m-5o6zmswx
    exam_type: Orale
    exam_details: L’esame è tenuto dal Prof. Bertozzi. Vengono generalmente interrogati tre studenti insieme.
    program: |-
      **Chirurgia pediatrica**

      **Argomenti irrinunciabili:**

      - atresia dell'esofago
      - ernia diaframmatica congenita
      - occlusioni intestinali nel neonato
      - stenosi ipertrofica infantile del piloro
      - ernia inguinale
      - emorragie gastrointestinali
      - fimosi
      - criptorchidismo
      - addome acuto
      - masse addominali
      - idronefrosi
      - appendicite acuta

      **Argomenti opzionali:**

      - onfalocele
      - gastroschisi
      - atresia vie biliari
      - varicocele
      - neuroblastoma
      - nefroblastoma (tumore di Wilms)
      - epatoblastoma
      - reflusso vescicoureterale
      - ipospadia

      1. **Addome acuto nel bambino in chirurgia pediatrica**

      - Invaginazione intestinale
      - Appendicite acuta
      - diverticolo di Meckel e complicanze
      - volvolo
      - torsione ovarica
      - torsione tubarica
      - empiema pleurico

      2. **Scroto acuto**

      - Torsione del testicolo
      - torsione delle idatidi
      - torsione dell’epididimo
      - traumi del testicolo
      - epididimite e orchiepididimite

      2. **Malformazioni congenite**

      - Ernia diaframmatica congenita
      - atresie del tubo digerente, dall'esofago al retto
      - Hirschsprung
      - Malrotazione intestinale

      4. **Routine in chirurgia pediatrica**

      - Stenosi ipertrofica infantile del piloro
      - ernia inguinale congenita
      - idrocele
      - criptorchidismo
      - varicocele
      - fimosi e parafimosi

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11272/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Gli argomenti da integrare comprendono:

      - canale inguinale;
      - stenosi ipertrofica del piloro;
      - malattia di Hirschsprung.

      - Sbobine 2024/2025 come base.
      - Integrare dalle sbobine 2025/2026 il canale inguinale.
      - Integrare dalle sbobine 2023/2024 la stenosi ipertrofica del piloro e la malattia di Hirschsprung.
      - Consultare le domande degli appelli precedenti, utili per orientare la preparazione.
    body: |-
      **Domande e argomenti ricorrenti**

      - Macroargomenti scelti dal Prof. Bertozzi; utile consultare le domande degli appelli precedenti

      Nota: Parigi non risulta più tra i docenti di Chirurgia pediatrica.
    professors:
      - nome: Mirko Bertozzi
        stile: Titolare del corso. Sceglie un macroargomento e pone domande a tre studenti insieme; se uno non sa rispondere, può rivolgersi agli altri. L’interrogazione è descritta come piuttosto imprevedibile e variabile da una giornata all’altra.
        email: mirko.bertozzi@unipv.it
      - nome: Amelia Licari
        email: amelia.licari@unipv.it
  - nome_modulo: Neuropsichiatria infantile (NPI)
    id: m-18qy3q5f
    exam_type: Orale
    exam_details: La NPI può risultare la parte più impegnativa dei tre moduli. I docenti possono essere particolarmente puntigliosi e richiedere un linguaggio preciso e specifico. È quindi importante utilizzare una terminologia corretta, evitando descrizioni vaghe o generiche, soprattutto nell’esposizione degli aspetti clinici e neurologici.
    program: |-
      **Neuropsichiatria infantile**

      **Argomenti irrinunciabili**

      - Sviluppo neuropsichico
      - Nascita della vita psichica
      - Lo sviluppo della relazione d'oggetto
      - Fattori protettivi e fattori di rischio per la relazione
      - Nozioni di epidemiologia nel campo della neuropsichiatria infantile
      - Approccio al bambino malato e alla sua famiglia
      - Esame neurologico del neonato, del lattante e del bambino
      - Valutazione psichiatrica
      - Normalità e patologia

      **I principali quadri della psicopatologia infantile**

      - Disturbi pervasivi dello sviluppo (Disturbi autistici e dello spettro autistico)
      - Disturbo da deficit di attenzione e iperattività
      - Nevrosi
      - Psicosi
      - Depressione nel bambino e nell'adolescente
      - Disturbi psicosomatici
      - Anoressia mentale dell'adolescente e Disturbi del comportamento alimentare
      - Disturbi di personalità
      - Psicopatologia dell'adolescente

      **I principali quadri della neurologia infantile**

      - Paralisi cerebrali infantili
      - Malformazioni del Sistema Nervoso Centrale e Idrocefalo
      - Epilessia dell'infanzia e dell'adolescenza e patologia convulsiva
      - Patologie del sistema extrapiramidale, Malattie neuromuscolari (amiotrofie spinali primitive, Distrofie muscolari, neuropatie periferiche, patologie della giunzione neuromuscolari)
      - Disturbi dell'apprendimento e del linguaggio
      - Ritardo mentale
      - Emicrania e cefalee precoci idiopatiche

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11272/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Da approfondire:

      - adolescenza;
      - malattie neuromuscolari;
      - crisi epilettiche e sindromi epilettiche specifiche, in particolare sindrome di West e sindrome di Lennox-Gastaut;
      - esame neurologico del bambino;
      - paralisi cerebrali.

      - Sbobine 2024/2025 come fonte principale.
      - Integrare dalle sbobine 2025/2026:
        - adolescenza;
        - malattie neuromuscolari;
        - crisi epilettiche e sindromi specifiche, soprattutto West e Lennox-Gastaut.
      - Studiare la parte relativa all’esame neurologico del bambino.
      - Integrare l’argomento delle paralisi cerebrali.
    body: |-
      **Domande e argomenti ricorrenti**

      - Malattie neuromuscolari, crisi epilettiche, sindrome di West, sindrome di Lennox-Gastaut, esame neurologico del bambino e paralisi cerebrali
      - Particolare attenzione alla precisione terminologica e all’esposizione specifica
