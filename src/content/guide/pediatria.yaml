id: g-0lom9qml
title: Pediatria
esse3_codice: "501763"
anno_di_corso: V Anno
cfu_totali: 7
semestre: II
descrizione_generale: |-
  L’esame è composto da tre moduli: Pediatria, Chirurgia pediatrica e Neuropsichiatria infantile (NPI). I tre orali si svolgono contemporaneamente.

  Tempo di studio complessivo: circa 1 mese di studio intenso.

  Voto finale: non specificato.

  **Consigli generali**

  - Personalizzare il ripasso in base ai docenti, tenendo presenti le relative sottospecialità e gli argomenti di maggiore interesse.
  - Preparare una buona introduzione sul proprio percorso: la prima domanda di Pediatria può riguardare la specializzazione desiderata o il reparto dell’internato.
  - Non limitarsi alle sbobine dell’anno principale: è necessario integrare il materiale degli altri anni.
  - Consultare le domande passate di Chirurgia pediatrica, che possono aiutare a orientare lo studio.
  - Curare particolarmente il linguaggio in NPI, utilizzando una terminologia precisa e specifica.
  - Non trascurare esame neurologico del bambino, paralisi cerebrali e sindromi epilettiche specifiche.
  - Per Pediatria, prestare attenzione agli argomenti legati alla propria eventuale area di internato o di interesse specialistico.
moduli:
  - nome_modulo: Pediatria
    id: m-akbjnuzm
    exam_type: Orale
    exam_details: Gli studenti vengono generalmente chiamati due alla volta, in ordine alfabetico, e ciascuno riceve due domande. I docenti tendono a concentrarsi sugli argomenti della propria sottospecialità. La prima domanda può riguardare la specializzazione desiderata o il reparto nel quale si sta svolgendo l’internato.
    program: |-
      **Pediatria generale e specialistica**

      **Argomenti irrinunciabili:**

      - note essenziali di fisiopatologia della vita intrauterina
      - assistenza al neonato normale e patologico (sofferenza fetale, asfissia perinatale)
      - neonato a termine, pre-termine e post-termine, di peso appropriato e di basso peso
      - fenomeni fisiologici neonatali
      - screening neonatali
      - ritardo di crescita intrauterina
      - encefalopatia ipossico-ischemica-emorragica
      - emorragie endocraniche
      - malattia delle membrane ialine
      - displasia broncopolmonare
      - itteri neonatali
      - enterocolite necrotizzante
      - atresia esofagea
      - stenosi ipertrofica del piloro
      - infezioni e sepsi neonatali
      - convulsioni neonatali.

      **Argomenti opzionali:**

      - adattamento alla vita extrauterina
      - neonato di peso molto basso
      - elementi di nutrizione del neonato;

      **Endocrinologia**

      **Argomenti irrinunciabili:**

      - note di auxologia
      - deficit staturali
      - deficit di ormone della crescita
      - pubertà normale, precoce e ritardata
      - ipotiroidismo, ipertiroidismo
      - tiroidite
      - gozzo
      - sindrome adrenogenitale
      - diabete mellito insulino-dipendente
      - diabete insipido
      - obesità semplice e patologica.

      **Malattie del metabolismo**

      **Argomenti irrinunciabili:**

      - rachitismo

      **Ematologia e oncoematologia**

      **Argomenti irrinunciabili:**

      - anemie
      - leucemie
      - linfomi
      - piastrinopenie
      - piastrinopatie.
      - epato-splenomegalie.

      **Gastroenterologia**

      **Argomenti irrinunciabili:**

      - vomito
      - reflusso gastroesofageo
      - gastroenterite
      - diarrea cronica
      - malassorbimento (malattia celiaca, fibrosi cistica)
      - malattia infiammatoria cronica (morbo di Crohn, rettocolite ulcerosa).

      **Patologia cromosomica**

      **Argomenti irrinunciabili:**

      - sindrome di Klinefelter, Turner, Down.

      **Immunologia ed allergologia**

      **Argomenti irrinunciabili:**

      - principali condizioni di immunodeficienza congenita ed acquisita
      - asma bronchiale.

      **Reumatologia**

      **Argomenti irrinunciabili:**

      - reumatismo articolare acuto
      - collagenopatie (artrite idiopatica giovanile, lupus eritematoso sistemico giovanile, dermatomiosite giovanile, porpora di Schönlein-Henoch, malattia di Kawasaki).

      **Nefrologia ed urologia**

      **Argomenti irrinunciabili:**

      - sindrome nefrosica
      - sindrome nefritica
      - infezioni delle vie urinarie.

      **Infettivologia**

      **Argomenti irrinunciabili:**

      - febbre
      - morbillo
      - rosolia
      - megaloeritema infettivo
      - esantema critico
      - varicella
      - scarlattina
      - mononucleosi infettiva
      - parotite
      - pertosse
      - meningite a liquor torbido e limpido
      - tubercolosi.

      **Vaccinazioni**

      **Argomenti irrinunciabili:**

      - vaccinazioni obbligatorie e facoltative.

      **Broncopneumologia**

      **Argomenti irrinunciabili:**

      - faringo-tonsillite acuta
      - sinusite
      - otite media
      - laringiti
      - bronchite acuta
      - bronchiolite
      - polmoniti
      - pleuriti
      - tosse.

      **Argomenti opzionali:**

      - bronchiectasie
      - pneumopatie croniche.

      **Cardiologia**

      **Argomenti irrinunciabili:**

      - principali cardiopatie congenite.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11272/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Oltre al programma generale, è utile approfondire:

      - pneumologia: polmoniti, asma e bronchiolite;
      - celiachia;
      - infezioni del sistema nervoso;
      - crisi epilettiche;
      - sindrome di Guillain-Barré;
      - atassia;
      - anemie;
      - gastroenterologia, nefrologia e otorinolaringoiatria, soprattutto in relazione al reparto frequentato durante l’internato o alla specializzazione di interesse.

      La fonte principale sono le sbobine 2024/2025, da integrare con materiale di altri anni:

      - sbobine 2023/2024: polmoniti, asma, bronchiolite, celiachia, infezioni del sistema nervoso e crisi epilettiche;
      - sbobine 2025/2026: sindrome di Guillain-Barré, atassia e anemie.

      Le anemie sono un argomento richiesto frequentemente dal Prof. Castagnoli.
      Dal libro è utile leggere le parti relative a gastroenterologia, nefrologia e ORL, soprattutto se si sta svolgendo un internato in questi reparti.
    body: |-
      **Domande e argomenti ricorrenti**

      - Immunologia, in particolare SCID; pubertà e crescita; anemie; Guillain-Barré; atassia
      - Specializzazione desiderata o reparto dell’internato come possibile prima domanda
    professors:
