id: g-0lom9qml
title: Pediatria
anno_di_corso: V Anno
descrizione_generale: |-
  L'esame è composto da tre moduli: **Pediatria**, **Chirurgia pediatrica** e **Neuropsichiatria infantile (NPI)**. I tre orali si svolgono contemporaneamente.

  Tempo di studio complessivo: circa un mese di studio intenso per preparare tutti e tre i moduli.
moduli:
  - nome_modulo: Pediatria
    id: m-akbjnuzm
    exam_type: Orale
    exam_details: Gli studenti vengono chiamati due alla volta, in ordine alfabetico. Ogni studente riceve due domande. I docenti tendono a interrogare sugli argomenti della propria sottospecialità. La prima domanda verte spesso sulla specializzazione che si desidera intraprendere o sul reparto in cui si sta svolgendo l’internato.
    program: |-
      **PEDIATRIA GENERALE E SPECIALISTICA**

      Argomenti irrinunciabili: note essenziali di fisiopatologia della vita intrauterina; assistenza al neonato normale e patologico (sofferenza fetale, asfissia perinatale); neonato a termine, pre-termine e post-termine, di peso appropriato e di basso peso; fenomeni fisiologici neonatali; screening neonatali; ritardo di crescita intrauterina; encefalopatia ipossico-ischemica-emorragica; emorragie endocraniche; malattia delle membrane ialine; displasia broncopolmonare; itteri neonatali; enterocolite necrotizzante; atresia esofagea; stenosi ipertrofica del piloro; infezioni e sepsi neonatali; convulsioni neonatali.

      Argomenti opzionali: adattamento alla vita extrauterina; neonato di peso molto basso; elementi di nutrizione del neonato;

      **ENDOCRINOLOGIA**

      Argomenti irrinunciabili: note di auxologia; deficit staturali; deficit di ormone della crescita; pubertà normale, precoce e ritardata; ipotiroidismo, ipertiroidismo; tiroidite; gozzo; sindrome adrenogenitale; diabete mellito insulino-dipendente; diabete insipido; obesità semplice e patologica.

      **MALATTIE DEL METABOLISMO**

      Argomenti irrinunciabili: rachitismo

      **EMATOLOGIA E ONCOEMATOLOGIA**

      Argomenti irrinunciabili: anemie; leucemie; linfomi; piastrinopenie; piastrinopatie.

      epato-splenomegalie.

      **GASTROENTEROLOGIA**

      Argomenti irrinunciabili: vomito; reflusso gastroesofageo; gastroenterite; diarrea cronica; malassorbimento (malattia celiaca, fibrosi cistica); malattia infiammatoria cronica (morbo di Crohn, rettocolite ulcerosa).

      **PATOLOGIA CROMOSOMICA**

      Argomenti irrinunciabili: sindrome di Klinefelter, Turner, Down.

      IMMUNOLOGIA ed ALLERGOLOGIA

      Argomenti irrinunciabili: principali condizioni di immunodeficienza congenita ed acquisita; asma bronchiale.

      **REUMATOLOGIA**

      Argomenti irrinunciabili: reumatismo articolare acuto; collagenopatie (artrite idiopatica giovanile, lupus eritematoso sistemico giovanile, dermatomiosite giovanile, porpora di Schönlein-Henoch, malattia di Kawasaki).

      NEFROLOGIA ed UROLOGIA

      Argomenti irrinunciabili: sindrome nefrosica; sindrome nefritica; infezioni delle vie urinarie.

      **INFETTIVOLOGIA**

      Argomenti irrinunciabili: febbre; morbillo; rosolia; megaloeritema infettivo; esantema critico; varicella; scarlattina; mononucleosi infettiva; parotite; pertosse; meningite a liquor torbido e limpido; tubercolosi.

      **VACCINAZIONI**

      Argomenti irrinunciabili: vaccinazioni obbligatorie e facoltative.

      **BRONCOPNEUMOLOGIA**

      Argomenti irrinunciabili: faringo-tonsillite acuta; sinusite; otite media; laringiti; bronchite acuta; bronchiolite; polmoniti; pleuriti; tosse.

      Argomenti opzionali: bronchiectasie; pneumopatie croniche.

      **CARDIOLOGIA**

      Argomenti irrinunciabili: principali cardiopatie congenite.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11272/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Il programma ufficiale è quello previsto dal syllabus. Oltre al programma generale, è utile approfondire:

      - Pneumologia: polmoniti, asma e bronchiolite.
      - Celiachia.
      - Infezioni del sistema nervoso e crisi epilettiche.
      - Sindrome di Guillain-Barré, atassia e anemie.
      - Gastroenterologia, nefrologia e otorinolaringoiatria, soprattutto in relazione al reparto frequentato durante l’internato o alla specializzazione di interesse.

      Sbobine 2024-2025 come fonte principale.

      Integrare dalle sbobine 2023-2024:

      - Pneumologia: polmoniti, asma e bronchiolite.
      - Celiachia.
      - Infezioni del sistema nervoso.
      - Crisi epilettiche.

      Integrare dalle sbobine 2025-2026:

      - Sindrome di Guillain-Barré.
      - Atassia.
      - Anemie, argomento richiesto frequentemente dal professor Castagnoli.

      Dal libro: lettura delle parti di gastroenterologia, nefrologia e ORL, soprattutto se si sta svolgendo un internato in questi reparti.

      Consiglio generale: non limitarsi alle sbobine dell’anno principale; integrare gli argomenti indicati dalle sbobine degli altri anni.
    professors:
      - nome: Castagnoli
        stile: Interroga su immunologia, ad esempio SCID; anemie.
      - nome: Brambilla
        stile: Interroga su pubertà e crescita.
  - nome_modulo: Chirurgia pediatrica
    id: m-5o6zmswx
    exam_type: Orale
    exam_details: Interroga il professor Bertozzi; Parigi non è più presente. Vengono interrogati tre studenti insieme.
    program: |-
      **CHIRURGIA PEDIATRICA**

      Argomenti irrinunciabili: atresia dell'esofago; ernia diaframmatica congenita; occlusioni intestinali nel neonato; stenosi ipertrofica infantile del piloro; ernia inguinale; emorragie gastrointestinali; fimosi; criptorchidismo; addome acuto; masse addominali; idronefrosi; appendicite acuta.

      Argomenti opzionali: onfalocele; gastroschisi; atresia vie biliari; varicocele; neuroblastoma; nefroblastoma (tumore di Wilms); epatoblastoma; reflusso vescicoureterale; ipospadia.

      1. ADDOME ACUTO NEL BAMBINO IN CHIRURGIA PEDIATRICA

      Invaginazione intestinale, Appendicite acuta, diverticolo di Meckel e

      complicanze, volvolo, torsione ovarica, torsione tubarica, empiema

      pleurico.

      2. SCROTO ACUTO

      Torsione del testicolo, torsione delle idatidi, torsione dell’epididimo,

      traumi del testicolo, epididimite e orchiepididimite

      2. MALFORMAZIONI CONGENITE

      Ernia diaframmatica congenita; atresie del tubo digerente, dall'esofago al

      retto; Hirschsprung; Malrotazione intestinale

      4. ROUTINE IN CHIRURGIA PEDIATRICA

      Stenosi ipertrofica infantile del piloro, ernia inguinale congenita, idrocele,

      criptorchidismo, varicocele, fimosi e parafimosi

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11272/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Gli argomenti da integrare comprendono:

      - Canale inguinale.
      - Stenosi ipertrofica del piloro.
      - Malattia di Hirschsprung.

      Sbobine 2024-2025.

      Integrare dalle sbobine 2025-2026 il canale inguinale.

      Integrare dalle sbobine 2023-2024 stenosi ipertrofica del piloro e malattia di Hirschsprung.

      Consultare le domande degli appelli precedenti: possono essere di grande aiuto per orientare la preparazione. Possono aiutare a orientarsi, pur senza garantire che gli argomenti si ripetano.

      Consiglio generale: non limitarsi alle sbobine dell’anno principale; integrare gli argomenti indicati dalle sbobine degli altri anni.
    professors:
      - nome: Bertozzi
        stile: Sceglie un macroargomento e pone domande ai tre studenti; se uno non sa rispondere, può rivolgersi agli altri. L’interrogazione viene descritta come piuttosto imprevedibile e variabile da una giornata all’altra.
  - nome_modulo: Neuropsichiatria infantile (NPI)
    id: m-18qy3q5f
    exam_type: Orale
    exam_details: I docenti possono essere molto puntigliosi e richiedere un linguaggio preciso e specifico. È quindi importante saper esporre gli argomenti con terminologia corretta, evitando descrizioni vaghe o generiche.
    program: |-
      **NEUROPSICHIATRIA INFANTILE**

      Argomenti irrinunciabili - Sviluppo neuropsichico; Nascita della vita psichica. Lo sviluppo della relazione d'oggetto; Fattori protettivi e fattori di rischio per la relazione; Nozioni di epidemiologia nel campo della neuropsichiatria infantile. Approccio al bambino malato e alla sua famiglia; Esame neurologico del neonato, del lattante e del bambino; Valutazione psichiatrica; Normalità e patologia.

      I principali quadri della psicopatologia infantile; Disturbi pervasivi dello sviluppo (Disturbi autistici e dello spettro autistico); Disturbo da deficit di attenzione e iperattività; Nevrosi; Psicosi; Depressione nel bambino e nell'adolescente. Disturbi psicosomatici; Anoressia mentale dell'adolescente e Disturbi del comportamento alimentare; Disturbi di personalità; Psicopatologia dell'adolescente.

      I principali quadri della neurologia infantile: Paralisi cerebrali infantili; Malformazioni del Sistema Nervoso Centrale e Idrocefalo; Epilessia dell'infanzia e dell'adolescenza e patologia convulsiva; Patologie del sistema extrapiramidale, Malattie neuromuscolari (amiotrofie spinali primitive, Distrofie muscolari, neuropatie periferiche, patologie della giunzione neuromuscolari). Disturbi dell'apprendimento e del linguaggio. Ritardo mentale. Emicrania e cefalee precoci idiopatiche.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11272/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Da approfondire:

      - Adolescenza.
      - Malattie neuromuscolari.
      - Crisi epilettiche e sindromi epilettiche specifiche, in particolare sindrome di West e sindrome di Lennox-Gastaut.
      - Esame neurologico del bambino.
      - Paralisi cerebrali.

      Sbobine 2024-2025 come fonte principale.

      Integrare dalle sbobine 2025-2026:

      - Adolescenza.
      - Malattie neuromuscolari.
      - Crisi epilettiche e sindromi specifiche, soprattutto West e Lennox-Gastaut.

      Leggere la parte relativa all’esame neurologico del bambino.

      Integrare l’argomento delle paralisi cerebrali.

      Consiglio generale: non limitarsi alle sbobine dell’anno principale; integrare gli argomenti indicati dalle sbobine degli altri anni.
