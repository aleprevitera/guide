    fascia_studio: < 1 sett
  - nome_modulo: Geriatria
    id: m-2f76o2dk
    study_time: mezza giornata – 4 giorni
    preappello: No
    frequenza: Obbligatoria
    exam_details: "Non vengono concessi appelli extra. Frequenza obbligatoria: almeno il 60% di presenze (Prof.ssa Noris è fiscale)."
    program: |-
      Per ogni singolo quadro clinico di interesse internistico, geriatrico o di patologie che si osservano sul territorio, verranno forniti allo studente gli strumenti necessari all'utilizzo ed all'interpretazione delle più comuni indagini bioumorali e strumentali necessarie a confermare il sospetto diagnostico formulato sulla base delle note anamnestiche ed obiettive raccolte al letto del paziente o nel proprio studio medico. Verranno forniti allo studente gli strumenti necessari per l'elaborazione di un corretto piano terapeutico, sia farmacologico che interventistico.

      **Gerontologia:**

      - biologia dell'invecchiamento
      - teorie dell'invecchiamento
      - fisiologia dell'invecchiamento di organi e sistemi
      - aspetti demografici della senilità.

      **Geriatria:**

      - organizzazione dell'assistenza socio-sanitaria all'anziano
      - valutazione globale dell'anziano: assessment multidimensionale dell'autosufficienza
      - nutrizione e malnutrizione dell'anziano
      - la fragilità, alterazioni dell'assetto immunitario nell'invecchiamento
      - le più comuni patologie cardiovascolari dell'anziano
      - le più comuni patologie respiratorie dell'anziano
      - le più comuni patologie digestive dell'anziano
      - la stipsi, le più comuni patologie endocrine dell'anziano
      - il diabete senile e sue complicanze
      - la patologia ossea dell'anziano: osteoporosi e osteomalacia
      - le cadute.

      **I disturbi cognitivi dell'anziano:**

      - le demenze
      - i deficit cognitivi
      - il delirium
      - idrocefalo normoteso
      - disturbi della sfera affettiva e depressione nell’anziano
      - la sindrome da immobilizzazione
      - la sindrome ipocinetica
      - le lesioni da pressione
      - disordini dell'equilibrio idro-elettrolitico nell’anziano
      - la disidratazione
      - cenni sui disordini del sonno nell’anziano
      - la contenzione fisica dell’anziano
      - il dolore e le cure palliative dell’anziano
      - Morbo di Parkinson
      - apparato genito-urinario e cenni su incontinenza urinaria
      - infezioni delle vie urinarie
      - ipertrofia prostatica.

      **Livelli dell'assistenza in geriatria:**

      modelli di rete nell’assistenza dell’anziano.

      Problemi generali di farmacoterapia nell'età senile.

      Indicazione alle cure palliative e percorsi palliativistici

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11747/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: Materiali dell'a.a. 2025/2026 e successivi (il programma è cambiato). Slide della Prof.ssa Noris. Domande degli appelli precedenti. Le lezioni sono 8, ~100 pagine.
