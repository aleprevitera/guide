id: g-lwrqzriy
title: Patologia Generale
anno_di_corso: III Anno
descrizione_generale: "L'esame si compone di 3 parti: Patologia Generale, Fisiopatologia Generale (tenuta dalla Prof.ssa Scotti) e lezioni in aula sui preparati istopatologici con 2 esercitazioni obbligatorie. La parte scritta ha voto massimo 28/30 e consiste in 12 domande a risposta aperta per Patologia; Fisiopatologia è formata da una domanda e un esercizio (dati pH, paCO2 e HCO3- identificare acidosi/alcalosi, respiratoria/metabolica ed eventualmente compensata; talvolta l'esercizio può essere di altra tipologia o sostituito da una domanda). La durata della prova scritta è di un'ora e mezza. La parte orale, fino a 2/30, dura massimo 10 minuti e consiste nella discussione di un preparato istopatologico. Il voto finale è dato dalla somma del voto dello scritto (max 28/30) e dell'orale (fino a 2/30). Se si rifiuta il voto del vetrino è necessario rifare anche lo scritto; è possibile rifiutare lo scritto conservando l'esito dell'orale, che ha validità di 1 anno. L'ampiezza del programma e la severa correzione dei compiti rendono l'esame piuttosto complicato. Tempo di studio complessivo: da un minimo di 3 settimane/1 mese a 2 mesi. La frequenza è obbligatoria: è necessario il raggiungimento del 75% per sostenere l'esame, ma i controlli vengono effettuati esclusivamente dalla Prof.ssa Scotti, che richiede tassativamente il 75% del suo modulo (4 lezioni). In sede d'esame adottare la tecnica del 'Quality over quantity': rispondere direttamente alle domande senza prolissità; se richiesta solo la definizione, fornirla senza ulteriori spiegazioni; talvolta un semplice elenco è più efficace di una descrizione prolissa; quando richiesto un numero preciso di esempi, aggiungerne uno in più (n+1) senza eccedere. Apprendere le definizioni con la massima precisione."
