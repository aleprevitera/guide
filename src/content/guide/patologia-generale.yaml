  - nome_modulo: Preparati istopatologici
    id: m-fwggjwzc
    exam_type: Orale
    frequenza: Obbligatoria
    durata_orale_min: 10
    exam_details: "Prova orale: discussione di un preparato istopatologico, durata massima 10 minuti. Durante l'esame è consigliabile: iniziare l'osservazione a bassi ingrandimenti; passare progressivamente agli ingrandimenti maggiori; identificare le strutture fisiologiche; riconoscere le lesioni elementari; analizzare le diverse strutture e gli eventuali infiltrati; successivamente concentrarsi sull'area specifica indicata dalla docente. È più importante saper descrivere accuratamente ciò che si osserva rispetto a formulare rapidamente una diagnosi della lesione."
    program: |-
      Il corso di Patologia generale include 2 laboratori:

      - il primo di Istopatologia prevede un addestramento all'osservazione morfologica di preparati al microscopio;
      - il secondo di Patologia sperimentale include alcuni test sperimentali per la valutazione della tossicità o mutagenicità di sostanze chimiche.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2024/10045/insegnamenti/2026/10675/2024/9999?coorte=2024&schemaid=17804).*
    material_tips: |-
      È fortemente consigliato partecipare alle esercitazioni organizzate dalla professoressa. È inoltre utile avere a disposizione il materiale presente su Drive e quello degli anni precedenti, che illustra dettagliatamente l'analisi dei vetrini. Per visualizzare i preparati caricati dalla professoressa su Kiro è consigliato scaricare i software:

      - QPath per macOS;
      - Aperio ImageScope.

      I vetrini occupano molta memoria, circa 1 GB ciascuno. Questi programmi permettono di visualizzare i preparati con ingrandimenti simili a quelli dei microscopi utilizzati durante le esercitazioni e l'esame.
      Per la parte microscopica è consigliabile evitare un approccio puramente mnemonico e imparare invece ad analizzare criticamente ciò che si osserva. Le esercitazioni sono particolarmente importanti perché riguardano i vetrini che possono essere oggetto della prova d'esame.
