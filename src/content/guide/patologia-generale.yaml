      Questi testi non sono strettamente necessari per la preparazione dell'esame.
    body: |-
      **Domande e argomenti ricorrenti**

      - PNEI;
      - omeostasi;
      - pulsossimetro;
      - eustress/distress;
      - soluzione fisiologica;
      - ipossia;
      - iperosmolarità;
      - riserva funzionale;
      - salute, malattia e morte;
      - equilibrio acido-base.
