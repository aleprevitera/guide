    material_tips: |-
      **Sul programma**

      **Eziologia**: agenti di malattia estrinseci e intrinseci al processo morboso; lesione termica; radiazioni eccitanti e ionizzanti; agenti di natura chimica; biotrasformazioni.

      **Dinamica della lesione cellulare**: morte cellulare, necrosi, apoptosi, necroptosi, piroptosi; autofagia; calcificazioni patologiche. Spesso oggetto di domanda d'esame: significato di 'punto di non ritorno' in relazione alla dinamica di lesione cellulare; definire le alterazioni morfologiche che permettono di definire l'apoptosi e la necrosi con particolare riguardo anche ai modelli sperimentali.

      **Lesioni elementari**:

      - degenerazione e malattia degenerativa;
      - degenerazioni intracellulari (vacuolare e rigonfiamento torbido);
      - degenerazioni extracellulari (ialinosi, amiloidosi e degenerazione fibrinoide);
      - pigmentazioni;
      - infiammazione (modelli sperimentali, infiammazione acuta, infiammazione cronica, mediatori chimici cellulari e plasmatici, aspetti sistemici);
      - processi di guarigione (risoluzione, rigenerazione e riparazione);
      - accrescimenti patologici;
      - anomalie della crescita (ipertrofia, iperplasia, neoplasia);
      - anomalie del differenziamento (metaplasia, displasia, anaplasia);
      - cancerogenesi e mutagenesi;
      - infiammazione, immunità e tumori.

      **Spesso oggetto di domanda d'esame**:

      - le definizioni, descrizione del processo infiammatorio acuto con identificazione delle cause e le diverse modalità evolutive, particolarmente importanti i modelli sperimentali (risposta tripla);
      - distinguere, in base alla composizione, tra essudato e trasudato e, in base ai caratteri dell'essudato, i vari tipi di infiammazione acuta includendo la suppurazione (ascesso, foruncolo, flemmone, empiema);
      - focalizzarsi sulla distinzione tra risposta infiammatoria acuta immediata e ritardata facendo riferimento alle caratteristiche temporali, alla permeabilità vascolare e alla migrazione leucocitaria (da sapere dettagliatamente, nonostante sia stato già affrontato nell'esame di Immunologia);
      - fondamentale la conoscenza dei mediatori chimici coinvolti in tutto il processo in termini di meccanismo di produzione ed effetti; focalizzarsi anche sulle interazioni delle cascate enzimatiche dell'attivazione del complemento, della coagulazione e del sistema delle chinine finalizzate al mantenimento e all'amplificazione del danno tissutale;
      - definizione di infiammazione cronica e differenze rispetto a quella acuta in termini di natura dell'infiltrato cellulare e il ruolo delle cellule di origine mesenchimale. Analizzare la formazione e la risoluzione del granuloma includendo i fattori necessari a iniziare l'infiammazione granulomatosa, l'origine e il differenziamento delle cellule componenti e il ruolo della ipersensibilità ritardata nell'evoluzione del granuloma. Distinguere tra infiammazione cronica diffusa e infiammazione granulomatosa e descrizione di alcuni esempi di granuloma (da corpo estraneo, tubercolare e reumatico);
      - in merito ai processi di guarigione da sapere assolutamente le definizioni di guarigione, rigenerazione, riparazione e risoluzione. Descrivere il ruolo dei macrofagi, dei fibroblasti, delle cellule endoteliali, del sistema fibrinolitico e della matrice extracellulare. Descrivere la formazione e la funzione del tessuto di granulazione, analizzandone la composizione in termini di cellule, di matrice extracellulare, di rete vascolare, di molecole regolatrici della proliferazione cellulare;
      - per quanto concerne gli accrescimenti patologici: definire iperplasia e ipoplasia, ipertrofia e ipotrofia, agenesia, aplasia, neoplasia; saper definire la neoplasia distinguendo la crescita benigna da quella maligna; analizzare il significato di malignità negli aspetti clinico, biologico e morfologico; descrivere i meccanismi dell'invasione, includendo le metastasi e prendendo in esame le vie implicate e i fattori tessutali che le influenzano; analizzare l'ipotesi genetica (oncogeni, geni onco-soppressori, geni dell'apoptosi e geni della riparazione del DNA) e illustrare la storia naturale del tumore umano;
      - lesioni complesse: trombo e ateroma. Spesso oggetto di domanda d'esame: definire il trombo differenziandolo dal coagulo. Definire l'emostasi e analizzare a livello molecolare la funzione delle piastrine, la progressione della cascata coagulativa, il sistema fibrinolitico e i meccanismi di controllo umorali, piastrinici ed endoteliali. Saper definire la triade di Virchow, illustrare l'evoluzione del trombo e la formazione dell'embolo;
      - definire la coagulazione intravascolare disseminata analizzando gli stimoli che portano alla comparsa nel microcircolo di trombina e di plasmina e le condizioni che, alimentando un circolo vizioso, portano a un grave danno tessutale;
      - descrivere i fenomeni di Sanarelli e di Schwartzman, illustrando i meccanismi molecolari che li provocano;
      - analizzare i rapporti tra coagulazione intravascolare disseminata e i fenomeni di Sanarelli e di Schwartzman;
      - in merito all'ateroma, da sapere le definizioni di arteriosclerosi, arteriolosclerosi, aterosclerosi e malattia aterosclerotica. Descrivere la morfologia delle lesioni aterosclerotiche iniziali e avanzate. Considerando l'ateroma come una risposta della parete delle arterie al danno, e in base alle informazioni provenienti dai principali modelli sperimentali, ricostruire la sequenza degli eventi che portano alla lesione complicata, alla progressione o alla regressione della placca includendo le cellule endoteliali, le cellule muscolari lisce, i monociti, le piastrine del sangue e le sostanze secrete da queste cellule. Elencare gli indicatori di rischio dell'aterosclerosi delineandone il contributo alla patogenesi delle lesioni ateromatose.

      La Prof.ssa Stivala consiglia di utilizzare:

      - Patologia generale, Altucci et al. (Idelson-Gnocchi). Le Basi patologiche delle malattie (Vol. I);
      - Robbins e Cotran (Elsevier - Masson). Patogenesi;
      - Pardi e Di Fiore 2023 (Piccin). Cellule, tessuti e malattia;
      - Principi di patologia generale – Guido Majno, Isabelle Joris (CEA).

      Non strettamente necessari ai fini della preparazione dell'esame.
