        email: claudia.scotti@unipv.it
  - nome_modulo: Preparati istopatologici
    id: m-fwggjwzc
    exam_type: Orale
    durata_orale_min: 10
    exam_details: "Prova orale: discussione di un preparato istopatologico, durata massima 10 minuti. Se si rifiuta il voto del vetrino è necessario rifare anche lo scritto. È possibile rifiutare lo scritto conservando l'esito dell'orale, che ha validità di 1 anno. In una fase successiva, la docente richiederà la descrizione di un'area specifica, evidenziando l'importanza di un'analisi approfondita delle diverse strutture e degli infiltrati presenti. Si attribuisce maggiore rilevanza alla descrizione accurata di ciò che si osserva al vetrino rispetto alla formulazione di una 'diagnosi' della lesione visibile."
    program: |-
      Il corso di Patologia generale include 2 laboratori: il primo di Istopatologia prevede un addestramento all'osservazione morfologica di preparati al microscopio; il secondo di Patologia sperimentale include alcuni test sperimentali per la valutazione della tossicità o mutagenicità di sostanze chimiche.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2024/10045/insegnamenti/2026/10675/2024/9999?coorte=2024&schemaid=17804).*
    material_tips: |-
      **Sul programma**

      Analisi di preparati istopatologici (vetrini) con esercitazioni obbligatorie. Le esercitazioni trattano i vetrini che saranno oggetto di valutazione durante l'esame.

      Si raccomanda di partecipare alle esercitazioni organizzate dalla professoressa e di avere a disposizione il materiale di riferimento, sia su Drive che da anni precedenti, che illustri dettagliatamente l'analisi dei vetrini, al fine di garantire una comprensione approfondita. Inoltre, si consiglia di scaricare i software necessari, come QPath (per MacOs) e Aperio-ImageScope, per la visualizzazione dei vetrini caricati dalla professoressa sulla piattaforma Kiro. Si precisa che i vetrini occupano molta memoria (circa 1 gb ciascuno). L’utilizzo di tali software consente di prepararsi efficacemente all’esame, consentendo la visualizzazione dei vetrini con gli ingrandimenti tipici dei microscopi utilizzati in laboratorio e durante l’esame. Per l'osservazione al microscopio, si consiglia di evitare l'apprendimento mnemonico, privilegiando invece l'analisi critica delle strutture fisiologiche e delle lesioni elementari. Si suggerisce di procedere con la descrizione delle osservazioni partendo da ingrandimenti inferiori per poi procedere con quelli maggiori.
