    material_tips: |-
      **Sul programma**

      Il programma d'esame è quello indicato nel syllabus ufficiale.

      È importante studiare l'intero programma, prestando particolare attenzione alle prime lezioni del professor Fusar Poli, che possono sembrare meno rilevanti ma vengono frequentemente richieste.

      Tra gli argomenti da non trascurare:

      - OCD (disturbo ossessivo-compulsivo)
      - ADHD
      - Mini Mental State Examination
      - Seminari sulle psicosi
      - Criteri diagnostici DSM
      - Riconoscimento e diagnosi dei principali disturbi psichiatrici

      Le domande aperte possono riguardare sia argomenti teorici sia criteri diagnostici DSM, oppure presentare un caso clinico da interpretare.

      La fonte principale consigliata sono le sbobine 2022-2023, considerate complete e sufficienti per preparare l'esame.

      È necessario integrarle con le seguenti lezioni delle sbobine 2025-2026:

      - OCD, argomento che è stato richiesto all'esame;
      - ADHD.

      È inoltre importante consultare le slide dei docenti, perché alcune domande vero/falso sono formulate riprendendo direttamente frasi presenti nelle presentazioni.

      Non trascurare le prime lezioni del professor Fusar Poli, in particolare:

      - Mini Mental State Examination;
      - seminari sulle psicosi.

      Anche se possono sembrare argomenti introduttivi o secondari, vengono frequentemente richiesti.

      Infine, è consigliabile consultare le domande degli appelli precedenti, soprattutto per individuare i criteri DSM e gli argomenti teorici che ricorrono nelle domande aperte.
