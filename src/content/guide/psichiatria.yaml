id: g-ra9dqztt
title: Psichiatria
anno_di_corso: V Anno
moduli:
  - nome_modulo: Psichiatria
    id: m-0v8s8vwa
    exam_type: Scritto
    study_time: 20 giorni
    exam_details: |-
      L'esame è scritto, ha una durata di 30 minuti ed è composto da due tipologie di quesiti.

      Struttura della prova:

      - 2 domande aperte (10 punti complessivi)
      - 3 blocchi da 10 vero/falso (4 punti per blocco)

      Ogni blocco è associato a una domanda aperta o a un macrotema.

      Punteggio massimo: 32 punti. La lode viene assegnata con un punteggio superiore a 30.

      Domande vero/falso: i tre blocchi sono costituiti da 10 affermazioni vero/falso ciascuno. Ogni blocco vale 4 punti. Se si sbagliano 5 risposte, il blocco vale 0 punti. Il punteggio del singolo blocco non può essere negativo.

      Domande aperte: le due domande aperte valgono complessivamente 10 punti. Possono riguardare:

      - argomenti teorici;
      - criteri diagnostici DSM;
      - casi clinici, nei quali viene richiesta la diagnosi e l'indicazione dei relativi criteri DSM.

      È quindi utile esercitarsi sia nell'esposizione teorica sia nell'applicazione dei criteri diagnostici a un caso clinico.

      Valutazione: il punteggio massimo è di 32 punti. La lode viene assegnata quando si supera 30. In alcuni appelli, quando la media generale dell'esame è particolarmente bassa, può essere applicata una sorta di correzione gaussiana, che può comportare un incremento di uno o due voti. Non sembra esserci un criterio fisso e predeterminato per stabilire quando venga applicata.

      All'esame è sempre presente il professor Damiani.
    program: |-
      Il programma d'esame è quello indicato nel syllabus ufficiale.

      È importante studiare l'intero programma, prestando particolare attenzione alle prime lezioni del professor Fusar Poli, che possono sembrare meno rilevanti ma vengono frequentemente richieste.

      Tra gli argomenti da non trascurare:

      - OCD (disturbo ossessivo-compulsivo)
      - ADHD
      - Mini Mental State Examination
      - Seminari sulle psicosi
      - Criteri diagnostici DSM
      - Riconoscimento e diagnosi dei principali disturbi psichiatrici

      Le domande aperte possono riguardare sia argomenti teorici sia criteri diagnostici DSM, oppure presentare un caso clinico da interpretare.
    material_tips: |-
      La fonte principale consigliata sono le sbobine 2022-2023, considerate complete e sufficienti per preparare l'esame.

      È necessario integrarle con le seguenti lezioni delle sbobine 2025-2026:

      - OCD, argomento che è stato richiesto all'esame;
      - ADHD.

      È inoltre importante consultare le slide dei docenti, perché alcune domande vero/falso sono formulate riprendendo direttamente frasi presenti nelle presentazioni.

      Non trascurare le prime lezioni del professor Fusar Poli, in particolare:

      - Mini Mental State Examination;
      - seminari sulle psicosi.

      Anche se possono sembrare argomenti introduttivi o secondari, vengono frequentemente richiesti.

      Infine, è consigliabile consultare le domande degli appelli precedenti, soprattutto per individuare i criteri DSM e gli argomenti teorici che ricorrono nelle domande aperte.
    professors:
      - nome: Fusar Poli
      - nome: Damiani
      - nome: Stefanelli
    fascia_studio: 3–4 sett
info_da_verificare:
  - campo: Frequenza
    nota: Non sembra essere controllata in maniera particolarmente rigorosa; i docenti non sono particolarmente pignoli nella rilevazione delle presenze.
  - campo: Criterio per la correzione gaussiana
    nota: Non sembra esserci un criterio fisso e predeterminato per stabilire quando venga applicata.
  - campo: Elenco completo delle domande ricorrenti
    nota: Non è disponibile un elenco completo; dalla testimonianza emergono alcuni punti da preparare con particolare attenzione.
aggiornato_da: Rocco Buellis
