moduli:
  - nome_modulo: Psichiatria
    id: m-0v8s8vwa
    exam_type: Scritto
    study_time: circa 20 giorni
    exam_details: |-
      L'esame è scritto, dura 30 minuti ed è composto da due tipologie di quesiti:

      - 2 domande aperte, per un totale di 10 punti;
      - 3 blocchi da 10 domande vero/falso, ciascuno del valore di 4 punti.

      Il punteggio massimo è quindi di 32 punti.

      **Domande aperte**:
      Le due domande aperte valgono complessivamente 10 punti. Possono riguardare:

      - argomenti teorici;
      - criteri diagnostici DSM;
      - casi clinici, nei quali viene richiesta la diagnosi e l'indicazione dei relativi criteri DSM.

      È quindi utile esercitarsi sia nell'esposizione teorica sia nell'applicazione dei criteri diagnostici a un caso clinico.

      **Domande vero/falso**:
      Sono presenti 3 blocchi da 10 affermazioni vero/falso, ciascuno del valore di 4 punti. Ogni blocco è associato a una domanda aperta o a un macrotema. Se si sbagliano 5 risposte, il blocco vale 0 punti. Il punteggio del singolo blocco non può comunque diventare negativo.

      **Valutazione**:
      Il punteggio massimo è di 32 punti e la lode viene assegnata con un punteggio superiore a 30. In alcuni appelli, qualora la media generale dell'esame sia particolarmente bassa, può essere applicata una sorta di correzione gaussiana, con un possibile incremento di uno o due voti. Non c'è un criterio fisso e predeterminato per stabilire quando venga applicata.
    program: |-
      1. Storia della psichiatria
      2. Psicopatologia
      3. Terapie psichiatriche
      4. Disturbi psichiatrici organici
      5. Schizofrenia e disturbi psicotici
      6. Disturbi da abuso di sostanze
      7. Disturbi affettivi e d'ansia
      8. Disturbi dello spettro autistico
      9. Etnopsichiatria e disturbi dell'alimentazione
      10. Disturbi di personalità, del sonno e sessuali
      11. Casi clinici

      - Disturbi dello neurosviluppo in età adulta
      - Disturbi di natura organica e loro gestione
      - Disturbi della condotta alimentare (anoressia, bulimia, disturbo da alimentazione incontrollata, obesità)
      - Disturbi del sonno
      - Disturbi sessuali
      - Disturbi di personalità

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11109/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      È consigliabile studiare l'intero programma, prestando particolare attenzione anche alle prime lezioni del Prof. Fusar Poli, che possono sembrare meno rilevanti ma vengono frequentemente richieste.

      Tra gli argomenti da non trascurare:

      - OCD (disturbo ossessivo-compulsivo);
      - ADHD;
      - Mini Mental State Examination;
      - seminari sulle psicosi;
      - criteri diagnostici DSM;
      - riconoscimento e diagnosi dei principali disturbi psichiatrici.

      Le domande aperte possono riguardare sia argomenti teorici sia criteri diagnostici DSM. Possono inoltre essere presentati casi clinici nei quali viene richiesta l'interpretazione del quadro e la relativa diagnosi.

      La fonte principale consigliata sono le sbobine 2022/2023, complete e sufficienti per la preparazione dell'esame.

      Devono essere integrate con alcune lezioni delle sbobine 2025/2026, in particolare:

      - OCD, trattato dal Dott. Stefanelli;
      - ADHD.

      È inoltre importante consultare le slide dei docenti, perché alcune domande vero/falso possono riprendere direttamente affermazioni presenti nelle presentazioni.

      Anche se possono sembrare argomenti introduttivi o secondari, vengono frequentemente richiesti.

      Infine, è consigliabile consultare le domande degli appelli precedenti, soprattutto per individuare i criteri DSM e gli argomenti teorici che ricorrono maggiormente nelle domande aperte.
    body: |-
      **Domande e argomenti ricorrenti**

      - OCD: da integrare dalle sbobine 2025/2026; è stato richiesto all'esame.
      - ADHD: da integrare dalle sbobine 2025/2026.
      - Mini Mental State Examination: argomento delle prime lezioni di Fusar Poli, frequentemente richiesto.
      - Seminari sulle psicosi: da studiare anche se possono sembrare meno centrali.
      - Criteri DSM: possono comparire nelle domande aperte e nei casi clinici.
      - Casi clinici: possibile richiesta di formulare la diagnosi e indicare i criteri DSM corrispondenti.
      - Slide: alcune affermazioni vero/falso possono essere riprese direttamente dalle presentazioni.

      La frequenza non è controllata in modo rigoroso e i docenti non sono particolarmente pignoli nella rilevazione delle presenze.
