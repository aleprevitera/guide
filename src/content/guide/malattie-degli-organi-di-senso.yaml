  - nome_modulo: Otorinolaringoiatria e Audiologia
    id: m-lcq5czjs
    exam_type: Orale
    study_time: 3–4 settimane
    exam_details: L'esame è orale e si svolge in ordine alfabetico. Spesso la prima domanda riguarda il reparto in cui si sta svolgendo l'internato. È frequente una struttura con una domanda di ORL e una domanda di Audiologia/Vestibologia.
    program: |-
      **Patologia e clinica delle malattie del volto in ambito Oro-Maxillo-Facciale, Odontoiatriaco, Otorinolaringoiatrico, Audiologico e Oculistico.**

      **Otorinolaringoiatria:**

      **Naso**

      - Anatomofisiologia naso-sinusale
      - Epistassi
      - Rinosinusiti
      - Complicanze delle rinosinusiti
      - Fibroangioma giovanile
      - Patologia benigna e maligna nasosinusale

      **Cavo orale**

      - Anatomofisiologia del cavo orale
      - Patologia infiammatoria del cavo orale

      **Orofaringe**

      - Anatomofisiologia dell'orofaringe
      - Tonsilliti
      - Complicanze delle tonsilliti
      - Vegetazioni adenoidi
      - Sindrome delle apnee ostruttive notturne

      **Ipofaringe/laringe**

      - Anatomofisiologia ipofaringolaringea
      - Patologia benigna
      - Patologia neurologica faringolaringea

      **Ghiandole salivari**

      - Anatomofisiologia delle ghiandole salivari
      - Sialoadeniti
      - Patologia neoformativa delle ghiandole salivari

      **Collo**

      - Anatomofisiologia del collo
      - Tumefazioni laterocervicali
      - Tracheotomia

      **Inquadramento delle neoplasie cervico-facciali**

      **Otologia e audiologia:**

      - Anatomofisiologia dell'apparato uditivo e dell'apparato vestibolare
      - Semeiotica audiologica (otoscopia ed otomicroscopia); acufenologia
      - Concetto di ipoacusia e classificazione
      - Semeiotica audiologica strumentale: audiometria tonale, audiometria vocale, impedenzometria, audiometria a risposte elettriche ed otoemissioni
      - Patologia dell'orecchio esterno
      - Patologia dell'orecchio medio: otiti acute, otiti croniche (semplici, iperplastiche, colesteatomatose) e loro complicanze
      - La timpanosclerosi e le otiti fibroadesive.
      - Tasche di retrazione ed atelettasia dell'orecchio medio.
      - L'otosclerosi
      - I tumori glomici dell'osso temporale
      - Sordità improvvisa
      - Presbiacusia; ipoacusia da rumore ed ipoacusia da ototossici
      - Cenni sulle sordità centrali
      - Terapia protesica: protesi tradizionale, protesi impiantabili
      - Semeiotica vestibologica ed otoneurologica
      - Vertigine parossistica posizionale da labirintolitiasi
      - Fistole perilinfatiche e deiscenze della capsula otica
      - Malattia di Menière
      - Neurite Vestibolare
      - Neurinoma dell'acustico
      - Paralisi del nervo facciale

      **Audiologia:**

      - Anatomofisiologia dell'apparato uditivo e dell'apparato vestibolare
      - Semeiotica audiologica (otoscopia ed otomicroscopia); acufenologia
      - Concetto di ipoacusia e classificazione
      - Semeiotica audiologica strumentale: audiometria tonale, audiometria vocale, impedenzometria, audiometria a risposte elettriche ed otoemissioni
      - Patologia dell'orecchio esterno
      - Patologia dell'orecchio medio: otiti acute, otiti croniche (semplici, iperplastiche, colesteatomatose) e loro complicanze
      - La timpanosclerosi e le otiti fibroadesive.
      - Tasche di retrazione ed atelettasia dell'orecchio medio.
      - L'otosclerosi
      - I tumori glomici dell'osso temporale
      - Sordità improvvisa
      - Presbiacusia; ipoacusia da rumore ed ipoacusia da ototossici
      - Cenni sulle sordità centrali
      - Terapia protesica: protesi tradizionale, protesi impiantabili
      - Semeiotica vestibologica ed otoneurologica

      - Vertigine parossistica posizionale da labirintolitiasi
      - Fistole perilinfatiche e deiscenze della capsula otica
      - Malattia di Menière
      - Neurite Vestibolare
      - Neurinoma dell'acustico
      - Paralisi del nervo facciale

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11739/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Per ORL è necessario coprire il programma previsto dal syllabus, verificando che tutti gli argomenti siano effettivamente presenti nelle sbobine dell'anno corrente. Per Audiologia, oltre agli argomenti delle sbobine, è particolarmente importante la vestibologia.

      **ORL**

      - Sbobine dell'anno corrente, generalmente sufficienti.
      - Syllabus, da confrontare con le sbobine per verificare che non manchino argomenti.
      - De Campora o sbobine degli anni precedenti per integrare gli argomenti presenti nel programma ma non trattati nell'anno corrente (es. tumori del cavo orale e dell'orofaringe).

      **Audiologia**

      - Le sbobine sono generalmente sufficienti per la parte di audiologia.
      - Per la vestibologia è necessario integrare dal De Campora, in particolare: anatomia (come ripasso), patologie periferiche e miste, tumori dell'angolo ponto-cerebellare.

      Le domande degli appelli precedenti sono utili sia per ORL sia per Audiologia.
    body: |-
      **Domande e argomenti ricorrenti**

      - ORL: Argomenti del programma; possibile domanda iniziale sul reparto di internato; tumori del cavo orale e dell'orofaringe
      - Audiologia / Vestibologia: Patologie periferiche e miste; tumori dell'angolo ponto-cerebellare
