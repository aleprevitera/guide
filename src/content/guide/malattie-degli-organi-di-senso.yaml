    material_tips: |-
      **Sul programma**

      ORL: programma previsto dal syllabus, verificando che tutti gli argomenti siano effettivamente presenti nelle sbobine dell’anno corrente. Audiologia: oltre agli argomenti delle sbobine, è particolarmente importante la vestibologia.

      ORL:

      - Sbobine dell’anno corrente, generalmente sufficienti.
      - Controllare il syllabus per verificare che non manchino argomenti.
      - Integrare dal De Campora o dalle sbobine degli anni precedenti gli argomenti presenti nel programma ma non trattati nell’anno corrente (es. tumori del cavo orale e dell’orofaringe).

      Audiologia:

      - Le sbobine sono generalmente sufficienti per la parte di audiologia.
      - La vestibologia richiede integrazione dal De Campora, in particolare per: anatomia, come ripasso; patologie periferiche e miste; tumori dell’angolo ponto-cerebellare.

      Le domande degli appelli precedenti sono utili anche per ORL e Audiologia. In ORL, controllare il syllabus oltre alle sbobine per evitare di lasciare scoperti argomenti non affrontati a lezione. Per Audiologia, dedicare particolare attenzione alla vestibologia.
    body: A lezione viene preso il codice di frequenza, ma questo non viene controllato in sede d’esame.
    professors:
      - nome: Benazzo
        stile: descritto come il più impegnativo
      - nome: Pagella
      - nome: Canzi
      - nome: Carlotto
        stile: descritta come tranquilla, propensa a lasciare parlare lo studente e generalmente larga nella valutazione
    fascia_studio: 3–4 sett
  - nome_modulo: Odontoiatria
    id: m-j91rrxoo
    exam_type: Scritto
    study_time: 3–4 giorni
    exam_details: A partire dall’anno di riferimento, l’esame è diventato scritto. Le domande a scelta multipla sono quindi nuove rispetto agli anni precedenti. L’esame viene svolto tramite Kiro Testing. La valutazione segue la stessa logica di Maxillo, con un punto bonus.
    program: |-
      Patologia e clinica delle malattie del volto in ambito Oro-Maxillo-Facciale, Odontoiatriaco, Otorinolaringoiatrico, Audiologico e Oculistico.

      Cenni di anatomia, embriologia e istologia dei tessuti dentari. Eruzione e permuta dei denti: classi dentali e scheletriche, malocclusioni. La carie dentaria: prevenzione e complicanze; l’igiene orale Le pulpiti, acute e croniche. Patologia apicale acuta e cronica. Traumi dentari. Radiologia odontoiatrica. Le malattie del parodonto. Correlazione fra malattia parodontale e malattie sistemiche. La necrosi mascellare da bifosfonati. Patologie delle mucose orali e precancerosi.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11739/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Il programma comprende le lezioni previste dal corso. Nell’anno di riferimento sono state svolte soltanto 3 delle 4 lezioni previste, rendendo necessario integrare autonomamente la quarta. Argomenti da integrare: glossopatie; lesioni pigmentate della mucosa orale; iperplasie e lesioni reattivo-traumatiche della mucosa orale; malformazioni vascolari benigne del cavo orale; stomatiti; pemfigo della mucosa orale; pseudolesioni della mucosa orale; sindrome della bocca che brucia.

      - Sbobine dell’anno corrente, generalmente sufficienti.
      - Integrare la quarta lezione non svolta nell’anno di riferimento tramite il libro/PDF fornito.
      - Recuperare necessariamente la quarta lezione non svolta nell’anno di riferimento.
    body: Le presenze non vengono controllate.
    fascia_studio: < 1 sett
  - nome_modulo: Chirurgia maxillo-facciale
    id: m-qya7ev2i
    exam_type: Scritto
    study_time: 2–3 giorni
    exam_details: "Esame scritto con 30 domande a scelta multipla, tenuto dal professor Sfondrini. La valutazione segue questa modalità: 30/30 → 30 e lode; 29/30 → 30; e così via. È quindi presente un punto bonus rispetto alla conversione diretta del numero di risposte corrette."
    program: |-
      Patologia e clinica delle malattie del volto in ambito Oro-Maxillo-Facciale, Odontoiatriaco, Otorinolaringoiatrico, Audiologico e Oculistico.

      *Il programma ufficiale non ha una parte dedicata a questo modulo: vedi la scheda completa.*

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11739/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      - Sbobine dell’anno corrente, ritenute sufficienti.
      - Le domande degli appelli precedenti sono fondamentali perché, secondo la testimonianza, alcune domande tendono a ripetersi.
      - Dare grande importanza alle domande precedenti.
    body: Le presenze non vengono controllate.
    professors:
      - nome: Sfondrini
    fascia_studio: < 1 sett
