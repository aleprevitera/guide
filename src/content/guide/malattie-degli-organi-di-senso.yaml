  - nome_modulo: Odontoiatria
    id: m-j91rrxoo
    exam_type: Scritto
    study_time: 3–4 giorni
    exam_details: A partire dall'anno di riferimento, l'esame è diventato scritto. Le domande a scelta multipla sono quindi nuove rispetto agli anni precedenti. L'esame viene svolto tramite Kiro Testing e la valutazione segue la stessa logica di Maxillo, con un punto bonus.
    program: |-
      Patologia e clinica delle malattie del volto in ambito Oro-Maxillo-Facciale, Odontoiatriaco, Otorinolaringoiatrico, Audiologico e Oculistico.

      Cenni di anatomia, embriologia e istologia dei tessuti dentari. Eruzione e permuta dei denti: classi dentali e scheletriche, malocclusioni. La carie dentaria: prevenzione e complicanze; l’igiene orale Le pulpiti, acute e croniche. Patologia apicale acuta e cronica. Traumi dentari. Radiologia odontoiatrica. Le malattie del parodonto. Correlazione fra malattia parodontale e malattie sistemiche. La necrosi mascellare da bifosfonati. Patologie delle mucose orali e precancerosi.

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11739/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Il programma comprende le lezioni previste dal corso. Nell'anno di riferimento sono state svolte soltanto 3 delle 4 lezioni previste, rendendo necessario integrare autonomamente la quarta. Gli argomenti da integrare comprendono: glossopatie, lesioni pigmentate della mucosa orale, iperplasie e lesioni reattivo-traumatiche della mucosa orale, malformazioni vascolari benigne del cavo orale, stomatiti, pemfigo della mucosa orale, pseudolesioni della mucosa orale, sindrome della bocca che brucia.

      - Sbobine dell'anno corrente, generalmente sufficienti.
      - Per la quarta lezione non svolta nell'anno di riferimento, utilizzare il libro/PDF fornito per integrare: glossopatie, lesioni pigmentate della mucosa orale, iperplasie e lesioni reattivo-traumatiche della mucosa orale, malformazioni vascolari benigne, stomatiti, pemfigo della mucosa orale, pseudolesioni, sindrome della bocca che brucia.
    body: |-
      **Domande e argomenti ricorrenti**

      - Domande nuove rispetto agli anni precedenti; argomenti delle lezioni dell'anno corrente e della quarta lezione da integrare
    fascia_studio: < 1 sett
  - nome_modulo: Chirurgia maxillo-facciale
    id: m-qya7ev2i
    exam_type: Scritto
    study_time: 2–3 giorni
    exam_details: "L'esame è scritto, con 30 domande a scelta multipla, ed è tenuto dal professor Sfondrini. La valutazione segue questa modalità: 30/30 → 30 e lode; 29/30 → 30; e così via. È quindi presente un punto bonus rispetto alla conversione diretta del numero di risposte corrette."
    program: |-
      Patologia e clinica delle malattie del volto in ambito Oro-Maxillo-Facciale, Odontoiatriaco, Otorinolaringoiatrico, Audiologico e Oculistico.

      *Il programma ufficiale non ha una parte dedicata a questo modulo: vedi la scheda completa.*

