descrizione_generale: "L'esame è composto da quattro moduli: Oftalmologia, Otorinolaringoiatria e Audiologia, Odontoiatria, Chirurgia maxillo-facciale. I quattro moduli presentano modalità d'esame e tempi di preparazione piuttosto differenti. **Frequenza**: non è controllata in modo rigoroso nei vari moduli."
moduli:
  - nome_modulo: Oftalmologia
    id: m-ze2xjad6
    exam_type: Orale
    study_time: 1–2 settimane
    exam_details: "L'esame è orale e gli studenti vengono chiamati in ordine alfabetico. Interrogano Bianchi e Milano. Generalmente vengono poste due domande: una prima domanda su un argomento più ampio; una seconda domanda su un argomento più circoscritto, ad esempio un vizio di rifrazione, ectropion, entropion, ecc. Le bocciature sono comunque rare."
    program: |-
      Patologia e clinica delle malattie del volto in ambito Oro-Maxillo-Facciale, Odontoiatriaco, Otorinolaringoiatrico, Audiologico e Oculistico.

      **Cenni di anatomia dell’apparato oculare**

      **Patologia di: palpebre – annessi e vie lacrimali:**

      - anatomia e fisiologia
      - patologia infiammatoria (eziopatogenesi, clinica, terapia)
      - patologia della statica e della dinamica
      - patologia neoplastica
      - dacriocistiti (eziopatogenesi, clinica, terapia)

      **Vizi di refrazione:**

      - miopia, ipermetropia, astigmatismo, presbiopia

      **Strabismo:**

      - fisiopatologia della motilità oculare e della visione binoculare
      - strabismo concomitante
      - strabismo paralitico

      **Cataratta congenita:**

      - eziopatogenesi, clinica, terapia

      **Glaucoma congenito:**

      **Retinoblastoma – ROP:**

      Clinica e terapia

      **Congiuntiva:**

      anatomia e fisiologia

      - patologia film lacrimale

      **Cornea:**

      - patologia traumatica
      - patologia degenerativa (cheratocono, ecc.)

      **Cristallino:**

      - cataratta acquisita (clinica e terapia)

      **Glaucoma acquisito:**

      - Fisiopatologia dell’idrodinamica oculare

      **Uvea:**

      **Retina:**

      - esami funzionali
      - distacco di retina

      patologia vascolare

      - patologie associate a malattie sistemiche
      - patologie degenerativ

      **Nervo ottico:**

      - neuriti ottiche retrobulbari (eziopatogenesi, clinica, terapia)
      - edemi della papilla (eziopatogenesi, clinica, terapia)

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11739/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Il programma comprende gli argomenti trattati durante il corso. È particolarmente utile confrontarlo con le domande degli appelli precedenti, che permettono di individuare gli argomenti eventualmente trattati solo superficialmente o non affrontati durante il proprio anno. Tra gli argomenti che possono richiedere integrazione: ectropion, entropion, blefarospasmo, lagoftalmo, calazio.

      - Sbobine dell'anno corrente come fonte principale.
      - Domande degli appelli precedenti, fondamentali per individuare gli argomenti trattati meno durante il proprio anno.
      - Sbobine degli anni precedenti per integrare gli argomenti mancanti o trattati superficialmente.
      - Per alcuni argomenti minori, come ectropion, entropion, blefarospasmo, lagoftalmo e calazio, può essere sufficiente una ricerca mirata su fonti online.
    body: |-
      **Domande e argomenti ricorrenti**

      - Vizi di rifrazione; ectropion; entropion; altri argomenti individuabili dalle domande degli appelli precedenti
