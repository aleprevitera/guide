    material_tips: |-
      **Sul programma**

      Il programma corrisponde agli argomenti trattati durante le lezioni del corso.

      - Sbobine dell'anno corrente, ritenute sufficienti.
      - Domande degli appelli precedenti, particolarmente importanti perché, secondo la testimonianza, alcune domande tendono a ripetersi.
