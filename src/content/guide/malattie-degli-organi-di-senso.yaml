id: g-g65v8vsv
title: Malattie degli Organi di senso
anno_di_corso: V Anno
descrizione_generale: "L’esame è composto da quattro moduli: Oftalmologia, Otorinolaringoiatria e Audiologia, Odontoiatria, Chirurgia maxillo-facciale. I moduli hanno modalità d’esame e tempi di preparazione differenti. Il voto finale non è specificato nella scheda."
moduli:
  - nome_modulo: Oftalmologia
    id: m-ze2xjad6
    exam_type: Orale
    study_time: 1–2 settimane
    exam_details: "Esame orale. Interrogano Bianchi e Milano. Gli studenti vengono chiamati in ordine alfabetico. Generalmente vengono poste due domande: una prima su un argomento più ampio; una seconda su un argomento più circoscritto, ad esempio un vizio di rifrazione, ectropion, entropion ecc. Le bocciature sono comunque rare."
    program: "Argomenti trattati durante il corso. Tra gli argomenti che possono richiedere integrazione: ectropion; entropion; blefarospasmo; lagoftalmo; calazio."
    material_tips: |-
      - Sbobine dell’anno corrente come fonte principale.
      - Domande degli appelli precedenti, fondamentali per capire quali argomenti siano stati trattati meno nel proprio anno.
      - Per gli argomenti mancanti o trattati superficialmente, integrare dalle sbobine degli anni precedenti.
      - Per alcuni argomenti minori, come ectropion, entropion, blefarospasmo, lagoftalmo e calazio, può essere sufficiente una ricerca mirata su fonti online.
      - Guardare sempre le domande degli appelli precedenti e utilizzarle per individuare gli argomenti da integrare.
    body: Milano a lezione comunica di prestare attenzione alle presenze, ma le presenze non vengono poi controllate durante l’esame.
    professors:
      - nome: Bianchi
        stile: generalmente tranquillo
      - nome: Milano
        stile: un po’ più puntiglioso
    fascia_studio: 1–2 sett
  - nome_modulo: Otorinolaringoiatria e Audiologia
    id: m-lcq5czjs
    esse3_appello: OTORINO
    exam_type: Orale
    study_time: 3–4 settimane
    exam_details: Esame orale e si svolge in ordine alfabetico. I docenti sono Benazzo, Pagella, Canzi e Carlotto. Spesso la prima domanda riguarda il reparto in cui si sta svolgendo l’internato. È frequente una struttura con una domanda di ORL e una domanda di Audiologia/Vestibologia.
    program: "ORL: programma previsto dal syllabus, verificando che tutti gli argomenti siano effettivamente presenti nelle sbobine dell’anno corrente. Audiologia: oltre agli argomenti delle sbobine, è particolarmente importante la vestibologia."
    material_tips: |-
      ORL:

      - Sbobine dell’anno corrente, generalmente sufficienti.
      - Controllare il syllabus per verificare che non manchino argomenti.
      - Integrare dal De Campora o dalle sbobine degli anni precedenti gli argomenti presenti nel programma ma non trattati nell’anno corrente (es. tumori del cavo orale e dell’orofaringe).

      Audiologia:

      - Le sbobine sono generalmente sufficienti per la parte di audiologia.
      - La vestibologia richiede integrazione dal De Campora, in particolare per: anatomia, come ripasso; patologie periferiche e miste; tumori dell’angolo ponto-cerebellare.

      Le domande degli appelli precedenti sono utili anche per ORL e Audiologia. In ORL, controllare il syllabus oltre alle sbobine per evitare di lasciare scoperti argomenti non affrontati a lezione. Per Audiologia, dedicare particolare attenzione alla vestibologia.
    body: A lezione viene preso il codice di frequenza, ma questo non viene controllato in sede d’esame.
    professors:
      - nome: Benazzo
        stile: descritto come il più impegnativo
      - nome: Pagella
      - nome: Canzi
      - nome: Carlotto
        stile: descritta come tranquilla, propensa a lasciare parlare lo studente e generalmente larga nella valutazione
    fascia_studio: 3–4 sett
  - nome_modulo: Odontoiatria
    id: m-j91rrxoo
    exam_type: Scritto
    study_time: 3–4 giorni
    exam_details: A partire dall’anno di riferimento, l’esame è diventato scritto. Le domande a scelta multipla sono quindi nuove rispetto agli anni precedenti. L’esame viene svolto tramite Kiro Testing. La valutazione segue la stessa logica di Maxillo, con un punto bonus.
    program: "Il programma comprende le lezioni previste dal corso. Nell’anno di riferimento sono state svolte soltanto 3 delle 4 lezioni previste, rendendo necessario integrare autonomamente la quarta. Argomenti da integrare: glossopatie; lesioni pigmentate della mucosa orale; iperplasie e lesioni reattivo-traumatiche della mucosa orale; malformazioni vascolari benigne del cavo orale; stomatiti; pemfigo della mucosa orale; pseudolesioni della mucosa orale; sindrome della bocca che brucia."
    material_tips: |-
      - Sbobine dell’anno corrente, generalmente sufficienti.
      - Integrare la quarta lezione non svolta nell’anno di riferimento tramite il libro/PDF fornito.
      - Recuperare necessariamente la quarta lezione non svolta nell’anno di riferimento.
    body: Le presenze non vengono controllate.
    fascia_studio: < 1 sett
  - nome_modulo: Chirurgia maxillo-facciale
    id: m-qya7ev2i
    exam_type: Scritto
    study_time: 2–3 giorni
    exam_details: "Esame scritto con 30 domande a scelta multipla, tenuto dal professor Sfondrini. La valutazione segue questa modalità: 30/30 → 30 e lode; 29/30 → 30; e così via. È quindi presente un punto bonus rispetto alla conversione diretta del numero di risposte corrette."
    program: Il programma è quello delle lezioni del corso.
    material_tips: |-
      - Sbobine dell’anno corrente, ritenute sufficienti.
      - Le domande degli appelli precedenti sono fondamentali perché, secondo la testimonianza, alcune domande tendono a ripetersi.
      - Dare grande importanza alle domande precedenti.
    body: Le presenze non vengono controllate.
    professors:
      - nome: Sfondrini
    fascia_studio: < 1 sett
info_da_verificare:
  - campo: Frequenza
    nota: La scheda afferma che la frequenza non sembra essere controllata in maniera rigorosa nei vari moduli; verificare eventuali obblighi di frequenza.
aggiornato_da: Rocco Buellis
