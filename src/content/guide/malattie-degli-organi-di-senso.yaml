id: g-g65v8vsv
title: Malattie degli Organi di senso
anno_di_corso: V Anno
descrizione_generale: "L’esame è composto da quattro moduli: Oftalmologia, Otorinolaringoiatria e Audiologia, Odontoiatria, Chirurgia maxillo-facciale. I moduli hanno modalità d’esame e tempi di preparazione differenti. Il voto finale non è specificato nella scheda."
moduli:
  - nome_modulo: Oftalmologia
    id: m-ze2xjad6
    exam_type: Orale
    study_time: 1–2 settimane
    exam_details: "Esame orale. Interrogano Bianchi e Milano. Gli studenti vengono chiamati in ordine alfabetico. Generalmente vengono poste due domande: una prima su un argomento più ampio; una seconda su un argomento più circoscritto, ad esempio un vizio di rifrazione, ectropion, entropion ecc. Le bocciature sono comunque rare."
    program: |-
      Patologia e clinica delle malattie del volto in ambito Oro-Maxillo-Facciale, Odontoiatriaco, Otorinolaringoiatrico, Audiologico e Oculistico.

      **· CENNI DI ANATOMIA DELL’APPARATO OCULARE**

      **PATOLOGIA DI: PALPEBRE – ANNESSI E VIE LACRIMALI:**

      o anatomia e fisiologia

      o patologia infiammatoria (eziopatogenesi, clinica, terapia)

      o patologia della statica e della dinamica

      o patologia neoplastica

      o dacriocistiti (eziopatogenesi, clinica, terapia)

      **· VIZI DI REFRAZIONE:**

      o miopia, ipermetropia, astigmatismo, presbiopia

      **· STRABISMO:**

      o fisiopatologia della motilità oculare e della visione binoculare

      o strabismo concomitante

      o strabismo paralitico

      **· CATARATTA CONGENITA:**

      o eziopatogenesi, clinica, terapia

      **GLAUCOMA CONGENITO:**

      **· RETINOBLASTOMA – ROP:**

      Clinica e terapia

      **· CONGIUNTIVA:**

      anatomia e fisiologia

      o patologia film lacrimale

      **· CORNEA:**

      o patologia traumatica

      o patologia degenerativa (cheratocono, ecc.)

      **· CRISTALLINO:**

      o cataratta acquisita (clinica e terapia)

      **· GLAUCOMA ACQUISITO:**

      o Fisiopatologia dell’idrodinamica oculare

      **· UVEA:**

      **· RETINA:**

      o esami funzionali

      o distacco di retina

      patologia vascolare

      o patologie associate a malattie sistemiche

      o patologie degenerativ

      **NERVO OTTICO:**

      o neuriti ottiche retrobulbari (eziopatogenesi, clinica, terapia)

      o edemi della papilla (eziopatogenesi, clinica, terapia)

      *Programma ufficiale dal catalogo dei corsi UniPV: [scheda dell'insegnamento](https://unipv.coursecatalogue.cineca.it/corsi/2022/10045/insegnamenti/2026/11739/2017/9999?coorte=2022&schemaid=17810).*
    material_tips: |-
      **Sul programma**

      Argomenti trattati durante il corso. Tra gli argomenti che possono richiedere integrazione: ectropion; entropion; blefarospasmo; lagoftalmo; calazio.

      - Sbobine dell’anno corrente come fonte principale.
      - Domande degli appelli precedenti, fondamentali per capire quali argomenti siano stati trattati meno nel proprio anno.
      - Per gli argomenti mancanti o trattati superficialmente, integrare dalle sbobine degli anni precedenti.
      - Per alcuni argomenti minori, come ectropion, entropion, blefarospasmo, lagoftalmo e calazio, può essere sufficiente una ricerca mirata su fonti online.
      - Guardare sempre le domande degli appelli precedenti e utilizzarle per individuare gli argomenti da integrare.
    body: Milano a lezione comunica di prestare attenzione alle presenze, ma le presenze non vengono poi controllate durante l’esame.
    professors:
      - nome: Bianchi
        stile: generalmente tranquillo
      - nome: Milano
        stile: un po’ più puntiglioso
    fascia_studio: 1–2 sett
  - nome_modulo: Otorinolaringoiatria e Audiologia
    id: m-lcq5czjs
    esse3_appello: OTORINO
    exam_type: Orale
    study_time: 3–4 settimane
    exam_details: Esame orale e si svolge in ordine alfabetico. I docenti sono Benazzo, Pagella, Canzi e Carlotto. Spesso la prima domanda riguarda il reparto in cui si sta svolgendo l’internato. È frequente una struttura con una domanda di ORL e una domanda di Audiologia/Vestibologia.
    program: |-
      Patologia e clinica delle malattie del volto in ambito Oro-Maxillo-Facciale, Odontoiatriaco, Otorinolaringoiatrico, Audiologico e Oculistico.

      **OTORINOLARINGOIATRIA:**

      - NASO
      - Anatomofisiologia naso-sinusale
      - Epistassi
      - Rinosinusiti
      - Complicanze delle rinosinusiti
      - Fibroangioma giovanile
      - Patologia benigna e maligna nasosinusale
      - CAVO ORALE
      - Anatomofisiologia del cavo orale
      - Patologia infiammatoria del cavo orale
      - OROFARINGE
      - Anatomofisiologia dell'orofaringe
      - Tonsilliti
      - Complicanze delle tonsilliti
      - Vegetazioni adenoidi
      - Sindrome delle apnee ostruttive notturne
      - IPOFARINGE/LARINGE
      - Anatomofisiologia ipofaringolaringea
      - Patologia benigna
      - Patologia neurologica faringolaringea
      - GHIANDOLE SALIVARI
      - Anatomofisiologia delle ghiandole salivari
      - Sialoadeniti
      - Patologia neoformativa delle ghiandole salivari
      - COLLO
      - Anatomofisiologia del collo
      - Tumefazioni laterocervicali
      - Tracheotomia
      - INQUADRAMENTO DELLE NEOPLASIE CERVICO-FACCIALI

      **OTOLOGIA E AUDIOLOGIA:**

      - Anatomofisiologia dell'apparato uditivo e dell'apparato vestibolare
      - Semeiotica audiologica (otoscopia ed otomicroscopia); acufenologia
      - Concetto di ipoacusia e classificazione
      - Semeiotica audiologica strumentale: audiometria tonale, audiometria vocale, impedenzometria,audiometria a

      risposte elettriche ed otoemissioni

      - Patologia dell'orecchio esterno
      - Patologia dell'orecchio medio: otiti acute, otiti croniche (semplici, iperplastiche, colesteatomatose) e loro

      complicanze

      - La timpanosclerosi e le otiti fibroadesive.
      - Tasche di retrazione ed atelettasia dell'orecchio medio.
      - L'otosclerosi
      - I tumori glomici dell'osso temporale
      - Sordità improvvisa
      - Presbiacusia; ipoacusia da rumore ed ipoacusia da ototossici
      - Cenni sulle sordità centrali
      - Terapia protesica: protesi tradizionale, protesi impiantabili
      - Semeiotica vestibologica ed otoneurologica
      - Vertigine parossistica posizionale da labirintolitiasi
      - Fistole perilinfatiche e deiscenze della capsula otica
      - Malattia di Menière
      - Neurite Vestibolare
      - Neurinoma dell'acustico
      - Paralisi del nervo facciale

      Anatomofisiologia dell'apparato uditivo e dell'apparato vestibolare Semeiotica audiologica (otoscopia ed otomicroscopia); acufenologia Concetto di ipoacusia e classificazione Semeiotica audiologica strumentale: audiometria tonale, audiometria vocale, impedenzometria,audiometria a risposte elettriche ed otoemissioni Patologia dell'orecchio esterno Patologia dell'orecchio medio: otiti acute, otiti croniche (semplici, iperplastiche, colesteatomatose) e loro complicanze La timpanosclerosi e le otiti fibroadesive. Tasche di retrazione ed atelettasia dell'orecchio medio. L'otosclerosi I tumori glomici dell'osso temporale Sordità improvvisa Presbiacusia; ipoacusia da rumore ed ipoacusia da ototossici Cenni sulle sordità centrali Terapia protesica: protesi tradizionale, protesi impiantabili Semeiotica vestibologica ed otoneurologica Vertigine parossistica posizionale da labirintolitiasi Fistole perilinfatiche e deiscenze della capsula otica Malattia di Menière Neurite Vestibolare Neurinoma dell'acustico Paralisi del nervo facciale

      **AUDIOLOGIA:**

      Anatomofisiologia dell'apparato uditivo e dell'apparato vestibolare

      Semeiotica audiologica (otoscopia ed otomicroscopia); acufenologia

      Concetto di ipoacusia e classificazione

