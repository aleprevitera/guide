backend:
  name: git-gateway
  repo: aleprevitera/guide
  branch: main
  base_url: https://guide-pratiche.netlify.app

# Per lavorare in locale senza server
# local_backend: true

media_folder: "docs/assets/images"
public_folder: "/assets/images"

# ============================================================
# DEFINIZIONE DEI CAMPI (MODIFICA QUI E CAMBIA OVUNQUE)
# ============================================================

x-esame_fields: &esame_fields
  - label: "Nome Esame"
    name: "title"
    widget: "string"

  - label: "CFU"
    name: "cfu"
    widget: "string"
    default: "0"
  
  - label: "Semestre"
    name: "semestre"
    widget: "select"
    options: ["I", "II"]

  # Campo nascosto per attivare la logica Python
  - label: "Tipo Scheda"
    name: "type"
    widget: "hidden"
    default: "scheda_esame"

  # --- NUOVI CAMPI LINK ---
  - label: "Link Cartella Sbobine (Drive)"
    name: "link_sbobine"
    widget: "string"
    required: false
    hint: "Incolla l'URL completo (es. https://drive.google...)"

  - label: "Link Gruppo WhatsApp"
    name: "link_whatsapp"
    widget: "string"
    required: false
    hint: "Link di invito al gruppo"

  # --- DATI TECNICI ---
  - label: "Tempo di Studio"
    name: "study_time"
    widget: "string"
    required: false
    hint: "Es. 2-3 settimane"

  - label: "Difficoltà (1-5)"
    name: "difficulty"
    widget: "select"
    options: ["1", "2", "3", "4", "5"]
    default: "1"

  - label: "Tipologia Esame"
    name: "exam_type"
    widget: "select"
    options: ["Orale", "Scritto", "Scritto + Orale"]
    default: "Orale"

  - label: "Dettagli Modalità Esame"
    name: "exam_details"
    widget: "markdown"
    required: false
    hint: "Descrivi qui i dettagli tecnici (es. 30 domande in 45 minuti)"

  # --- CONTENUTI ---
  - label: "Programma Ufficiale"
    name: "program"
    widget: "markdown"
    required: false

  - label: "Consigli e Materiale"
    name: "material_tips"
    widget: "markdown"
    required: false

  # --- PROFESSORI (Lista annidata) ---
  - label: "Lista Professori"
    name: "professors"
    widget: "list"
    required: false
    fields:
      - {label: "Nome Prof", name: "name", widget: "string"}
      - {label: "Email", name: "email", widget: "string", required: false}
      - {label: "Stile/Domande", name: "style", widget: "text"}

  # --- BODY ---
  - label: "Note Extra"
    name: "body"
    widget: "markdown"
    required: false


# ============================================================
# COLLEZIONI (STRUTTURA DEL SITO)
# ============================================================
collections:
  - name: "anno_1"
    label: "I Anno"
    folder: "docs/I_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields  # <--- MAGIA: Incolla i campi definiti sopra

  - name: "anno_2"
    label: "II Anno"
    folder: "docs/II_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields

  - name: "anno_3"
    label: "III Anno"
    folder: "docs/III_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields

  - name: "anno_4"
    label: "IV Anno"
    folder: "docs/IV_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields

  - name: "anno_5"
    label: "V Anno"
    folder: "docs/V_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields

  - name: "anno_6"
    label: "VI Anno"
    folder: "docs/VI_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields