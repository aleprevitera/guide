backend:
  name: git-gateway

local_backend: true

media_folder: "docs/assets/images"
public_folder: "/assets/images"

collections:
  - name: "anno_1"
    label: "I Anno"
    folder: "docs/I_Anno"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  - name: "anno_2"
    label: "II Anno"
    folder: "docs/II_Anno"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  - name: "anno_3"
    label: "III Anno"
    folder: "docs/III_Anno"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  - name: "anno_4"
    label: "IV Anno"
    folder: "docs/IV_Anno"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  - name: "anno_5"
    label: "V Anno"
    folder: "docs/V_Anno"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  - name: "anno_6"
    label: "VI Anno"
    folder: "docs/VI_Anno"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nome Esame", name: "title", widget: "string"}
      # Questo campo nascosto dice al sistema quale template usare
      - {label: "Layout", name: "template", widget: "hidden", default: "scheda_esame"} 
      
      - {label: "Tempo di Studio Stimato", name: "study_time", widget: "string", hint: "Es. 4-5 settimane"}
      - {label: "Tipologia Esame", name: "exam_type", widget: "select", options: ["Orale", "Scritto", "Scritto + Orale"]}
      
      - {label: "Programma d'Esame", name: "program", widget: "markdown", hint: "Descrivi il programma qui"}
      
      - {label: "Consigli e Materiale", name: "material_tips", widget: "markdown", hint: "Dove studiare, sbobine, ecc."}
      
      - label: "Lista Professori"
        name: "professors"
        widget: "list"
        fields:
          - {label: "Nome Prof", name: "name", widget: "string"}
          - {label: "Stile/Domande tipiche", name: "style", widget: "text"}

      # Il corpo del testo lo nascondiamo o lo usiamo solo per note extra
      - {label: "Note Extra", name: "body", widget: "markdown", required: false}
