backend:
  name: github
  repo: aleprevitera/guide
  branch: main
  base_url: https://api.netlify.com
  site_id: guide-pratiche.netlify.app

media_folder: "docs/assets/images"
public_folder: "/assets/images"

# ============================================================
# DEFINIZIONE DEI CAMPI (MODIFICA QUI E CAMBIA OVUNQUE)
# ============================================================

x-esame_fields: &esame_fields
  - label: "Esame Integrato (Padre)"
    name: "integrated_exam"
    widget: "string"
    required: false
    hint: "Se è un modulo, scrivi qui il nome dell'esame totale (es: Fisiologia)"

  - label: "Nome Esame"
    name: "title"
    widget: "string"

  - label: "CFU"
    name: "cfu"
    widget: "string"
    default: "0"
  
  - label: "Semestre"
    name: "semestre"
    widget: "select"
    options: ["I", "II"]

  # Campo nascosto per attivare la logica Python
  - label: "Tipo Scheda"
    name: "type"
    widget: "hidden"
    default: "scheda_esame"

  # --- NUOVI CAMPI LINK ---
  - label: "Link Cartella Sbobine (Drive)"
    name: "link_sbobine"
    widget: "string"
    required: false
    hint: "Incolla l'URL completo (es. https://drive.google...)"

  - label: "Link Gruppo WhatsApp"
    name: "link_whatsapp"
    widget: "string"
    required: false
    hint: "Link di invito al gruppo"

  # --- DATI TECNICI ---
  - label: "Tempo di Studio"
    name: "study_time"
    widget: "string"
    required: false
    hint: "Es. 2-3 settimane"

  - label: "Difficoltà (1-5)"
    name: "difficulty"
    widget: "select"
    options: ["1", "2", "3", "4", "5"]
    default: "1"

  - label: "Tipologia Esame"
    name: "exam_type"
    widget: "select"
    options: ["Orale", "Scritto", "Scritto + Orale"]
    default: "Orale"

  - label: "Dettagli Modalità Esame"
    name: "exam_details"
    widget: "markdown"
    required: false
    hint: "Descrivi qui i dettagli tecnici (es. 30 domande in 45 minuti)"

  # --- CONTENUTI ---
  - label: "Programma Ufficiale"
    name: "program"
    widget: "markdown"
    required: false

  - label: "Consigli e Materiale"
    name: "material_tips"
    widget: "markdown"
    required: false

  # --- PROFESSORI (Lista annidata) ---
  - label: "Lista Professori"
    name: "professors"
    widget: "list"
    required: false
    fields:
      - {label: "Nome Prof", name: "name", widget: "string"}
      - {label: "Email", name: "email", widget: "string", required: false}
      - {label: "Stile/Domande", name: "style", widget: "text"}

  # --- BODY ---
  - label: "Note Extra"
    name: "body"
    widget: "markdown"
    required: false

x-integrato_fields: &integrato_fields
  - { label: "Nome Esame Integrato", name: "title", widget: "string" }
  - { label: "Tipo Scheda", name: "type", widget: "hidden", default: "scheda_integrato" }
  - { label: "CFU Totali", name: "cfu", widget: "string", default: "0" }
  - { label: "Semestre", name: "semestre", widget: "select", options: ["I", "II"] }
  - { label: "Difficoltà (1-5)", name: "difficulty", widget: "select", options: ["1","2","3","4","5"], default: "1" }
  - { label: "Tipologia Esame", name: "exam_type", widget: "select", options: ["Orale","Scritto","Scritto + Orale"], default: "Orale" }
  - { label: "Dettagli Modalità Esame", name: "exam_details", widget: "markdown", required: false }
  - { label: "Link Sbobine (Drive)", name: "link_sbobine", widget: "string", required: false }
  - { label: "Link Gruppo WhatsApp", name: "link_whatsapp", widget: "string", required: false }
  - { label: "Descrizione / Note Generali", name: "body", widget: "markdown", required: false }

# ============================================================
# COLLEZIONI (STRUTTURA DEL SITO)
# ============================================================
collections:
  - name: "anno_1"
    label: "I Anno"
    folder: "docs/I_Anno"
    path: "{{integrated_exam}}/{{title}}"
    slug: "{{title}}"
    create: true
    filter: { field: "type", value: "scheda_esame" }
    fields: *esame_fields

