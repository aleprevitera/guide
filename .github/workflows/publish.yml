name: Publish Site
on:
  push:
    branches:
      - main  # O 'master', controlla come si chiama il tuo branch principale

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Questo comando crea il sito e lo spinge sul branch 'gh-pages'
      - name: Build & Deploy
        run: mkdocs gh-deploy --force