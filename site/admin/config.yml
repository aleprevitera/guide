backend:
  name: git-gateway
  branch: main # Assicurati che sia 'main' o 'master'

# Per lavorare in locale senza server
local_backend: true

media_folder: "docs/assets/images"
public_folder: "/assets/images"

# ============================================================
# DEFINIZIONE DEI CAMPI (MODIFICA QUI E CAMBIA OVUNQUE)
# ============================================================
x-esame_fields: &esame_fields
  - {label: "Nome Esame", name: "title", widget: "string"}
  
  # Questo attiva la grafica automatica che abbiamo fatto in Python
  - {label: "Tipo Scheda", name: "type", widget: "hidden", default: "scheda_esame"} 

  - {label: "Tempo di Studio", name: "study_time", widget: "string", required: false, hint: "Es. 4-5 settimane"}
  
  - label: "Tipologia Esame"
    name: "exam_type"
    widget: "select"
    options: ["Orale", "Scritto", "Scritto + Orale"]
    default: "Orale"

  - label: "Semestre"
    name: "semester"
    widget: "select"
    options: ["I Semestre", "II Semestre", "Annuale"]
    required: false

  - {label: "Programma", name: "program", widget: "markdown", required: false}
  - {label: "Consigli e Materiale", name: "material_tips", widget: "markdown", required: false}

  - label: "Lista Professori"
    name: "professors"
    widget: "list"
    required: false
    fields:
      - {label: "Nome Prof", name: "name", widget: "string"}
      - {label: "Stile/Domande", name: "style", widget: "text"}

  - {label: "Note Extra / Corpo", name: "body", widget: "markdown", required: false}


# ============================================================
# COLLEZIONI (STRUTTURA DEL SITO)
# ============================================================
collections:
  - name: "anno_1"
    label: "I Anno"
    folder: "docs/I_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields  # <--- MAGIA: Incolla i campi definiti sopra

  - name: "anno_2"
    label: "II Anno"
    folder: "docs/II_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields

  - name: "anno_3"
    label: "III Anno"
    folder: "docs/III_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields

  - name: "anno_4"
    label: "IV Anno"
    folder: "docs/IV_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields

  - name: "anno_5"
    label: "V Anno"
    folder: "docs/V_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields

  - name: "anno_6"
    label: "VI Anno"
    folder: "docs/VI_Anno"
    create: true
    slug: "{{slug}}"
    fields: *esame_fields