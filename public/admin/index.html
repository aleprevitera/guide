<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager · HowToGolgi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Versione bloccata + integrità (SRI): un aggiornamento del CDN non può
         cambiare l'editor da solo. Per aggiornare: nuova versione e nuovo hash
         (openssl dgst -sha384 -binary decap-cms.js | openssl base64 -A). -->
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js" integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p" crossorigin="anonymous"></script>
    <script>
      // Gestisce i redirect di invito/recupero password che Netlify Identity
      // aggiunge come hash all'URL (#invite_token=..., #recovery_token=...).
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
    <script>
      // Widget "readonly-id": id stabile per guide e moduli (es. g-ab12cd34).
      // Se il campo è vuoto genera un id casuale con il prefisso indicato in
      // config.yml ("prefix"); se esiste già lo mostra in sola lettura, così
      // non può essere modificato dall'interfaccia. Formato verificato anche
      // dallo schema Astro (src/content/config.ts), che in build segnala id
      // duplicati (es. entry duplicata con "Duplica").
      (function () {
        var ALPHABET = 'abcdefghijklmnopqrstuvwxyz0123456789';

        function generateId(prefix) {
          var bytes = new Uint8Array(8);
          window.crypto.getRandomValues(bytes);
          var out = '';
          for (var i = 0; i < bytes.length; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
          return prefix + '-' + out;
        }

        var ReadonlyIdControl = createClass({
          componentDidMount: function () {
            if (!this.props.value) {
              this.props.onChange(generateId(this.props.field.get('prefix') || 'x'));
            }
          },
          render: function () {
            return h('input', {
              id: this.props.forID,
              className: this.props.classNameWrapper,
              type: 'text',
              value: this.props.value || '',
              readOnly: true,
              style: { fontFamily: 'monospace', opacity: 0.8 },
            });
          },
        });

        var ReadonlyIdPreview = createClass({
          render: function () {
            return h('code', {}, this.props.value || '');
          },
        });

        CMS.registerWidget('readonly-id', ReadonlyIdControl, ReadonlyIdPreview);
      })();
    </script>
  </body>
</html>
