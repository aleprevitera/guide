backend:
  name: git-gateway
  branch: main

# Attivato automaticamente da Decap quando gira su localhost (richiede
# `npm run cms:local` in un secondo terminale); in produzione (Netlify)
# viene ignorato e si usa git-gateway con Netlify Identity.
local_backend: true

publish_mode: simple

media_folder: "public/images/guide"
public_folder: "/images/guide"

collections:
  - name: "guida"
    label: "Guide per Esame"
    label_singular: "Guida"
    # Notion è la fonte dei contenuti (vedi CLAUDE.md): qui si gestiscono solo
    # link, date e dati della scheda; i testi si correggono in Notion.
    description: "I testi delle guide arrivano da Notion: correggili lì (qui verrebbero sovrascritti al prossimo import). Qui puoi aggiornare link, date e dati della scheda esame (CFU, semestre, frequenza, preappello, durata orale). Non usare \"Duplica\": la copia avrebbe gli stessi ID e il sito non si aggiornerebbe."
    folder: "src/content/guide"
    create: true
    delete: false
    slug: "{{slug}}"
    identifier_field: title
    format: "yaml"
    extension: "yaml"
    # L'anteprima di Decap non ha lo stile del sito e mostrerebbe dati che il
    # sito non pubblica: meglio vedere le modifiche sul sito dopo il salvataggio.
    editor:
      preview: false

    # Raggruppa le entry per anno di corso nella lista, come le sei sezioni
    # per anno del progetto MkDocs esistente — qui però è un unico
    # collection/file per esame (eventualmente multi-modulo).
    view_groups:
      - label: "Anno di Corso"
        field: anno_di_corso

    fields:
      - { label: "ID (automatico, non modificabile)", name: "id", widget: "readonly-id", prefix: "g", required: false, hint: "Identificativo stabile della guida: viene generato da solo e non cambia mai, anche se rinomini l'esame." }
      - { label: "Nome Esame", name: "title", widget: "string", required: true, pattern: ['^.{3,150}$', "Tra 3 e 150 caratteri"] }

      - { label: "Sottotitolo (facoltativo)", name: "sottotitolo", widget: "string", required: false, pattern: ['^.{0,200}$', "Massimo 200 caratteri"], hint: "Una riga sotto il titolo, es. \"Esame integrato del IV anno\"" }

      - label: "Anno di Corso"
        name: "anno_di_corso"
        widget: "select"
        required: true
        options: ["I Anno", "II Anno", "III Anno", "IV Anno", "V Anno", "VI Anno"]

      - { label: "CFU Totali (facoltativo)", name: "cfu_totali", widget: "number", value_type: "int", min: 1, max: 120, required: false }

      - label: "Link Sbobine Generale (Drive, solo se esame a più moduli)"
        name: "link_sbobine_generale"
        widget: "string"
        required: false
        pattern: ['^https?://.+', "URL non valido"]

      - label: "Link Gruppo WhatsApp Generale (solo se esame a più moduli)"
        name: "link_whatsapp_generale"
        widget: "string"
        required: false
        pattern: ['^https?://.+', "URL non valido"]

      - label: "Descrizione Generale (solo se esame a più moduli)"
        name: "descrizione_generale"
        widget: "markdown"
        required: false
        hint: "Arriva da Notion: correggilo in Notion, qui verrebbe sovrascritto al prossimo import."
        minimal: true
        modes: ["rich_text"]
        buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
        editor_components: []
        image: false

      - label: "Moduli"
        name: "moduli"
        widget: "list"
        required: true
        min: 1
        summary: "{{nome_modulo}}"
        hint: "Per un esame a modulo unico, aggiungi un solo modulo con nome uguale al Nome Esame."
        fields:
          - { label: "Nome Modulo", name: "nome_modulo", widget: "string", required: true, pattern: ['^.{1,150}$', "Massimo 150 caratteri"] }
          - { label: "ID modulo (automatico, non modificabile)", name: "id", widget: "readonly-id", prefix: "m", required: false }
          - { label: "CFU", name: "cfu", widget: "number", value_type: "int", min: 1, max: 60, required: false }

          - label: "Semestre"
            name: "semestre"
            widget: "select"
            required: false
            options: ["I", "II"]

          # Non più mostrata nel sito: la difficoltà la votano gli studenti.
          # Nascosta ma conservata nei file.
          - { label: "Difficoltà (non usata)", name: "difficolta", widget: "hidden", required: false }

          - label: "Tipologia Esame"
            name: "exam_type"
            widget: "select"
            required: false
            options: ["Orale", "Scritto", "Scritto + Orale"]

          - { label: "Link Sbobine (Drive)", name: "link_sbobine", widget: "string", required: false, pattern: ['^https?://.+', "URL non valido"], hint: "Incolla l'URL completo (es. https://drive.google...)" }
          - { label: "Link Gruppo WhatsApp", name: "link_whatsapp", widget: "string", required: false, pattern: ['^https?://.+', "URL non valido"], hint: "Link di invito al gruppo" }
          - { label: "Link Google Sheet Domande", name: "google_sheet_url", widget: "string", required: false, pattern: ['^https?://.+', "URL non valido"], hint: "Link pubblico al foglio con le domande passate" }
          # Non più mostrati nel sito: il tempo di studio lo votano gli
          # studenti. Li compila l'import da Notion; nascosti ma conservati.
          - { label: "Tempo di Studio (non usato)", name: "study_time", widget: "hidden", required: false }
          - { label: "Fascia tempo di studio (non usata)", name: "fascia_studio", widget: "hidden", required: false }

          - label: "Preappello"
            name: "preappello"
            widget: "select"
            required: false
            options: ["Sì", "No"]
            hint: "Lascia vuoto se non lo sai."

          - label: "Frequenza"
            name: "frequenza"
            widget: "select"
            required: false
            options: ["Obbligatoria", "Consigliata", "Facoltativa"]

          - { label: "Durata orale (minuti)", name: "durata_orale_min", widget: "number", value_type: "int", min: 1, max: 240, required: false, hint: "Durata indicativa dell'orale per studente" }

          - label: "Modalità d'Esame"
            name: "exam_details"
            widget: "markdown"
            required: false
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
            editor_components: []
            image: false
            hint: "Arriva da Notion: correggilo in Notion, qui verrebbe sovrascritto al prossimo import."

          - label: "Programma"
            name: "program"
            widget: "markdown"
            required: true
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
            editor_components: []
            image: false
            hint: "Arriva da Notion: correggilo in Notion, qui verrebbe sovrascritto al prossimo import."

          - label: "Consigli e Materiale"
            name: "material_tips"
            widget: "markdown"
            required: false
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
            editor_components: []
            image: false
            hint: "Arriva da Notion: correggilo in Notion, qui verrebbe sovrascritto al prossimo import."

          - label: "Docenti"
            name: "professors"
            widget: "list"
            required: false
            summary: "{{nome}}"
            fields:
              - { label: "Nome Docente", name: "nome", widget: "string", required: true, pattern: ['^.{1,150}$', "Massimo 150 caratteri"] }
              - { label: "Email", name: "email", widget: "string", required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Email non valida"] }
              - { label: "Stile/Domande", name: "stile", widget: "text", required: false, pattern: ['^[\\s\\S]{0,500}$', "Massimo 500 caratteri"] }

          - label: "Note Extra"
            name: "body"
            widget: "markdown"
            required: false
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
            editor_components: []
            image: false
            hint: "Arriva da Notion: correggilo in Notion, qui verrebbe sovrascritto al prossimo import."

      - label: "Informazioni da Verificare"
        name: "info_da_verificare"
        widget: "list"
        required: false
        summary: "{{campo}}"
        fields:
          - { label: "Cosa manca / cosa verificare", name: "campo", widget: "string", required: true, pattern: ['^.{1,200}$', "Massimo 200 caratteri"] }
          - label: "Dettagli"
            name: "nota"
            widget: "markdown"
            required: false
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
            editor_components: []
            image: false

      # Solo data (niente ora), già compilata con oggi sulle guide nuove:
      # ricordati di aggiornarla quando modifichi una guida.
      - { label: "Ultimo Aggiornamento", name: "ultimo_aggiornamento", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, default: "{{now}}", hint: "Aggiornala quando modifichi la guida: compare nel footer." }
      - { label: "Autore/i (pubblicato nel footer della guida)", name: "aggiornato_da", widget: "string", required: false, pattern: ['^.{0,100}$', "Massimo 100 caratteri"], hint: "Nome e cognome di chi ha scritto la guida: è visibile a tutti." }
