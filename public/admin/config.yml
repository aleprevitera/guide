backend:
  name: git-gateway
  branch: main

# Attivato automaticamente da Decap quando gira su localhost (richiede
# `npm run cms:local` in un secondo terminale); in produzione (Netlify)
# viene ignorato e si usa git-gateway con Netlify Identity.
local_backend: true

publish_mode: simple

media_folder: "public/images/guide"
public_folder: "/images/guide"

collections:
  - name: "guida"
    label: "Guide per Esame"
    label_singular: "Guida"
    folder: "src/content/guide"
    create: true
    delete: false
    slug: "{{slug}}"
    identifier_field: title
    format: "yaml"
    extension: "yaml"

    # Raggruppa le entry per anno di corso nella lista, come le sei sezioni
    # per anno del progetto MkDocs esistente — qui però è un unico
    # collection/file per esame (eventualmente multi-modulo).
    view_groups:
      - label: "Anno di Corso"
        field: anno_di_corso

    fields:
      - { label: "Nome Esame", name: "title", widget: "string", required: true, pattern: ['^.{3,150}$', "Tra 3 e 150 caratteri"] }

      - label: "Anno di Corso"
        name: "anno_di_corso"
        widget: "select"
        required: true
        options: ["I Anno", "II Anno", "III Anno", "IV Anno", "V Anno", "VI Anno"]

      - { label: "CFU Totali (facoltativo)", name: "cfu_totali", widget: "number", value_type: "int", min: 1, max: 120, required: false }

      - label: "Link Sbobine Generale (Drive, solo se esame a più moduli)"
        name: "link_sbobine_generale"
        widget: "string"
        required: false
        pattern: ['^https?://.+', "URL non valido"]

      - label: "Link Gruppo WhatsApp Generale (solo se esame a più moduli)"
        name: "link_whatsapp_generale"
        widget: "string"
        required: false
        pattern: ['^https?://.+', "URL non valido"]

      - label: "Descrizione Generale (solo se esame a più moduli)"
        name: "descrizione_generale"
        widget: "markdown"
        required: false
        minimal: true
        modes: ["rich_text"]
        buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
        editor_components: []
        image: false

      - label: "Moduli"
        name: "moduli"
        widget: "list"
        required: true
        min: 1
        summary: "{{nome_modulo}}"
        hint: "Per un esame a modulo unico, aggiungi un solo modulo con nome uguale al Nome Esame."
        fields:
          - { label: "Nome Modulo", name: "nome_modulo", widget: "string", required: true }
          - { label: "CFU", name: "cfu", widget: "number", value_type: "int", min: 1, max: 60, required: false }

          - label: "Semestre"
            name: "semestre"
            widget: "select"
            required: false
            options: ["I", "II"]

          - label: "Difficoltà (1-5)"
            name: "difficolta"
            widget: "select"
            required: false
            options: [1, 2, 3, 4, 5]

          - label: "Tipologia Esame"
            name: "exam_type"
            widget: "select"
            required: false
            options: ["Orale", "Scritto", "Scritto + Orale"]

          - { label: "Link Sbobine (Drive)", name: "link_sbobine", widget: "string", required: false, pattern: ['^https?://.+', "URL non valido"], hint: "Incolla l'URL completo (es. https://drive.google...)" }
          - { label: "Link Gruppo WhatsApp", name: "link_whatsapp", widget: "string", required: false, pattern: ['^https?://.+', "URL non valido"], hint: "Link di invito al gruppo" }
          - { label: "Link Google Sheet Domande", name: "google_sheet_url", widget: "string", required: false, pattern: ['^https?://.+', "URL non valido"], hint: "Link pubblico al foglio con le domande passate" }
          - { label: "Tempo di Studio", name: "study_time", widget: "string", required: false, hint: "Es. 2-3 settimane" }

          - label: "Modalità d'Esame"
            name: "exam_details"
            widget: "markdown"
            required: false
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
            editor_components: []
            image: false
            hint: "Descrivi qui i dettagli tecnici (es. 30 domande in 45 minuti)"

          - label: "Programma"
            name: "program"
            widget: "markdown"
            required: true
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
            editor_components: []
            image: false

          - label: "Consigli e Materiale"
            name: "material_tips"
            widget: "markdown"
            required: false
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
            editor_components: []
            image: false

          - label: "Docenti"
            name: "professors"
            widget: "list"
            required: false
            summary: "{{nome}}"
            fields:
              - { label: "Nome Docente", name: "nome", widget: "string", required: true }
              - { label: "Email", name: "email", widget: "string", required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Email non valida"] }
              - { label: "Stile/Domande", name: "stile", widget: "text", required: false }

          - label: "Note Extra"
            name: "body"
            widget: "markdown"
            required: false
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
            editor_components: []
            image: false

      - label: "Informazioni da Verificare"
        name: "info_da_verificare"
        widget: "list"
        required: false
        summary: "{{campo}}"
        fields:
          - { label: "Cosa manca / cosa verificare", name: "campo", widget: "string", required: true }
          - label: "Dettagli"
            name: "nota"
            widget: "markdown"
            required: false
            minimal: true
            modes: ["rich_text"]
            buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
            editor_components: []
            image: false

      - { label: "Ultimo Aggiornamento", name: "ultimo_aggiornamento", widget: "datetime", required: true, format: "YYYY-MM-DD" }
      - { label: "Aggiornato da (nome, facoltativo)", name: "aggiornato_da", widget: "string", required: false }
